<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מרכז שליטה">
  <title>מרכז שליטה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================
   מרכז שליטה — עיצוב צבעוני, מותאם מחשב / אייפד / נייד
   כל הצבעים מוגדרים כאן במשתנים — קל להחליף לפלטה של אתר הגבול
   ========================================================== */
:root {
  --bg: #f3f5fb;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --text: #1b1f3b;
  --muted: #6b7194;
  --border: #e4e7f2;
  --side-1: #1e1b4b;
  --side-2: #3b2f8f;

  --c-orders: #2563eb;  --c-orders-soft: #e0eaff;
  --c-agree: #0d9488;   --c-agree-soft: #d7f5f1;
  --c-tasks: #ea7a0c;   --c-tasks-soft: #ffedd9;
  --c-notes: #db2777;   --c-notes-soft: #fde4ef;
  --c-report: #7c3aed;  --c-report-soft: #ede4ff;
  --c-alert: #dc2626;   --c-alert-soft: #fde2e2;
  --c-warn: #d97706;    --c-warn-soft: #fef1d6;
  --c-ok: #16a34a;      --c-ok-soft: #dcf5e4;

  --radius: 16px;
  --shadow: 0 2px 4px rgba(30, 27, 75, .04), 0 8px 24px rgba(30, 27, 75, .06);
  --side-w: 250px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Heebo', system-ui, sans-serif; background: var(--bg); color: var(--text);
  direction: rtl; font-size: 15px; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--c-orders); }
.hidden { display: none !important; }

/* ---------- מבנה ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--side-w); flex-shrink: 0; position: fixed; inset: 0 0 0 auto; z-index: 30;
  background: linear-gradient(180deg, var(--side-1), var(--side-2)); color: #fff;
  display: flex; flex-direction: column; padding: 20px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-logo {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px;
  background: conic-gradient(from 200deg, #60a5fa, #34d399, #fbbf24, #f472b6, #a78bfa, #60a5fa);
}
.brand b { display: block; font-size: 17px; }
.brand small { opacity: .7; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: rgba(255,255,255,.82);
  text-decoration: none; font-weight: 500; transition: background .15s;
}
.nav a:hover { background: rgba(255,255,255,.08); }
.nav a.active { background: rgba(255,255,255,.16); color: #fff; }
.nav .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.nav .count { margin-inline-start: auto; background: var(--c-alert); color: #fff; font-size: 12px; border-radius: 99px; padding: 1px 8px; }
.side-foot { margin-top: auto; font-size: 13px; opacity: .85; padding: 8px; }
.side-foot .mode { display: inline-block; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.15); margin-bottom: 6px; }

.main { flex: 1; margin-inline-start: var(--side-w); min-width: 0; padding: 0 28px 40px; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 16px 0;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.topbar h1 { font-size: 24px; margin: 0; font-weight: 800; }
.topbar .sub { color: var(--muted); font-size: 13px; }
.topbar .spacer { flex: 1; }
.search { position: relative; }
.search input { width: 240px; padding: 10px 38px 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn .badge { position: absolute; top: -5px; left: -5px; background: var(--c-alert); color: #fff; font-size: 11px; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 5px; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--c-report), var(--c-notes)); }

/* ---------- כרטיסים ---------- */
.grid { display: grid; gap: 18px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kpi {
  border-radius: var(--radius); padding: 18px; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow); cursor: pointer;
}
.kpi::after { content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.12); left: -40px; bottom: -60px; }
.kpi .lbl { font-size: 13px; opacity: .9; }
.kpi .val { font-size: 30px; font-weight: 800; margin-top: 4px; line-height: 1.1; }
.kpi .meta { font-size: 12.5px; opacity: .85; margin-top: 6px; }
.kpi.orders { background: linear-gradient(135deg, #2563eb, #4f46e5); }
.kpi.agree  { background: linear-gradient(135deg, #0d9488, #059669); }
.kpi.tasks  { background: linear-gradient(135deg, #f59e0b, #ea580c); }
.kpi.alerts { background: linear-gradient(135deg, #ef4444, #db2777); }
.kpi.money  { background: linear-gradient(135deg, #7c3aed, #c026d3); }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.card-h .spacer { flex: 1; }
.card-h .tag { width: 8px; height: 22px; border-radius: 4px; }
.dash-2 { grid-template-columns: 1.3fr 1fr; margin-top: 18px; }
.dash-3 { grid-template-columns: repeat(3, 1fr); margin-top: 18px; }

/* ---------- כפתורים וטפסים ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 11px; padding: 10px 16px;
  font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap;
}
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--c-orders); color: #fff; border-color: transparent; }
.btn.teal { background: var(--c-agree); color: #fff; border-color: transparent; }
.btn.orange { background: var(--c-tasks); color: #fff; border-color: transparent; }
.btn.pink { background: var(--c-notes); color: #fff; border-color: transparent; }
.btn.violet { background: var(--c-report); color: #fff; border-color: transparent; }
.btn.danger { background: var(--c-alert-soft); color: var(--c-alert); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .toolbar select, .toolbar input {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); outline: none; width: 100%;
}
.toolbar select, .toolbar input { width: auto; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--c-orders); box-shadow: 0 0 0 3px var(--c-orders-soft); }
.field textarea { min-height: 80px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field.found input { background: #f0fbf4; border-color: #9fdcb5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13.5px; }
.chip.on { background: var(--text); color: #fff; border-color: var(--text); }

/* ---------- תגיות סטטוס ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.pill.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.pill.bad { background: var(--c-alert-soft); color: var(--c-alert); }
.pill.gray { background: #eceef5; color: var(--muted); }
.pill.blue { background: var(--c-orders-soft); color: var(--c-orders); }
.pill.violet { background: var(--c-report-soft); color: var(--c-report); }

/* ---------- טבלאות ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; transition: background .12s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .strong { font-weight: 700; }
.tbl .sub { color: var(--muted); font-size: 12.5px; }
.bar { height: 7px; background: #eceef5; border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--c-ok); }
.bar.warn > span { background: var(--c-warn); }
.bar.bad > span { background: var(--c-alert); }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }

/* כרטיסיות במקום טבלה בנייד */
.mcards { display: none; flex-direction: column; gap: 10px; }
.mcard { background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); border-inline-start: 5px solid var(--c-orders); }
.mcard .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mcard .t { font-weight: 700; }
.mcard .m { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* ---------- התראות ---------- */
.alerts { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.alert { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 12px; background: var(--surface-2); border-inline-start: 4px solid var(--c-warn); cursor: pointer; }
.alert.bad { border-color: var(--c-alert); background: #fff6f6; }
.alert.info { border-color: var(--c-orders); }
.alert .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; }
.alert .tx { flex: 1; min-width: 0; }
.alert .tx b { display: block; font-size: 14px; }
.alert .tx span { color: var(--muted); font-size: 12.5px; }
.alert .days { font-weight: 800; font-size: 18px; text-align: center; line-height: 1; }
.alert .days small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------- ציר זמן ---------- */
.timeline { position: relative; padding-right: 18px; }
.timeline::before { content: ''; position: absolute; right: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item::before { content: ''; position: absolute; right: -18px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-orders); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--c-orders-soft); }
.tl-item.increase::before { background: var(--c-ok); }
.tl-item.decrease::before { background: var(--c-alert); }
.tl-item.extend::before { background: var(--c-report); }
.tl-item.link::before { background: var(--c-tasks); }
.tl-item .d { font-size: 12px; color: var(--muted); }

/* ---------- קנבן משימות ---------- */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; min-height: 300px; border: 1px solid var(--border); }
.col.drag-over { outline: 2px dashed var(--c-tasks); }
.col-h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; }
.col-h .n { background: var(--surface); border-radius: 99px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
.task { background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 9px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: grab; border-inline-start: 4px solid var(--c-tasks); }
.task.p-urgent { border-color: var(--c-alert); }
.task.p-high { border-color: var(--c-tasks); }
.task.p-normal { border-color: var(--c-orders); }
.task.p-low { border-color: #a3a9c7; }
.task .t { font-weight: 600; margin-bottom: 6px; }
.task .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.task.overdue .due { color: var(--c-alert); font-weight: 700; }

/* ---------- פיתקיות ---------- */
.quick-note { display: flex; gap: 10px; margin-bottom: 18px; }
.quick-note textarea { flex: 1; min-height: 52px; padding: 14px; border-radius: 14px; border: 2px dashed #f4a7c8; background: #fff8fb; resize: vertical; font-size: 16px; }
.notes-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.sticky {
  min-height: 170px; padding: 16px; border-radius: 4px 4px 18px 4px; box-shadow: 0 6px 16px rgba(0,0,0,.08); display: flex; flex-direction: column;
  transform: rotate(var(--rot, 0deg)); transition: transform .15s;
}
.sticky:hover { transform: rotate(0) scale(1.02); }
.sticky .txt { flex: 1; white-space: pre-wrap; font-size: 15.5px; line-height: 1.5; outline: none; }
.sticky .foot { display: flex; gap: 4px; align-items: center; margin-top: 10px; font-size: 12px; opacity: .8; }
.sticky .foot .spacer { flex: 1; }
/* */
.sticky button { white-space: nowrap; background: rgba(255,255,255,.6); border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 12.5px; }
.s-yellow { background: #fff3a8; } .s-pink { background: #ffd1e3; } .s-blue { background: #cfe6ff; }
.s-green { background: #d2f5d6; } .s-orange { background: #ffdcb8; } .s-violet { background: #e4d9ff; }
.color-dots { display: flex; gap: 4px; }
.color-dots i { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,.1); }

/* ---------- אזור גרירת PDF ---------- */
.dropzone {
  border: 2px dashed #9db8f5; border-radius: var(--radius); padding: 22px; text-align: center; background: linear-gradient(135deg, #f1f6ff, #f6f1ff);
  cursor: pointer; transition: all .15s; margin-bottom: 16px;
}
.dropzone.over { border-color: var(--c-orders); background: var(--c-orders-soft); transform: scale(1.01); }
.dropzone b { color: var(--c-orders); }
.dropzone .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.page-drop { position: fixed; inset: 0; background: rgba(37,99,235,.18); backdrop-filter: blur(2px); z-index: 90; display: grid; place-items: center; pointer-events: none; }
.page-drop div { background: #fff; padding: 30px 40px; border-radius: 20px; font-size: 20px; font-weight: 700; color: var(--c-orders); box-shadow: var(--shadow); }

/* ---------- חלונות ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 18, 50, .45); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; width: min(760px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(980px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-h h3 { margin: 0; font-size: 18px; flex: 1; }
.modal-b { padding: 20px; }
.modal-f { display: flex; gap: 10px; justify-content: flex-start; padding: 14px 20px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); flex-wrap: wrap; }
.modal-f .spacer { flex: 1; }
.section-t { font-weight: 700; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.info { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.info small { display: block; color: var(--muted); font-size: 12px; }
.info b { font-size: 15px; }
.banner { padding: 12px 14px; border-radius: 12px; background: var(--c-ok-soft); color: #14532d; margin-bottom: 14px; font-size: 14px; }
.banner.warn { background: var(--c-warn-soft); color: #78350f; }

.toast-wrap { position: fixed; bottom: 24px; left: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow); animation: up .2s ease-out; }
.toast.error { background: var(--c-alert); }
.toast.ok { background: var(--c-ok); }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }

/* ---------- מסך כניסה ---------- */
.login { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #1e1b4b, #3b2f8f 45%, #0d9488); padding: 16px; }
.login .box { background: #fff; border-radius: 24px; padding: 32px; width: min(400px, 100%); box-shadow: 0 30px 60px rgba(0,0,0,.3); }
.login h1 { margin: 12px 0 4px; }
.login p { color: var(--muted); margin: 0 0 20px; }
.login .field { margin-bottom: 14px; }

/* ---------- ניווט תחתון ו-FAB לנייד ---------- */
.bottom-nav { display: none; }
.fab { display: none; }
.fab-menu { display: none; }

/* ---------- דוח מודפס ---------- */
.report-doc { direction: rtl; font-family: 'Heebo', sans-serif; color: #1b1f3b; padding: 10px; background: #fff; }
.report-doc h1 { font-size: 22px; margin: 0 0 4px; }
.report-doc h2 { font-size: 16px; margin: 20px 0 8px; padding: 6px 10px; border-radius: 8px; color: #fff; }
.report-doc table { width: 100%; border-collapse: collapse; font-size: 11px; }
.report-doc th { background: #eef1fb; text-align: right; padding: 6px; border: 1px solid #dfe3f0; }
.report-doc td { padding: 5px 6px; border: 1px solid #e7eaf3; }
.report-doc tr { page-break-inside: avoid; }
.report-doc.pdf-mode, .report-doc.pdf-mode * { letter-spacing: .01px; }
.report-doc .meta { color: #6b7194; font-size: 12px; }
.report-doc .sum { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.report-doc .sum div { background: #f3f5fb; border-radius: 8px; padding: 6px 10px; font-size: 12px; }


/* ---------- תתי-משימות ויומן ---------- */
.subs { display: flex; flex-direction: column; gap: 6px; }
.subs .sub { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.subs .sub input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--c-ok); flex-shrink: 0; cursor: pointer; }
.subs .sub .sub-t { flex: 1; min-width: 0; }
.subs .sub .sub-t small { display: block; color: var(--muted); font-size: 11.5px; }
.subs .sub.done .sub-t { text-decoration: line-through; color: var(--muted); }
.subs .sub input[type=date] { border: 1px solid var(--border); border-radius: 8px; padding: 5px 6px; background: var(--surface); font-size: 13px; }
.subs .sub input[type=date].late { border-color: var(--c-alert); color: var(--c-alert); background: var(--c-alert-soft); }
.sub-add { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sub-add input { padding: 9px 11px; border: 1px dashed #f2b27a; border-radius: 10px; background: #fffaf5; }
.sub-add input#subTitle { flex: 1; min-width: 160px; }
.log-add { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--c-tasks-soft); margin-bottom: 12px; }
.log-add textarea { min-height: 60px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; resize: vertical; background: var(--surface); }
.log-add input[type=datetime-local] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.log { display: flex; flex-direction: column; gap: 8px; }
.log-item { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }

/* ==========================================================
   קליטת הזמנת עבודה של משהב"ט מקובץ PDF
   - חילוץ טקסט עם pdf.js (בדפדפן)

(function (global) {
  'use strict';

  const Q = '["״\'׳]'; // סוגי גרשיים אפשריים
  const DATE = '(\\d{1,2}[./]\\d{1,2}[./]\\d{2,4})';

    if (!d) return '';

    let desc = first(t, /תיאור\s*:\s*(.+?)(?:\s{2,}|\n)/);

    set('vat', num(first(t, new RegExp(`(?<!ללא\\s*)(?<![א-ת])מע${Q}מ\\s*:\\s*${MONEY}`))));
    set('budgetTotal', num(first(t, new RegExp(`סה${Q}כ\\s*סכום\\s*ההזמנה\\s*:\\s*${MONEY}`))));

    if (a.cancelled) return { k: 'cancelled', l: 'בוטל', c: 'gray' };
    if (dl != null && dl < 0) return { k: 'ended', l: 'הסתיים', c: 'gray' };
    if (dl != null && dl <= st.alertDays) return { k: 'ending', l: 'מסתיים בקרוב', c: 'bad' };
    if (dl != null && dl <= st.warnDays) return { k: 'soon', l: `${dl} ימים לסיום`, c: 'warn' };
    return { k: 'active', l: 'בתוקף', c: 'ok' };
  }
  const isActiveOrder = (o) => ['active', 'soon', 'ending'].includes(orderStatus(o).k);
  const isActiveAgree = (a) => ['active', 'soon', 'ending'].includes(agreeStatus(a).k);
  const barCls = (p) => { const st = settings(); return p >= st.utilCritical ? 'bad' : p >= st.utilWarn ? 'warn' : ''; };
  const bar = (p) => `<div class="bar ${barCls(p)}"><span style="width:${Math.min(100, p)}%"></span></div>`;

  /* ---------------- התראות ---------------- */
  function computeAlerts() {
    const st = settings(); const out = [];
    const snoozed = (k) => st.snoozed && st.snoozed[k] && st.snoozed[k] >= today();
    S.orders.forEach((o) => {
      if (!isActiveOrder(o)) return;
      const dl = daysLeft(o.endDate);
      if (dl != null && dl <= st.warnDays) out.push({ key: 'oe-' + o.id, level: dl <= st.alertDays ? 'bad' : 'warn', ic: '📄', bg: 'var(--c-orders-soft)',
        title: `הזמנה ${o.orderNumber} מסתיימת`, sub: `${o.supplier || ''} · סיום ${dfmt(o.endDate)}`, days: dl, open: ['order', o.id] });
      const p = pct(o.utilized || 0, o.budgetExVat);
      if (p >= st.utilWarn) out.push({ key: 'ou-' + o.id + '-' + (p >= st.utilCritical ? 'c' : 'w'), level: p >= st.utilCritical ? 'bad' : 'warn', ic: '💰', bg: 'var(--c-warn-soft)',
        title: `ניצול ${p}% בהזמנה ${o.orderNumber}`, sub: `נוצלו ${money(o.utilized)} מתוך ${money(o.budgetExVat)}`, days: null, pct: p, open: ['order', o.id] });
    });
    S.agreements.forEach((a) => {
      if (!isActiveAgree(a)) return;
      const dl = daysLeft(a.endDate);
      if (dl != null && dl <= st.warnDays) out.push({ key: 'ae-' + a.id, level: dl <= st.alertDays ? 'bad' : 'warn', ic: '📑', bg: 'var(--c-agree-soft)',
        title: `הסכם ${a.agreementNumber} מסתיים`, sub: `${a.name || ''} · ${a.contractor || ''}`, days: dl, open: ['agreement', a.id] });
      const p = pct(a.utilized || 0, a.targetValue);
      if (p >= st.utilWarn) out.push({ key: 'au-' + a.id + '-' + (p >= st.utilCritical ? 'c' : 'w'), level: p >= st.utilCritical ? 'bad' : 'warn', ic: '📊', bg: 'var(--c-warn-soft)',
        title: `ניצול ${p}% מערך היעד`, sub: `${a.name || a.agreementNumber}`, days: null, pct: p, open: ['agreement', a.id] });
    });
    S.tasks.forEach((t) => {
      if (t.status === 'done') return;
      (t.subtasks || []).forEach((x) => {
        if (x.done || !x.dueDate) return; const d = daysLeft(x.dueDate);
        if (d < 0) out.push({ key: 'so-' + t.id + '-' + x.id, level: 'bad', ic: '☑️', bg: 'var(--c-tasks-soft)', title: `תת‑משימה באיחור: ${x.title}`, sub: `במשימה: ${t.title}`, days: d, open: ['task', t.id] });
        else if (d <= 1) out.push({ key: 'sd-' + t.id + '-' + x.id, level: 'info', ic: '☑️', bg: 'var(--c-tasks-soft)', title: `${d === 0 ? 'היום' : 'מחר'}: ${x.title}`, sub: `במשימה: ${t.title}`, days: d, open: ['task', t.id] });
      });
      if (!t.dueDate) return;
      const dl = daysLeft(t.dueDate);
      if (dl < 0) out.push({ key: 'to-' + t.id, level: 'bad', ic: '⏰', bg: 'var(--c-tasks-soft)', title: `משימה באיחור: ${t.title}`, sub: `יעד ${dfmt(t.dueDate)} · ${t.assignee || ''}`, days: dl, open: ['task', t.id] });
      else if (dl <= 1) out.push({ key: 'td-' + t.id, level: 'info', ic: '✅', bg: 'var(--c-tasks-soft)', title: `${dl === 0 ? 'היום' : 'מחר'}: ${t.title}`, sub: t.assignee || '', days: dl, open: ['task', t.id] });
    });
    const rank = { bad: 0, warn: 1, info: 2 };
    return out.filter((a) => !snoozed(a.key)).sort((a, b) => rank[a.level] - rank[b.level] || (a.days ?? 999) - (b.days ?? 999));
  }
  function alertHTML(a) {
    const days = a.days == null ? `<div class="days">${a.pct}%<small>ניצול</small></div>`
      : a.days < 0 ? `<div class="days" style="color:var(--c-alert)">${Math.abs(a.days)}<small>ימי איחור</small></div>`
        : `<div class="days">${a.days}<small>ימים</small></div>`;
    return `<div class="alert ${a.level}" data-act="open" data-kind="${a.open[0]}" data-id="${a.open[1]}">
      <div class="ic" style="background:${a.bg}">${a.ic}</div>
      <div class="tx"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></div>${days}
      <button class="btn sm ghost" data-act="snooze" data-key="${a.key}" title="השתק לשבוע">🔕</button></div>`;
  }

  /* ---------------- שלד ---------------- */
  function shell(content, title, sub, actions = '') {
    const alerts = computeAlerts();
    const openTasks = S.tasks.filter((t) => t.status !== 'done').length;
    const counts = { tasks: openTasks, dashboard: alerts.filter((a) => a.level === 'bad').length };
    const u = DB.user;
    return `<div class="app">
      <aside class="sidebar">
        <div class="brand"><div class="brand-logo">✦</div><div><b>מרכז שליטה</b><small>הזמנות · הסכמים · משימות</small></div></div>
        <nav class="nav">${NAV.map((x) => `<a href="#${x.id}" class="${S.route === x.id ? 'active' : ''}" title="${x.label}">
          <span class="dot" style="background:${x.color}"></span>${ICONS[x.id === 'config' ? 'settings' : x.id]}<span class="lbl">${x.label}</span>${counts[x.id] ? `<span class="count">${counts[x.id]}</span>` : ''}</a>`).join('')}</nav>
        <div class="side-foot"><span class="mode">${DB.mode === 'demo' ? 'מצב הדגמה' : 'מחובר ל‑Firebase'}</span><br>${esc(u.name)} · ${u.role === 'commander' ? 'מפקד' : u.role === 'admin' ? 'מנהל' : 'רל"שית'}</div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
          <div class="spacer"></div>
          ${actions}
          <div class="search">${ICONS.search}<input id="gsearch" placeholder="חיפוש הזמנה, הסכם, ספק, משימה…" value="${esc(S.q)}" autocomplete="off"></div>
          <button class="icon-btn" data-act="alerts" title="התראות">${ICONS.bell}${alerts.length ? `<span class="badge">${alerts.length}</span>` : ''}</button>
          <div class="user-chip" data-act="user"><div class="avatar">${esc((u.name || '?').slice(0, 1))}</div><span class="nm">${esc(u.name)}</span></div>
        </div>
        <div id="search-results"></div>
        ${content}
      </main>
      <nav class="bottom-nav">${['dashboard', 'tasks', 'projects', 'notes'].map((id) => { const x = NAV.find((y) => y.id === id);
        return `<a href="#${id}" class="${S.route === id ? 'active' : ''}">${ICONS[id]}<span>${x.label.split(' ')[0]}</span>${counts[id] ? `<span class="count">${counts[id]}</span>` : ''}</a>`; }).join('')}
        <a href="#" data-act="more-nav" class="${['orders', 'agreements', 'people', 'reports', 'config'].includes(S.route) ? 'active' : ''}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>עוד</span></a></nav>
      <button class="fab" data-act="fab">+</button>
      <div class="fab-menu" id="fabmenu">
        <button class="btn orange" data-act="quick-task">✅ משימה מהירה</button>
        <button class="btn pink" data-act="quick-note">🗒️ פיתקית</button>
        <button class="btn primary" data-act="new-order">📄 הזמנה חדשה</button>
      </div>
    </div>`;
  }

  /* ---------------- דשבורד ---------------- */
  function viewDashboard() {
    const st = settings();
    const activeO = S.orders.filter(isActiveOrder);
    const activeA = S.agreements.filter(isActiveAgree);
    const open = S.tasks.filter((t) => t.status !== 'done');
    const overdue = open.filter((t) => t.dueDate && daysLeft(t.dueDate) < 0);
    const alerts = computeAlerts();
    const budget = activeO.reduce((s, o) => s + (o.budgetExVat || 0), 0);
    const used = activeO.reduce((s, o) => s + (o.utilized || 0), 0);
    const target = activeA.reduce((s, a) => s + (a.targetValue || 0), 0);

    // תחזית סיומים ל‑12 חודשים
    const months = [];
    for (let i = 0; i < 12; i++) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + i); months.push({ key: d.toISOString().slice(0, 7), label: d.toLocaleDateString('he-IL', { month: 'short' }), o: 0, a: 0 }); }
    activeO.forEach((o) => { const m = months.find((x) => x.key === (o.endDate || '').slice(0, 7)); if (m) m.o++; });
    activeA.forEach((a) => { const m = months.find((x) => x.key === (a.endDate || '').slice(0, 7)); if (m) m.a++; });
    const maxM = Math.max(1, ...months.map((m) => m.o + m.a));

    const myTasks = open.slice().sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999')).slice(0, 6);
    const pinned = S.notes.filter((x) => x.pinned).slice(0, 4);

    const content = `
      <div class="grid kpis">
        <div class="kpi orders" data-go="orders"><div class="lbl">הזמנות פעילות</div><div class="val">${activeO.length}</div><div class="meta">${money(budget)} לפני מע"מ</div></div>
        <div class="kpi money" data-go="orders"><div class="lbl">ניצול תקציב הזמנות</div><div class="val">${pct(used, budget)}%</div><div class="meta">${money(used)} נוצלו</div></div>
        <div class="kpi agree" data-go="agreements"><div class="lbl">הסכמים בתוקף</div><div class="val">${activeA.length}</div><div class="meta">ערך יעד ${money(target)}</div></div>
        <div class="kpi tasks" data-go="tasks"><div class="lbl">משימות פתוחות</div><div class="val">${open.length}</div><div class="meta">${overdue.length ? `${overdue.length} באיחור` : 'אין איחורים'}</div></div>
        <div class="kpi alerts" data-act="alerts"><div class="lbl">התראות</div><div class="val">${alerts.length}</div><div class="meta">${alerts.filter((a) => a.level === 'bad').length} דחופות · ${st.alertDays} ימים מראש</div></div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-alert)"></span><h2>לוח התראות</h2><div class="spacer"></div><span class="sub" style="color:var(--muted);font-size:12.5px">אדום ≤ ${st.alertDays} ימים · כתום ≤ ${st.warnDays}</span></div>
          <div class="alerts">${alerts.length ? alerts.map(alertHTML).join('') : '<div class="empty">🎉 אין התראות פתוחות</div>'}</div></div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-tasks)"></span><h2>משימות קרובות</h2><div class="spacer"></div><button class="btn sm orange" data-act="quick-task">+ משימה</button></div>
          ${myTasks.length ? myTasks.map(taskCard).join('') : '<div class="empty">אין משימות פתוחות</div>'}</div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-report)"></span><h2>תחזית סיומים — 12 חודשים</h2></div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px">
            ${months.map((m) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end" title="${m.o} הזמנות, ${m.a} הסכמים">
              <small style="font-weight:700">${m.o + m.a || ''}</small>
              <div style="width:100%;max-width:34px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;height:${((m.o + m.a) / maxM) * 120}px">
                <div style="flex:${m.a};background:var(--c-agree)"></div><div style="flex:${m.o};background:var(--c-orders)"></div></div>
              <small style="color:var(--muted);font-size:11px">${m.label}</small></div>`).join('')}
          </div>
          <div style="display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px"><span>■ <b style="color:var(--c-orders)">הזמנות</b></span><span>■ <b style="color:var(--c-agree)">הסכמים</b></span></div>
        </div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-agree)"></span><h2>ניצול הסכמים</h2></div>
          ${activeA.length ? activeA.map((a) => { const p = pct(a.utilized || 0, a.targetValue); return `<div style="margin-bottom:12px;cursor:pointer" data-act="open" data-kind="agreement" data-id="${a.id}">
            <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px"><b>${esc(a.name || a.agreementNumber)}</b><span>${p}%</span></div>${bar(p)}
            <div style="font-size:12px;color:var(--muted);margin-top:3px">${money(a.utilized)} מתוך ${money(a.targetValue)} · עד ${dfmt(a.endDate)}</div></div>`; }).join('') : '<div class="empty">אין הסכמים פעילים</div>'}
        </div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-orders)"></span><h2>הזמנות פעילות — ניצול</h2><div class="spacer"></div><a href="#orders" style="font-size:13px">לכל ההזמנות ←</a></div>
          ${activeO.length ? activeO.sort((a, b) => (a.endDate || '').localeCompare(b.endDate || '')).slice(0, 6).map((o) => { const p = pct(o.utilized || 0, o.budgetExVat); const s = orderStatus(o);
            return `<div style="margin-bottom:12px;cursor:pointer" data-act="open" data-kind="order" data-id="${o.id}">
            <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px"><span><b>${esc(o.orderNumber)}</b> · ${esc(o.supplier || '')}</span><span class="pill ${s.c}">${s.l}</span></div>${bar(p)}
            <div style="font-size:12px;color:var(--muted);margin-top:3px">${p}% · ${money(o.utilized)} מתוך ${money(o.budgetExVat)}</div></div>`; }).join('') : '<div class="empty">אין הזמנות פעילות</div>'}
        </div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-notes)"></span><h2>פיתקיות מוצמדות ופעילות אחרונה</h2></div>
          ${pinned.length ? `<div class="notes-board" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:14px">${pinned.map((x) => `<div class="sticky s-${x.color || 'yellow'}" style="min-height:90px;--rot:0deg"><div class="txt" style="font-size:14px">${esc(x.text)}</div></div>`).join('')}</div>` : ''}
          ${S.activity.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 7).map((x) => `<div style="display:flex;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border)">
            <b>${esc(x.user)}</b><span style="flex:1">${esc(x.action)} ${esc(x.label || '')}</span><span style="color:var(--muted);font-size:12px">${dfmt((x.createdAt || '').slice(0, 10))}</span></div>`).join('') || '<div class="empty" style="padding:16px">עדיין אין פעילות</div>'}
        </div>
      </div>`;
    const h = new Date().getHours();
    return shell(content, `${h < 12 ? 'בוקר טוב' : h < 18 ? 'צהריים טובים' : 'ערב טוב'}, ${esc(DB.user.name)}`, new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      `<button class="btn violet" data-act="report-quick">⬇ דוח מהיר</button>`);
  }

  /* ---------------- טבלה כללית עם מיון ---------------- */
  function sortRows(rows, key, cols) {
    const s = S.f.sort[key]; if (!s) return rows;
    const col = cols.find((c) => c.k === s.k); if (!col) return rows;
    const get = col.sv || ((r) => r[col.k]);
    return rows.slice().sort((a, b) => { const x = get(a), y = get(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'he'); return s.dir * r; });
  }
  function table(key, cols, rows, kind) {
    const s = S.f.sort[key] || {};
    return `<div class="card table-wrap responsive"><table class="tbl"><thead><tr>${cols.map((c) => `<th data-act="sort" data-key="${key}" data-k="${c.k}">${c.l}${s.k === c.k ? (s.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.length ? rows.map((r) => `<tr data-act="open" data-kind="${kind}" data-id="${r.id}">${cols.map((c) => `<td class="${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">לא נמצאו רשומות</td></tr>`}</tbody></table></div>`;
  }
  const match = (obj, q) => !q || JSON.stringify(obj).toLowerCase().includes(q.toLowerCase());

  /* ---------------- הזמנות ---------------- */
  const ORDER_COLS = [
    { k: 'orderNumber', l: 'מס׳ הזמנה', cls: 'strong', v: (o) => `${esc(o.orderNumber)}${o.version ? `<div class="sub">גרסה ${esc(o.version)}</div>` : ''}` },
    { k: 'demandNumber', l: 'מס׳ דרישה', v: (o) => esc(o.demandNumber || '—') },
    { k: 'supplier', l: 'ספק', v: (o) => `${esc(o.supplier || '—')}<div class="sub">${esc(o.description || '')}</div>` },
    { k: 'demandBudget', l: 'תקציב בדרישה', cls: 'num', v: (o) => money(o.demandBudget) },
    { k: 'budgetExVat', l: 'תקציב בהזמנה', cls: 'num', v: (o) => `${money(o.budgetExVat)}<div class="sub">כולל מע"מ ${money(o.budgetTotal)}</div>` },
    { k: 'utilized', l: 'ניצול', sv: (o) => pct(o.utilized || 0, o.budgetExVat), v: (o) => { const p = pct(o.utilized || 0, o.budgetExVat); return `${bar(p)}<div class="sub">${p}%</div>`; } },
    { k: 'startDate', l: 'תחילה', cls: 'num', v: (o) => dfmt(o.startDate) },
    { k: 'endDate', l: 'סיום', cls: 'num', v: (o) => dfmt(o.endDate) },
    { k: 'status', l: 'סטטוס', sv: (o) => orderStatus(o).l, v: (o) => { const s = orderStatus(o); return `<span class="pill ${s.c}">${s.l}</span>${o.linkedTo ? '<div class="sub">🔗 הזמנת המשך</div>' : o.parentId ? '<div class="sub">↩ המשך להזמנה קודמת</div>' : ''}`; } },
  ];
  function viewOrders() {
    const fs = S.f.orderStatus;
    let rows = S.orders.filter((o) => match(o, S.q)).filter((o) => { const k = orderStatus(o).k;
      return fs === 'all' || (fs === 'active' && ['active', 'soon', 'ending'].includes(k)) || (fs === 'ending' && ['soon', 'ending'].includes(k)) || (fs === 'closed' && ['ended', 'linked', 'cancelled'].includes(k)); });
    rows = sortRows(rows.sort((a, b) => (a.endDate || '').localeCompare(b.endDate || '')), 'orders', ORDER_COLS);
    const chips = [['all', 'הכל'], ['active', 'פעילות'], ['ending', 'מסתיימות בקרוב'], ['closed', 'סגורות / הועברו']];
    const totB = rows.reduce((s, o) => s + (o.budgetExVat || 0), 0);
    const content = `
      <div class="dropzone" id="dz"><div style="font-size:28px">📥</div><b>גרור לכאן קובץ PDF של הזמנת עבודה</b> או לחץ לבחירת קובץ
        <div class="hint">הנתונים יחולצו אוטומטית (מס׳ הזמנה, דרישה, ספק, תקציב, תאריכים, יועצים) ותוכל לבדוק לפני שמירה</div>
        <input type="file" id="dzfile" accept="application/pdf" hidden></div>
      <div class="toolbar"><div class="chips">${chips.map(([k, l]) => `<span class="chip ${fs === k ? 'on' : ''}" data-act="f" data-f="orderStatus" data-v="${k}">${l}</span>`).join('')}</div>
        <div class="spacer"></div><span style="color:var(--muted);font-size:13.5px">${rows.length} הזמנות · ${money(totB)}</span></div>
      ${table('orders', ORDER_COLS, rows, 'order')}
      <div class="mcards">${rows.map((o) => { const s = orderStatus(o); const p = pct(o.utilized || 0, o.budgetExVat); return `<div class="mcard" data-act="open" data-kind="order" data-id="${o.id}">
        <div class="row"><span class="t">${esc(o.orderNumber)}</span><span class="pill ${s.c}">${s.l}</span></div>
        <div class="m">${esc(o.supplier || '')} · דרישה ${esc(o.demandNumber || '—')}</div>

          <div class="j-desc" contenteditable="true" data-tedit="description" data-tid="${id}" data-ph="לחץ כדי להוסיף תיאור…">${esc(t.description || '')}</div></div>
        ${subtasksHTML(t)}
        <div class="j-sec"><div class="j-sec-h"><h4>פעילות</h4></div>
          <div class="j-tabs">${[['all', 'הכל'], ['comments', 'הערות ועדכונים'], ['history', 'היסטוריה']].map(([k, l]) => `<span class="${tab === k ? 'on' : ''}" data-act="acttab" data-v="${k}">${l}</span>`).join('')}</div>
          <div class="log-add">
            <div class="chips" id="logType">${Object.entries(LOG_TYPES).filter(([k]) => k !== 'system').map(([k, v], i) => `<span class="chip ${i === 0 ? 'on' : ''}" data-act="logtype" data-v="${k}">${v.i} ${v.l}</span>`).join('')}</div>
            <textarea id="cmt" placeholder="הוסף הערה או עדכון… למשל: שלחתי לקבלן את התוכניות"></textarea>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label style="font-size:12.5px;color:var(--muted)">מתי:</label>
              <input id="cmtAt" type="datetime-local" value="${localNow()}" data-default="${localNow()}"><span style="flex:1"></span><button class="btn orange" data-act="comment" data-id="${id}">שמירה</button></div>
          </div>
          <div class="log">${shown.map((c) => { const T = LOG_TYPES[c.type || 'note'] || LOG_TYPES.note;
            return `<div class="log-item ${c.type === 'system' ? 'sys' : ''}">${c.type === 'system' ? `<div class="log-ic">${T.i}</div>` : avatar(c.by)}<div style="flex:1;min-width:0">
              <div class="log-h"><b>${esc(c.by || '')}</b>${c.type !== 'system' ? ` <span class="pill gray" style="font-size:11.5px">${T.i} ${esc(T.l)}</span>` : ''}<span>${fmtDT(c.at)}</span></div><div style="white-space:pre-wrap">${esc(c.text)}</div></div></div>`; }).join('') || '<div class="empty" style="padding:10px">אין רישומים</div>'}</div>
        </div>
      </div>
      <aside class="j-side">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          <select class="j-status s-${t.status || 'new'}" data-tf="status" data-tid="${id}">${Object.entries(TSTATUS).map(([k, v]) => `<option value="${k}" ${(t.status || 'new') === k ? 'selected' : ''}>${v.l}</option>`).join('')}</select>
          ${t.status !== 'done' ? `<button class="btn sm" data-act="tstatus" data-id="${id}" data-v="done">✔ סיום</button>` : ''}</div>
        <div class="j-card"><div class="j-card-h">פרטים</div>
          ${row('אחראי/ת', `<div class="j-ass">${avatar(t.assignee)}<input class="j-in" list="userList" value="${esc(t.assignee || '')}" data-tf="assignee" data-tid="${id}" placeholder="—"></div>`)}
          ${row('עדיפות', sel('priority', Object.entries(PRIORITY).map(([k, v]) => [k, v.l]), t.priority || 'normal'))}
          ${row('תאריך התחלה', `<input type="date" class="j-in" value="${esc(t.startDate || '')}" data-tf="startDate" data-tid="${id}">`)}
          ${row('תאריך יעד', `<input type="date" class="j-in ${t.status !== 'done' && dl != null && dl < 0 ? 'late' : ''}" value="${esc(t.dueDate || '')}" data-tf="dueDate" data-tid="${id}">`)}
          ${row('קטגוריה', `<input class="j-in" list="catList" value="${esc(t.category || '')}" data-tf="category" data-tid="${id}" placeholder="—"><datalist id="catList">${['הזמנות', 'הסכמים', 'שטח', 'כספים', 'מנהלה', 'ישיבות'].map((c) => `<option value="${c}">`).join('')}</datalist>`)}
          <div class="j-row" style="align-items:start;padding:6px 0"><div class="j-lbl" style="padding-top:4px">קישורים</div><div class="j-val"><div class="chips">${linksOf(t).map((x) => linkChip(x, id)).join('')}<button class="btn sm" data-act="link-picker" data-id="${id}">+ קישור</button></div>
            ${(() => { const sg = linkSuggestions(t); return sg.length ? `<div class="j-sug">💡 ${sg.slice(0, 3).map((x) => `<span data-act="pick-link" data-id="${id}" data-type="${x.type}" data-lid="${esc(x.id)}">+ ${LINK_T[x.type].i} ${esc(entName(x.type, x.id))}</span>`).join('')}</div>` : ''; })()}</div></div>
          <div class="j-row" style="align-items:start;padding:6px 0"><div class="j-lbl" style="padding-top:4px">תגיות</div><div class="j-val"><div class="chips">${(t.tags || []).map((g) => tagChip(g, id)).join('')}
            <input class="j-in" style="width:110px" list="tagList" placeholder="+ תגית" data-tag-add="${id}"></div><datalist id="tagList">${allTags().map((g) => `<option value="${esc(g)}">`).join('')}</datalist></div></div>
          ${row('נוצרה ע"י', `<div class="j-ass">${avatar(t.createdBy)}<span>${esc(t.createdBy || '—')}</span></div>`)}
        </div>
        <div class="j-meta">נוצרה ${fmtDT(t.createdAt)}<br>עודכנה ${fmtDT(t.updatedAt)}</div>
      </aside>
    </div>`;
    modal(`<span class="j-key">${keyOf(t)}</span> משימה`, body,
      `<div class="spacer"></div><button class="btn danger" data-act="del" data-col="tasks" data-id="${id}">מחיקת משימה</button>`, 'wide jira-modal');
  }

  /* ==========================================================
     קישורים, פרויקטים, אנשי קשר ותיק 360°
     ========================================================== */
  const LINK_T = {
    project: { l: 'פרויקט', i: '🏗️', col: 'projects' },
    person: { l: 'איש קשר', i: '👤', col: 'people' },
    order: { l: 'הזמנה', i: '📄', col: 'orders' },
    agreement: { l: 'הסכם', i: '📑', col: 'agreements' },
  };
  const PERSON_TYPES = ['עובד אטלס', 'יועץ / נותן שירות', 'קבלן', 'ספק', 'גורם במשהב"ט', 'גורם ביחידה', 'אחר'];
  const PROJECT_STATUS = { active: { l: 'פעיל', c: 'ok' }, hold: { l: 'מוקפא', c: 'warn' }, done: { l: 'הסתיים', c: 'gray' } };
  const norm = (s) => String(s || '').replace(/["׳״'\s.-]/g, '').toLowerCase();
  const entRec = (type, id) => (LINK_T[type] ? byId(LINK_T[type].col, id) : null);
  function entName(type, id) {
    if (type === 'tag') return '#' + id;
    const r = entRec(type, id); if (!r) return '(נמחק)';
    if (type === 'order') return 'הזמנה ' + r.orderNumber;
    if (type === 'agreement') return r.name || 'הסכם ' + r.agreementNumber;
    return r.name || '—';
  }
  function linksOf(t) {
    const l = (t.links || []).slice();
    if (t.linkOrder && !l.some((x) => x.type === 'order' && x.id === t.linkOrder)) l.push({ type: 'order', id: t.linkOrder });
    if (t.linkAgreement && !l.some((x) => x.type === 'agreement' && x.id === t.linkAgreement)) l.push({ type: 'agreement', id: t.linkAgreement });
    return l.filter((x) => LINK_T[x.type] && entRec(x.type, x.id));
  }
  const hasLink = (t, type, id) => linksOf(t).some((x) => x.type === type && x.id === id);
  const consultantMatch = (o, p) => !!(o && p && p.name && (o.consultants || []).some((c) => norm(c.name) === norm(p.name)));
  function linkChip(x, tid) {
    const T = LINK_T[x.type] || { i: '#' };
    return `<span class="lchip lc-${x.type}" data-act="open" data-kind="ent-${x.type}" data-id="${esc(x.id)}">${T.i} ${esc(entName(x.type, x.id))}${tid ? `<b data-act="unlink" data-id="${tid}" data-type="${x.type}" data-lid="${esc(x.id)}" title="הסר קישור">×</b>` : ''}</span>`;
  }
  const tagChip = (tag, tid) => `<span class="lchip lc-tag" data-act="open" data-kind="ent-tag" data-id="${esc(tag)}">#${esc(tag)}${tid ? `<b data-act="untag" data-id="${tid}" data-tag="${esc(tag)}" title="הסר">×</b>` : ''}</span>`;
  const allTags = () => [...new Set(S.tasks.flatMap((t) => t.tags || []))].sort((a, b) => a.localeCompare(b, 'he'));

  /** כל מה שקשור לישות: ישיר + דרך משימות + דרך הזמנות */
  function related(type, id) {
    const tasks = type === 'tag' ? S.tasks.filter((t) => (t.tags || []).includes(id)) : S.tasks.filter((t) => hasLink(t, type, id));
    const set = { project: new Set(), person: new Set(), order: new Set(), agreement: new Set() };
    tasks.forEach((t) => linksOf(t).forEach((x) => set[x.type].add(x.id)));
    if (type === 'project') {
      S.orders.filter((o) => o.projectId === id).forEach((o) => set.order.add(o.id));
      S.agreements.filter((a) => a.projectId === id).forEach((a) => set.agreement.add(a.id));
      S.people.filter((p) => p.projectId === id).forEach((p) => set.person.add(p.id));
    }
    if (type === 'person') {
      const p = byId('people', id);
      S.orders.filter((o) => consultantMatch(o, p)).forEach((o) => set.order.add(o.id));
      if (p && p.projectId) set.project.add(p.projectId);
    }
    if (type === 'order') { const o = byId('orders', id); if (o && o.projectId) set.project.add(o.projectId); S.people.filter((p) => consultantMatch(o, p)).forEach((p) => set.person.add(p.id)); }
    if (type === 'agreement') { const a = byId('agreements', id); if (a && a.projectId) set.project.add(a.projectId); }
    [...set.order].forEach((oid) => { const o = byId('orders', oid); if (!o) return; if (o.projectId) set.project.add(o.projectId); if (type !== 'person') S.people.forEach((p) => { if (consultantMatch(o, p)) set.person.add(p.id); }); });
    [...set.agreement].forEach((aid) => { const a = byId('agreements', aid); if (a && a.projectId) set.project.add(a.projectId); });
    if (type !== 'tag' && set[type]) set[type].delete(id);
    const pick = (t, col) => [...set[t]].map((i) => byId(col, i)).filter(Boolean);
    return { tasks, projects: pick('project', 'projects'), people: pick('person', 'people'), orders: pick('order', 'orders'), agreements: pick('agreement', 'agreements') };
  }

  /* --- הצעות קישור חכמות למשימה --- */
  function linkSuggestions(t) {
    const out = []; const cur = linksOf(t); const has = (ty, i) => cur.some((x) => x.type === ty && x.id === i);
    cur.forEach((x) => {
      const r = related(x.type, x.id);
      if (x.type === 'person' || x.type === 'project') r.orders.filter(isActiveOrder).forEach((o) => !has('order', o.id) && out.push({ type: 'order', id: o.id }));
      if (x.type === 'order' || x.type === 'person' || x.type === 'agreement') r.projects.forEach((p) => !has('project', p.id) && out.push({ type: 'project', id: p.id }));
      if (x.type === 'order') r.people.forEach((p) => !has('person', p.id) && out.push({ type: 'person', id: p.id }));
    });
    // זיהוי שם של איש קשר / פרויקט בכותרת המשימה
    const text = norm((t.title || '') + ' ' + (t.description || ''));
    S.people.forEach((p) => { if (p.name && norm(p.name).length > 2 && text.includes(norm(p.name)) && !has('person', p.id)) out.push({ type: 'person', id: p.id }); });
    S.projects.forEach((p) => { const k = [p.name, p.code].filter(Boolean).map(norm).filter((x) => x.length > 2); if (k.some((x) => text.includes(x)) && !has('project', p.id)) out.push({ type: 'project', id: p.id }); });
    const seen = new Set(); return out.filter((x) => { const k = x.type + x.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
  }
  async function addLink(tid, type, lid) {
    const t = byId('tasks', tid); if (!t || hasLink(t, type, lid)) return;
    const links = [...linksOf(t), { type, id: lid }];
    await DB.update('tasks', tid, { links, linkOrder: '', linkAgreement: '', comments: [...(t.comments || []), logEntry(`קושר ל${LINK_T[type].l}: ${entName(type, lid)}`)] });
  }
  async function removeLink(tid, type, lid) {
    const t = byId('tasks', tid); const links = linksOf(t).filter((x) => !(x.type === type && x.id === lid));
    await DB.update('tasks', tid, { links, linkOrder: '', linkAgreement: '', comments: [...(t.comments || []), logEntry(`הוסר קישור ל${LINK_T[type].l}: ${entName(type, lid)}`)] });
  }

  /* --- בוחר קישורים --- */
  function openLinkPicker(tid, tab) {
    const t = byId('tasks', tid); tab = tab || S._pickTab || 'project'; S._pickTab = tab;
    const items = (tab === 'project' ? S.projects.map((p) => [p.id, p.name, p.code || ''])
      : tab === 'person' ? S.people.map((p) => [p.id, p.name, [p.type, p.company].filter(Boolean).join(' · ')])
        : tab === 'order' ? S.orders.map((o) => [o.id, 'הזמנה ' + o.orderNumber, [o.supplier, o.description].filter(Boolean).join(' · ')])
          : S.agreements.map((a) => [a.id, a.name || a.agreementNumber, [a.agreementNumber, a.contractor].filter(Boolean).join(' · ')]))
      .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'he'));
    const sug = linkSuggestions(t);
    modal(`קישור משימה: ${esc(t.title)}`, `
      ${sug.length ? `<div class="banner" style="background:var(--c-report-soft);color:inherit"><b>💡 הצעות לפי מה שכבר מקושר:</b><div class="chips" style="margin-top:8px">${sug.map((x) => `<span class="chip" data-act="pick-link" data-id="${tid}" data-type="${x.type}" data-lid="${esc(x.id)}">+ ${LINK_T[x.type].i} ${esc(entName(x.type, x.id))}</span>`).join('')}</div></div>` : ''}
      <div class="j-tabs">${Object.entries(LINK_T).map(([k, v]) => `<span class="${tab === k ? 'on' : ''}" data-act="pick-tab" data-id="${tid}" data-v="${k}">${v.i} ${v.l}</span>`).join('')}</div>
      <input id="pickQ" placeholder="חיפוש…" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px" autocomplete="off">
      <div class="pick-list" id="pickList">${items.map(([i, n, s2]) => { const on = hasLink(t, tab, i);
        return `<div class="pick-row ${on ? 'on' : ''}" data-act="${on ? 'unlink' : 'pick-link'}" data-id="${tid}" data-type="${tab}" data-lid="${esc(i)}" data-s="${esc(norm(n + ' ' + s2))}">
          <span>${LINK_T[tab].i}</span><div style="flex:1;min-width:0"><b>${esc(n)}</b><div class="sub">${esc(s2)}</div></div><span>${on ? '✔ מקושר' : '+'}</span></div>`; }).join('') || '<div class="empty" style="padding:14px">אין עדיין רשומות</div>'}</div>
      ${tab === 'project' || tab === 'person' ? `<div style="display:flex;gap:8px;margin-top:12px"><input id="pickNew" placeholder="${tab === 'project' ? 'שם פרויקט חדש' : 'שם איש קשר חדש'}" style="flex:1;padding:10px 12px;border:1px dashed var(--border);border-radius:10px">
        <button class="btn violet" data-act="pick-new" data-id="${tid}" data-type="${tab}">+ צור וקשר</button></div>` : ''}`,
      `<button class="btn primary" data-act="open" data-kind="task" data-id="${tid}">סיום — חזרה למשימה</button>`);
    S._openDetail = ['picker', tid];
    const q = $('#pickQ'); q.focus();
    q.oninput = () => { const v = norm(q.value); $$('#pickList .pick-row').forEach((r) => { r.hidden = v && !r.dataset.s.includes(v); }); };
  }

  /* --- עמוד פרויקטים --- */
  function viewProjects() {
    const list = S.projects.filter((p) => match(p, S.q)).sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.name || '').localeCompare(b.name || '', 'he'));
    const content = `<div class="ent-grid">${list.map((p) => { const r = related('project', p.id); const open = r.tasks.filter((t) => t.status !== 'done'); const late = open.filter((t) => t.dueDate && daysLeft(t.dueDate) < 0);
      const ps = PROJECT_STATUS[p.status || 'active'];
      return `<div class="ent-card" data-act="open" data-kind="ent-project" data-id="${p.id}" style="--ec:var(--c-report)">
        <div class="row"><span class="ent-ic">🏗️</span><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${esc([p.code, p.manager].filter(Boolean).join(' · '))}</div></div><span class="pill ${ps.c}">${ps.l}</span></div>
        <div class="ent-stats"><span><b>${open.length}</b> משימות פתוחות${late.length ? ` · <em>${late.length} באיחור</em>` : ''}</span><span><b>${r.orders.length}</b> הזמנות</span><span><b>${r.people.length}</b> אנשים</span></div></div>`; }).join('') || '<div class="empty">עדיין אין פרויקטים. לחץ "+ פרויקט חדש".</div>'}</div>`;
    return shell(content, 'פרויקטים', 'כל פרויקט מרכז משימות, הזמנות, הסכמים ואנשים', `<button class="btn violet" data-act="new-project">+ פרויקט חדש</button>`);
  }
  function openProjectEditor(p = {}) {
    modal(p.id ? 'עריכת פרויקט' : 'פרויקט חדש', `<form id="projForm"><div class="form-grid">
      <div class="field full"><label>שם הפרויקט</label><input name="name" value="${esc(p.name || '')}" autofocus></div>
      <div class="field"><label>קוד / מספר</label><input name="code" value="${esc(p.code || '')}"></div>
      <div class="field"><label>סטטוס</label><select name="status">${Object.entries(PROJECT_STATUS).map(([k, v]) => `<option value="${k}" ${(p.status || 'active') === k ? 'selected' : ''}>${v.l}</option>`).join('')}</select></div>
      <div class="field"><label>מנהל פרויקט</label><input name="manager" list="peopleNames" value="${esc(p.manager || '')}"></div>
      <div class="field"><label>מזמין / לקוח</label><input name="client" value="${esc(p.client || '')}"></div>
      <div class="field full"><label>תיאור</label><textarea name="description">${esc(p.description || '')}</textarea></div></div>
      <datalist id="peopleNames">${S.people.map((x) => `<option value="${esc(x.name)}">`).join('')}</datalist></form>`,
      `<button class="btn violet" data-act="save-project" data-id="${p.id || ''}">שמירה</button><button class="btn" data-act="close">ביטול</button>`);
  }

  /* --- עמוד אנשי קשר --- */
  function viewPeople() {
    const list = S.people.filter((p) => match(p, S.q)).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'he'));
    const groups = PERSON_TYPES.map((ty) => [ty, list.filter((p) => (p.type || 'אחר') === ty)]).filter(([, l]) => l.length);
    const unmatched = [...new Set(S.orders.flatMap((o) => (o.consultants || []).map((c) => c.name)).filter(Boolean))].filter((n) => !S.people.some((p) => norm(p.name) === norm(n)));
    const content = `${unmatched.length ? `<div class="banner" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">💡 נמצאו ${unmatched.length} יועצים בהזמנות שעוד לא רשומים כאנשי קשר: <b>${unmatched.slice(0, 4).map(esc).join(', ')}${unmatched.length > 4 ? '…' : ''}</b><span style="flex:1"></span><button class="btn sm teal" data-act="import-consultants">הוסף אותם</button></div>` : ''}
      ${groups.map(([ty, l]) => `<div class="section-t" style="margin-top:6px">${esc(ty)} <span class="pill gray">${l.length}</span></div>
      <div class="ent-grid">${l.map((p) => { const r = related('person', p.id); const open = r.tasks.filter((t) => t.status !== 'done');
        return `<div class="ent-card" data-act="open" data-kind="ent-person" data-id="${p.id}" style="--ec:var(--c-agree)">
          <div class="row">${avatar(p.name)}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${esc([p.role, p.company].filter(Boolean).join(' · '))}</div></div></div>
          <div class="ent-stats"><span><b>${open.length}</b> משימות</span><span><b>${r.orders.length}</b> הזמנות</span><span><b>${r.projects.length}</b> פרויקטים</span></div>
          ${p.phone ? `<div class="sub" style="margin-top:6px">📞 ${esc(p.phone)}</div>` : ''}</div>`; }).join('')}</div>`).join('') || '<div class="empty">עדיין אין אנשי קשר. לחץ "+ איש קשר".</div>'}`;
    return shell(content, 'אנשי קשר', 'עובדים, יועצים, קבלנים וגורמים — וכל מה שקשור לכל אחד', `<button class="btn teal" data-act="new-person">+ איש קשר</button>`);
  }
  function openPersonEditor(p = {}) {
    modal(p.id ? 'עריכת איש קשר' : 'איש קשר חדש', `<form id="personForm"><div class="form-grid">
      <div class="field"><label>שם מלא</label><input name="name" value="${esc(p.name || '')}" autofocus></div>
      <div class="field"><label>סוג</label><select name="type">${PERSON_TYPES.map((x) => `<option ${(p.type || 'אחר') === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>תפקיד</label><input name="role" value="${esc(p.role || '')}"></div>
      <div class="field"><label>חברה / יחידה</label><input name="company" value="${esc(p.company || '')}"></div>

  /* --- תיק 360° --- */
  function openEntity(type, id) {
    let rec = type === 'tag' ? { name: '#' + id } : entRec(type, id);
    if (!rec) return toast('הרשומה לא נמצאה', 'error');
    const r = related(type, id);
    const T = LINK_T[type] || { i: '#', l: 'תגית' };
    const open = r.tasks.filter((t) => t.status !== 'done'); const done = r.tasks.filter((t) => t.status === 'done');
    const late = open.filter((t) => t.dueDate && daysLeft(t.dueDate) < 0);
    const subOpen = open.reduce((s, t) => s + (t.subtasks || []).filter((x) => subStatus(x) !== 'done').length, 0);
    const ordersAll = type === 'order' ? [rec, ...r.orders] : r.orders;
    const budget = ordersAll.reduce((s, o) => s + (o.budgetExVat || 0), 0);
    const used = ordersAll.reduce((s, o) => s + (o.utilized || 0), 0);
    let sub = '';
    if (type === 'person') sub = [rec.type, rec.role, rec.company].filter(Boolean).map(esc).join(' · ') + (rec.phone || rec.email ? `<div class="ent-contact">${rec.phone ? `📞 <a href="tel:${esc(rec.phone)}">${esc(rec.phone)}</a>` : ''} ${rec.email ? `✉️ <a href="mailto:${esc(rec.email)}">${esc(rec.email)}</a>` : ''}</div>` : '');
    if (type === 'project') sub = [rec.code, rec.client, rec.manager && 'מנהל: ' + rec.manager].filter(Boolean).map(esc).join(' · ') + ` <span class="pill ${PROJECT_STATUS[rec.status || 'active'].c}">${PROJECT_STATUS[rec.status || 'active'].l}</span>`;
    if (type === 'order') sub = `${esc(rec.supplier || '')} · ${esc(rec.description || '')} · <span class="pill ${orderStatus(rec).c}">${orderStatus(rec).l}</span>`;
    if (type === 'agreement') sub = `${esc(rec.agreementNumber || '')} · ${esc(rec.contractor || '')} · <span class="pill ${agreeStatus(rec).c}">${agreeStatus(rec).l}</span>`;
    if (type === 'tag') sub = 'כל המשימות שמסומנות בתגית הזו';
    // יומן משולב
    const feed = [];
    r.tasks.forEach((t) => (t.comments || []).filter((c) => c.type !== 'system').forEach((c) => feed.push({ at: c.at, by: c.by, text: c.text, type: c.type, src: `${keyOf(t)} ${t.title}`, kind: 'task', id: t.id })));
    ordersAll.forEach((o) => (o.history || []).forEach((h) => feed.push({ at: h.date, by: h.by || '', text: ({ create: 'נוצרה', increase: 'הגדלה ' + money(h.amount), decrease: 'הפחתה ' + money(h.amount), extend: 'הארכה עד ' + dfmt(h.newEnd), version: 'גרסה ' + (h.version || ''), link: 'קישור להמשך', note: '' })[h.type] + (h.note ? ' — ' + h.note : ''), type: 'order', src: 'הזמנה ' + o.orderNumber, kind: 'order', id: o.id })));
    feed.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
    const sec = (title, n, html, act = '') => `<div class="ent-sec"><div class="ent-sec-h"><h4>${title}</h4><span class="pill gray">${n}</span><span style="flex:1"></span>${act}</div>${html}</div>`;
    const presetLinks = type === 'tag' ? [] : [{ type, id }];
    const body = `
      <div class="ent-head"><span class="ent-ic big">${type === 'person' ? avatar(rec.name) : T.i}</span><div style="flex:1;min-width:0"><h2>${esc(type === 'tag' ? '#' + id : entName(type, id))}</h2><div class="sub">${sub}</div></div></div>
      <div class="ent-kpis">
        <div><b>${open.length}</b><span>משימות פתוחות</span></div>
        <div class="${late.length ? 'bad' : ''}"><b>${late.length}</b><span>באיחור</span></div>
        <div><b>${subOpen}</b><span>תתי‑משימות פתוחות</span></div>
        <div><b>${ordersAll.length}</b><span>הזמנות</span></div>
        ${budget ? `<div><b>${pct(used, budget)}%</b><span>ניצול ${money(budget)}</span></div>` : `<div><b>${r.agreements.length}</b><span>הסכמים</span></div>`}
      </div>
      ${type !== 'project' && r.projects.length ? `<div class="chips" style="margin-bottom:12px">${r.projects.map((p) => linkChip({ type: 'project', id: p.id })).join('')}</div>` : ''}
      <div class="ent-cols"><div style="min-width:0">
        ${sec('✅ משימות', open.length, open.map(taskCard).join('') || '<div class="empty" style="padding:12px">אין משימות פתוחות</div>', `<button class="btn sm orange" data-act="task-links" data-links='${esc(JSON.stringify(presetLinks))}' data-tag="${type === 'tag' ? esc(id) : ''}">+ משימה</button>`)}
        ${done.length ? `<details class="ent-done"><summary>הושלמו (${done.length})</summary>${done.map(taskCard).join('')}</details>` : ''}
        ${sec('🗂 יומן משולב', feed.length, `<div class="log">${feed.slice(0, 30).map((f) => `<div class="log-item" data-act="open" data-kind="${f.kind}" data-id="${f.id}" style="cursor:pointer">
          <div class="log-ic">${f.kind === 'order' ? '📄' : (LOG_TYPES[f.type] || LOG_TYPES.note).i}</div><div style="flex:1;min-width:0"><div class="log-h"><b>${esc(f.src)}</b>${f.by ? ' · ' + esc(f.by) : ''}<span>${String(f.at || '').length > 10 ? fmtDT(f.at) : dfmt(f.at)}</span></div><div>${esc(f.text)}</div></div></div>`).join('') || '<div class="empty" style="padding:12px">אין רישומים</div>'}</div>`)}
      </div><div style="min-width:0">
        ${type !== 'order' ? sec('📄 הזמנות', r.orders.length, r.orders.map((o) => { const p = pct(o.utilized || 0, o.budgetExVat); const s = orderStatus(o);
          return `<div class="ent-row" data-act="open" data-kind="order" data-id="${o.id}"><div style="flex:1;min-width:0"><b>${esc(o.orderNumber)}</b> <span class="sub">${esc(o.supplier || '')}</span>${bar(p)}</div><span class="pill ${s.c}">${s.l}</span></div>`; }).join('') || '<div class="empty" style="padding:10px">—</div>') : ''}
        ${type !== 'agreement' && (r.agreements.length || type === 'project') ? sec('📑 הסכמים', r.agreements.length, r.agreements.map((a) => `<div class="ent-row" data-act="open" data-kind="agreement" data-id="${a.id}"><div style="flex:1;min-width:0"><b>${esc(a.name || a.agreementNumber)}</b>${bar(pct(a.utilized || 0, a.targetValue))}</div><span class="pill ${agreeStatus(a).c}">${agreeStatus(a).l}</span></div>`).join('') || '<div class="empty" style="padding:10px">—</div>') : ''}
        ${type !== 'person' ? sec('👤 אנשים', r.people.length, `<div class="chips">${r.people.map((p) => linkChip({ type: 'person', id: p.id })).join('') || '<span class="sub">—</span>'}</div>`) : ''}
        ${type === 'project' ? '' : ''}
        ${rec.notes || rec.description ? sec('📝 הערות', '', `<div style="white-space:pre-wrap">${esc(rec.notes || rec.description)}</div>`) : ''}
      </div></div>`;
    const editBtn = type === 'project' ? `<button class="btn violet" data-act="edit-project" data-id="${id}">✏️ עריכה</button>`
      : type === 'person' ? `<button class="btn teal" data-act="edit-person" data-id="${id}">✏️ עריכה</button>`
        : type === 'order' || type === 'agreement' ? `<button class="btn" data-act="open" data-kind="${type}" data-id="${id}">פרטי ה${T.l}</button>` : '';
    modal(`🗂 תיק ${T.l}`, body, `${editBtn}<button class="btn" data-act="ent-report" data-type="${type}" data-id="${esc(id)}">⬇ דוח לתיק</button>
      <div class="spacer"></div>${type === 'project' || type === 'person' ? `<button class="btn danger" data-act="del" data-col="${LINK_T[type].col}" data-id="${id}">מחיקה</button>` : ''}`, 'wide ent-modal');
    S._openDetail = ['ent-' + type, id];
  }

  /* ---------------- פיתקיות ---------------- */
  function viewNotes() {
    const notes = S.notes.filter((x) => match(x, S.q)).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || '').localeCompare(a.createdAt || ''));
    const content = `<div class="quick-note"><textarea id="qn" placeholder="כתוב פיתקית ולחץ Enter… (Shift+Enter לשורה חדשה)"></textarea><button class="btn pink" data-act="add-note">הוסף</button></div>
      <div class="notes-board">${notes.map((x, i) => `<div class="sticky s-${x.color || 'yellow'}" style="--rot:${[-1.5, 1, -0.5, 1.5][i % 4]}deg">
        <div class="txt" contenteditable="true" data-note="${x.id}">${esc(x.text)}</div>
        <div class="foot"><div class="color-dots">${NOTE_COLORS.map((c) => `<i class="s-${c}" data-act="note-color" data-id="${x.id}" data-c="${c}"></i>`).join('')}</div><div class="spacer"></div>
          <button data-act="note-pin" data-id="${x.id}" title="הצמד לדשבורד">${x.pinned ? '📌' : '📍'}</button>
          <button data-act="note-task" data-id="${x.id}" title="הפוך למשימה חדשה">→ משימה</button>
          <button data-act="note-sub" data-id="${x.id}" title="הוסף כתת‑משימה למשימה קיימת">→ תת‑משימה</button>
          <button data-act="note-del" data-id="${x.id}" title="מחק">🗑</button></div>
        <div style="font-size:11px;opacity:.6;margin-top:4px">${esc(x.createdBy || '')} · ${dfmt((x.createdAt || '').slice(0, 10))}</div></div>`).join('') || '<div class="empty">אין פיתקיות. כתוב משהו למעלה ✍️</div>'}</div>`;
    return shell(content, 'לוח פיתקיות', 'כתיבה מהירה — ובהמשך "→ משימה" מעביר לטבלת השליטה');
  }
  function openNoteToSub(nid) {
    const x = byId('notes', nid);
    const open = S.tasks.filter((t) => t.status !== 'done').sort((a, b) => (a.title || '').localeCompare(b.title || '', 'he'));
    if (!open.length) return toast('אין משימות פתוחות — צור קודם משימה ראשית', 'error');
    modal('הוספת פיתקית כתת‑משימה', `<div class="banner" style="background:var(--c-notes-soft);color:inherit;white-space:pre-wrap">${esc(x.text)}</div>
      <div class="form-grid"><div class="field full"><label>למשימה הראשית</label><select id="nsTask"><option value="">— בחר משימה —</option>
        ${open.map((t) => `<option value="${t.id}">${esc(t.title)}${t.assignee ? ' · ' + esc(t.assignee) : ''}</option>`).join('')}</select></div>
      <div class="field"><label>תאריך יעד (אופציונלי)</label><input id="nsDue" type="date"></div></div>`,
      `<button class="btn pink" data-act="do-note-sub" data-id="${nid}">הוסף כתת‑משימה</button><button class="btn" data-act="close">ביטול</button>`);
  }
  async function addNote(text) {
    text = (text || '').trim(); if (!text) return;
    await DB.add('notes', { text, color: NOTE_COLORS[S.notes.length % NOTE_COLORS.length] });
  }

  /* ---------------- דוחות ---------------- */
  const REPORT_COLS = {
    orders: [['orderNumber', 'מספר הזמנה'], ['version', 'גרסה'], ['demandNumber', 'מספר דרישה'], ['supplier', 'ספק'], ['description', 'תיאור'], ['demandBudget', 'תקציב בדרישה'],
      ['budgetExVat', 'תקציב בהזמנה'], ['budgetTotal', 'כולל מע"מ'], ['utilized', 'נוצל'], ['utilPct', '% ניצול'], ['startDate', 'תחילה'], ['endDate', 'סיום'], ['daysLeft', 'ימים לסיום'], ['status', 'סטטוס']],
    agreements: [['agreementNumber', 'מספר הסכם'], ['demandNumber', 'מספר דרישה'], ['name', 'שם ההסכם'], ['contractor', 'קבלן'], ['kind', 'סוג'], ['targetValue', 'ערך יעד'],
      ['utilized', 'נוצל'], ['utilPct', '% ניצול'], ['startDate', 'תחילה'], ['endDate', 'סיום'], ['daysLeft', 'ימים לסיום'], ['status', 'סטטוס']],
    tasks: [['title', 'משימה'], ['priority', 'עדיפות'], ['status', 'סטטוס'], ['assignee', 'אחראי/ת'], ['dueDate', 'תאריך יעד'], ['category', 'קטגוריה'], ['link', 'קישורים'], ['tagsTxt', 'תגיות'], ['subs', 'תתי‑משימות'], ['lastLog', 'עדכון אחרון'], ['createdBy', 'נוצרה ע"י'], ['description', 'פירוט']],
  };
  const DEFAULT_COLS = { orders: ['orderNumber', 'demandNumber', 'supplier', 'demandBudget', 'budgetExVat', 'utilPct', 'startDate', 'endDate', 'status'],
    agreements: ['agreementNumber', 'demandNumber', 'name', 'contractor', 'targetValue', 'utilPct', 'startDate', 'endDate', 'status'],
    tasks: ['title', 'priority', 'status', 'assignee', 'dueDate', 'subs', 'lastLog'] };
  const SEC_NAME = { orders: 'הזמנות עבודה', agreements: 'הסכמים וחוזים', tasks: 'משימות' };
  const SEC_COLOR = { orders: '#2563eb', agreements: '#0d9488', tasks: '#ea7a0c' };
  function defaultReport() {
    return { link: '', title: 'דוח מצב', sections: ['orders', 'agreements', 'tasks'], cols: JSON.parse(JSON.stringify(DEFAULT_COLS)), status: 'active', from: '', to: '', text: '', taskStatus: 'open', priority: 'all' };
  }
  S.report = defaultReport();

  function reportData(R) {
    const inRange = (d) => (!R.from || (d && d >= R.from)) && (!R.to || (d && d <= R.to));
    const out = {};
    let rel = null; if (R.link) { const [ty, ...rest] = R.link.split(':'); const lid = rest.join(':'); rel = related(ty, lid);
      if (ty === 'order') rel.orders.push(byId('orders', lid)); if (ty === 'agreement') rel.agreements.push(byId('agreements', lid)); }
    const inRel = (col, x) => !rel || rel[col].includes(x);
    if (R.sections.includes('orders')) out.orders = S.orders.filter((o) => inRel('orders', o) && match(o, R.text) && inRange(o.endDate)).filter((o) => { const k = orderStatus(o).k;
      return R.status === 'all' || (R.status === 'active' && ['active', 'soon', 'ending'].includes(k)) || (R.status === 'ending' && ['soon', 'ending'].includes(k)) || (R.status === 'closed' && ['ended', 'linked', 'cancelled'].includes(k)); })
      .sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''))
      .map((o) => ({ ...o, utilPct: pct(o.utilized || 0, o.budgetExVat), daysLeft: daysLeft(o.endDate), status: orderStatus(o).l }));
    if (R.sections.includes('agreements')) out.agreements = S.agreements.filter((a) => inRel('agreements', a) && match(a, R.text) && inRange(a.endDate)).filter((a) => { const k = agreeStatus(a).k;
      return R.status === 'all' || (R.status === 'active' && ['active', 'soon', 'ending'].includes(k)) || (R.status === 'ending' && ['soon', 'ending'].includes(k)) || (R.status === 'closed' && ['ended', 'cancelled'].includes(k)); })
      .sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''))
      .map((a) => ({ ...a, utilPct: pct(a.utilized || 0, a.targetValue), daysLeft: daysLeft(a.endDate), status: agreeStatus(a).l }));
    if (R.sections.includes('tasks')) out.tasks = S.tasks.filter((t) => inRel('tasks', t) && match(t, R.text) && inRange(t.dueDate))
      .filter((t) => R.taskStatus === 'all' || (R.taskStatus === 'open' ? t.status !== 'done' : t.status === R.taskStatus))
      .filter((t) => R.priority === 'all' || t.priority === R.priority)
      .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'))
      .map((t) => ({ ...t, _subtasks: t.subtasks || [], subs: subStats(t).total ? `${subStats(t).done}/${subStats(t).total}` : '',
        lastLog: (() => { const c = (t.comments || []).filter((x) => x.type !== 'system').sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0]; return c ? `${fmtDT(c.at)} — ${c.text}` : ''; })(), priority: (PRIORITY[t.priority] || PRIORITY.normal).l, status: (TSTATUS[t.status] || TSTATUS.new).l,
        link: linksOf(t).map((x) => entName(x.type, x.id)).join(', '), tagsTxt: (t.tags || []).map((g) => '#' + g).join(' ') }));
    return out;
  }
  const MONEY_KEYS = ['demandBudget', 'budgetExVat', 'budgetTotal', 'utilized', 'targetValue'];
  const DATE_KEYS = ['startDate', 'endDate', 'dueDate'];
  const cellText = (k, v) => (v == null || v === '' ? '' : MONEY_KEYS.includes(k) ? money(v) : DATE_KEYS.includes(k) ? dfmt(v) : k === 'utilPct' ? v + '%' : String(v));

  function reportHTML(R, data) {

      ${Object.entries(data).map(([sec, rows]) => { const cols = REPORT_COLS[sec].filter(([k]) => R.cols[sec].includes(k));
        const sums = sec === 'orders' ? `<div class="sum"><div>${rows.length} הזמנות</div><div>תקציב: ${money(rows.reduce((s, r) => s + (r.budgetExVat || 0), 0))}</div><div>נוצל: ${money(rows.reduce((s, r) => s + (r.utilized || 0), 0))}</div></div>`
          : sec === 'agreements' ? `<div class="sum"><div>${rows.length} הסכמים</div><div>ערך יעד: ${money(rows.reduce((s, r) => s + (r.targetValue || 0), 0))}</div></div>`
            : `<div class="sum"><div>${rows.length} משימות</div></div>`;
        return `<h2 style="background:${SEC_COLOR[sec]}">${SEC_NAME[sec]}</h2>${sums}<table><thead><tr>${cols.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
          <tbody>${rows.map((r) => `<tr>${cols.map(([k]) => `<td>${esc(cellText(k, r[k]))}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}">אין נתונים</td></tr>`}</tbody></table>`; }).join('')}</div>`;
  }

      ['📋 דוח מצב מלא', { sections: ['orders', 'agreements', 'tasks'], status: 'active', taskStatus: 'open' }],

    const data = reportData(R);
    const content = `<div class="grid dash-2" style="grid-template-columns:380px 1fr;margin-top:0">

          ${presets.map((p, i) => `<span class="chip" data-act="rp" data-i="${i}" style="border-color:var(--c-report)">⭐ ${esc(p.title)} <b data-act="rp-del" data-i="${i}" style="margin-inline-start:4px">✕</b></span>`).join('')}</div></div>
        <div class="field" style="margin-bottom:12px"><label>כותרת הדוח</label><input data-r="title" value="${esc(R.title)}"></div>
        <div class="field" style="margin-bottom:12px"><label>מה לכלול</label><div class="chips">${Object.entries(SEC_NAME).map(([k, l]) => `<span class="chip ${R.sections.includes(k) ? 'on' : ''}" data-act="rsec" data-v="${k}">${l}</span>`).join('')}</div></div>
        <div class="form-grid" style="margin-bottom:12px">
          <div class="field"><label>סטטוס הזמנות/הסכמים</label><select data-r="status">${[['all', 'הכל'], ['active', 'פעילים'], ['ending', 'מסתיימים בקרוב'], ['closed', 'סגורים']].map(([k, l]) => `<option value="${k}" ${R.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label>סטטוס משימות</label><select data-r="taskStatus">${[['all', 'הכל'], ['open', 'פתוחות'], ...Object.entries(TSTATUS).map(([k, v]) => [k, v.l])].map(([k, l]) => `<option value="${k}" ${R.taskStatus === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label>סיום / יעד מ‑</label><input type="date" data-r="from" value="${esc(R.from)}"></div>

  function exportXlsx(R) {

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = cols.map(([k]) => ({ wch: ['description', 'name', 'title', 'supplier'].includes(k) ? 34 : 15 }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: cols.length - 1 } }) };
      cols.forEach(([k], c) => { if (MONEY_KEYS.includes(k)) for (let r = 1; r < aoa.length; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && typeof cell.v === 'number') cell.z = '#,##0 ₪'; } });
      XLSX.utils.book_append_sheet(wb, ws, SEC_NAME[sec]);
    });
    if (data.tasks && data.tasks.length) {

  /* חלון אישור פנימי (במקום confirm/prompt של הדפדפן) */
  function ask(msg, withInput = false, def = '') {
    return new Promise((resolve) => {
      const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.style.zIndex = 80;
      bg.innerHTML = `<div class="modal" style="width:min(420px,100%)"><div class="modal-b"><p style="margin-top:0;font-weight:600">${esc(msg)}</p>
        ${withInput ? `<input id="askIn" value="${esc(def)}" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px">` : ''}</div>
        <div class="modal-f"><button class="btn primary" id="askOk">אישור</button><button class="btn" id="askNo">ביטול</button></div></div>`;
      document.body.appendChild(bg);
      const done = (v) => { bg.remove(); resolve(v); };
      bg.querySelector('#askOk').onclick = () => done(withInput ? bg.querySelector('#askIn').value.trim() || null : true);
      bg.querySelector('#askNo').onclick = () => done(withInput ? null : false);
      const i = bg.querySelector('#askIn'); if (i) { i.focus(); i.onkeydown = (e) => { if (e.key === 'Enter') bg.querySelector('#askOk').click(); }; }
    });
  }
