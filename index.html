          <div class="j-row" style="align-items:start;padding:6px 0"><div class="j-lbl" style="padding-top:4px">קישורים</div><div class="j-val"><div class="chips">${linksOf(t).map((x) => linkChip(x, id)).join('')}<button class="btn sm" data-act="link-picker" data-id="${id}">+ קישור</button></div>
            ${(() => { const sg = linkSuggestions(t); return sg.length ? `<div class="j-sug">💡 ${sg.slice(0, 3).map((x) => `<span data-act="pick-link" data-id="${id}" data-type="${x.type}" data-lid="${esc(x.id)}">+ ${LINK_T[x.type].i} ${esc(entName(x.type, x.id))}</span>`).join('')}</div>` : ''; })()}</div></div>
          <div class="j-row" style="align-items:start;padding:6px 0"><div class="j-lbl" style="padding-top:4px">תגיות</div><div class="j-val"><div class="chips">${(t.tags || []).map((g) => tagChip(g, id)).join('')}
            <input class="j-in" style="width:110px" list="tagList" placeholder="+ תגית" data-tag-add="${id}"></div><datalist id="tagList">${allTags().map((g) => `<option value="${esc(g)}">`).join('')}</datalist></div></div>
          ${row('נוצרה ע"י', `<div class="j-ass">${avatar(t.createdBy)}<span>${esc(t.createdBy || '—')}</span></div>`)}
        </div>
        <div class="j-meta">נוצרה ${fmtDT(t.createdAt)}<br>עודכנה ${fmtDT(t.updatedAt)}</div>
      </aside>
    </div>`;
    modal(`<span class="j-key">${keyOf(t)}</span> משימה`, body,
      `<div class="spacer"></div><button class="btn danger" data-act="del" data-col="tasks" data-id="${id}">מחיקת משימה</button>`, 'wide jira-modal');
  }

  /* ==========================================================
     קישורים, פרויקטים, אנשי קשר ותיק 360°
     ========================================================== */
  const LINK_T = {
    project: { l: 'פרויקט', i: '🏗️', col: 'projects' },
    person: { l: 'איש קשר', i: '👤', col: 'people' },
    order: { l: 'הזמנה', i: '📄', col: 'orders' },
    agreement: { l: 'הסכם', i: '📑', col: 'agreements' },
  };
  const PERSON_TYPES = ['עובד אטלס', 'יועץ / נותן שירות', 'קבלן', 'ספק', 'גורם במשהב"ט', 'גורם ביחידה', 'אחר'];
  const PROJECT_STATUS = { active: { l: 'פעיל', c: 'ok' }, hold: { l: 'מוקפא', c: 'warn' }, done: { l: 'הסתיים', c: 'gray' } };
  const norm = (s) => String(s || '').replace(/["׳״'\s.-]/g, '').toLowerCase();
  const entRec = (type, id) => (LINK_T[type] ? byId(LINK_T[type].col, id) : null);
  function entName(type, id) {
    if (type === 'tag') return '#' + id;
    const r = entRec(type, id); if (!r) return '(נמחק)';
    if (type === 'order') return 'הזמנה ' + r.orderNumber;
    if (type === 'agreement') return r.name || 'הסכם ' + r.agreementNumber;
    return r.name || '—';
  }
  function linksOf(t) {
    const l = (t.links || []).slice();
    if (t.linkOrder && !l.some((x) => x.type === 'order' && x.id === t.linkOrder)) l.push({ type: 'order', id: t.linkOrder });
    if (t.linkAgreement && !l.some((x) => x.type === 'agreement' && x.id === t.linkAgreement)) l.push({ type: 'agreement', id: t.linkAgreement });
    return l.filter((x) => LINK_T[x.type] && entRec(x.type, x.id));
  }
  const hasLink = (t, type, id) => linksOf(t).some((x) => x.type === type && x.id === id);
  const consultantMatch = (o, p) => { if (!o || !p || !p.name) return false; const nm = [p.name, ...(p.aliases || [])].map(norm);
    return (o.consultants || []).some((c) => nm.includes(norm(c.name))) || (!!o.supplier && nm.includes(norm(o.supplier))) || (!!o.owner && nm.includes(norm(o.owner))); };
  function linkChip(x, tid) {
    const T = LINK_T[x.type] || { i: '#' };
    return `<span class="lchip lc-${x.type}" data-act="open" data-kind="ent-${x.type}" data-id="${esc(x.id)}">${T.i} ${esc(entName(x.type, x.id))}${tid ? `<b data-act="unlink" data-id="${tid}" data-type="${x.type}" data-lid="${esc(x.id)}" title="הסר קישור">×</b>` : ''}</span>`;
  }
  const tagChip = (tag, tid) => `<span class="lchip lc-tag" data-act="open" data-kind="ent-tag" data-id="${esc(tag)}">#${esc(tag)}${tid ? `<b data-act="untag" data-id="${tid}" data-tag="${esc(tag)}" title="הסר">×</b>` : ''}</span>`;
  const allTags = () => [...new Set(S.tasks.flatMap((t) => t.tags || []))].sort((a, b) => a.localeCompare(b, 'he'));

  /** כל מה שקשור לישות: ישיר + דרך משימות + דרך הזמנות */
  function related(type, id) {
    const tasks = type === 'tag' ? S.tasks.filter((t) => (t.tags || []).includes(id)) : S.tasks.filter((t) => hasLink(t, type, id));
    const set = { project: new Set(), person: new Set(), order: new Set(), agreement: new Set() };
    tasks.forEach((t) => linksOf(t).forEach((x) => set[x.type].add(x.id)));
    if (type === 'project') {
      S.orders.filter((o) => o.projectId === id).forEach((o) => set.order.add(o.id));
      S.agreements.filter((a) => a.projectId === id).forEach((a) => set.agreement.add(a.id));
      S.people.filter((p) => p.projectId === id).forEach((p) => set.person.add(p.id));
    }
    if (type === 'person') {
      const p = byId('people', id);
      S.orders.filter((o) => consultantMatch(o, p)).forEach((o) => set.order.add(o.id));
      if (p && p.projectId) set.project.add(p.projectId);
    }
    if (type === 'order') { const o = byId('orders', id); if (o && o.projectId) set.project.add(o.projectId); S.people.filter((p) => consultantMatch(o, p)).forEach((p) => set.person.add(p.id)); }
    if (type === 'agreement') { const a = byId('agreements', id); if (a && a.projectId) set.project.add(a.projectId); }
    [...set.order].forEach((oid) => { const o = byId('orders', oid); if (!o) return; if (o.projectId) set.project.add(o.projectId); if (type !== 'person') S.people.forEach((p) => { if (consultantMatch(o, p)) set.person.add(p.id); }); });
    [...set.agreement].forEach((aid) => { const a = byId('agreements', aid); if (a && a.projectId) set.project.add(a.projectId); });
    if (type !== 'tag' && set[type]) set[type].delete(id);
    const pick = (t, col) => [...set[t]].map((i) => byId(col, i)).filter(Boolean);
    return { tasks, projects: pick('project', 'projects'), people: pick('person', 'people'), orders: pick('order', 'orders'), agreements: pick('agreement', 'agreements') };
  }

  /* --- הצעות קישור חכמות למשימה --- */
  function linkSuggestions(t) {
    const out = []; const cur = linksOf(t); const has = (ty, i) => cur.some((x) => x.type === ty && x.id === i);
    cur.forEach((x) => {
      const r = related(x.type, x.id);
      if (x.type === 'person' || x.type === 'project') r.orders.filter(isActiveOrder).forEach((o) => !has('order', o.id) && out.push({ type: 'order', id: o.id }));
      if (x.type === 'order' || x.type === 'person' || x.type === 'agreement') r.projects.forEach((p) => !has('project', p.id) && out.push({ type: 'project', id: p.id }));
      if (x.type === 'order') r.people.forEach((p) => !has('person', p.id) && out.push({ type: 'person', id: p.id }));
    });
    // זיהוי שם של איש קשר / פרויקט בכותרת המשימה
    const text = norm((t.title || '') + ' ' + (t.description || ''));
    S.people.forEach((p) => { if (p.name && norm(p.name).length > 2 && text.includes(norm(p.name)) && !has('person', p.id)) out.push({ type: 'person', id: p.id }); });
    S.projects.forEach((p) => { const k = [p.name, p.code].filter(Boolean).map(norm).filter((x) => x.length > 2); if (k.some((x) => text.includes(x)) && !has('project', p.id)) out.push({ type: 'project', id: p.id }); });
    const seen = new Set(); return out.filter((x) => { const k = x.type + x.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
  }
  async function addLink(tid, type, lid) {
    const t = byId('tasks', tid); if (!t || hasLink(t, type, lid)) return;
    const links = [...linksOf(t), { type, id: lid }];
    await DB.update('tasks', tid, { links, linkOrder: '', linkAgreement: '', comments: [...(t.comments || []), logEntry(`קושר ל${LINK_T[type].l}: ${entName(type, lid)}`)] });
  }
  async function removeLink(tid, type, lid) {
    const t = byId('tasks', tid); const links = linksOf(t).filter((x) => !(x.type === type && x.id === lid));
    await DB.update('tasks', tid, { links, linkOrder: '', linkAgreement: '', comments: [...(t.comments || []), logEntry(`הוסר קישור ל${LINK_T[type].l}: ${entName(type, lid)}`)] });
  }

  /* --- בוחר קישורים --- */
  function openLinkPicker(tid, tab) {
    const t = byId('tasks', tid); tab = tab || S._pickTab || 'project'; S._pickTab = tab;
    const items = (tab === 'project' ? S.projects.map((p) => [p.id, p.name, p.code || ''])
      : tab === 'person' ? S.people.map((p) => [p.id, p.name, [p.type, p.company].filter(Boolean).join(' · ')])
        : tab === 'order' ? S.orders.map((o) => [o.id, 'הזמנה ' + o.orderNumber, [o.supplier, o.description].filter(Boolean).join(' · ')])
          : S.agreements.map((a) => [a.id, a.name || a.agreementNumber, [a.agreementNumber, a.contractor].filter(Boolean).join(' · ')]))
      .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'he'));
    const sug = linkSuggestions(t);
    modal(`קישור משימה: ${esc(t.title)}`, `
      ${sug.length ? `<div class="banner" style="background:var(--c-report-soft);color:inherit"><b>💡 הצעות לפי מה שכבר מקושר:</b><div class="chips" style="margin-top:8px">${sug.map((x) => `<span class="chip" data-act="pick-link" data-id="${tid}" data-type="${x.type}" data-lid="${esc(x.id)}">+ ${LINK_T[x.type].i} ${esc(entName(x.type, x.id))}</span>`).join('')}</div></div>` : ''}
      <div class="j-tabs">${Object.entries(LINK_T).map(([k, v]) => `<span class="${tab === k ? 'on' : ''}" data-act="pick-tab" data-id="${tid}" data-v="${k}">${v.i} ${v.l}</span>`).join('')}</div>
      <input id="pickQ" placeholder="חיפוש…" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px" autocomplete="off">
      <div class="pick-list" id="pickList">${items.map(([i, n, s2]) => { const on = hasLink(t, tab, i);
        return `<div class="pick-row ${on ? 'on' : ''}" data-act="${on ? 'unlink' : 'pick-link'}" data-id="${tid}" data-type="${tab}" data-lid="${esc(i)}" data-s="${esc(norm(n + ' ' + s2))}">
          <span>${LINK_T[tab].i}</span><div style="flex:1;min-width:0"><b>${esc(n)}</b><div class="sub">${esc(s2)}</div></div><span>${on ? '✔ מקושר' : '+'}</span></div>`; }).join('') || '<div class="empty" style="padding:14px">אין עדיין רשומות</div>'}</div>
      ${tab === 'project' || tab === 'person' ? `<div style="display:flex;gap:8px;margin-top:12px"><input id="pickNew" placeholder="${tab === 'project' ? 'שם פרויקט חדש' : 'שם איש קשר חדש'}" style="flex:1;padding:10px 12px;border:1px dashed var(--border);border-radius:10px">
        <button class="btn violet" data-act="pick-new" data-id="${tid}" data-type="${tab}">+ צור וקשר</button></div>` : ''}`,
      `<button class="btn primary" data-act="open" data-kind="task" data-id="${tid}">סיום — חזרה למשימה</button>`);
    S._openDetail = ['picker', tid];
    const q = $('#pickQ'); q.focus();
    q.oninput = () => { const v = norm(q.value); $$('#pickList .pick-row').forEach((r) => { r.hidden = v && !r.dataset.s.includes(v); }); };
  }

  /* --- תצוגות: פרויקטים ואנשי קשר --- */
  const PROF_SYN = [[/^אדריכל(?!ות)/, 'אדריכלות'], [/^קונסטרוקטור/, 'קונסטרוקציה'], [/^מיזוג או?ו?יר/, 'מיזוג אוויר'], [/^(הנדסת )?דרכים/, 'הנדסת דרכים'],
    [/^ע["״']?ע$|^עבודות עפר/, 'עבודות עפר'], [/^מתאם|^תיאום|^מתאמ/, 'תיאום ומתאמים'], [/^חשמל/, 'חשמל'], [/^מים וביוב|^אינסטלציה/, 'מים וביוב'], [/^פיקוח/, 'פיקוח'], [/^בקר/, 'בקרה']];
  function normProf(p) {
    p = String(p || '').replace(/\s+/g, ' ').trim(); if (!p) return '';
    for (const [re, v] of PROF_SYN) if (re.test(p)) return v;
    return p;
  }
  function personProf(p) {
    const cnt = {};
    S.orders.forEach((o) => { if (consultantMatch(o, p) && o.profession) { const k = normProf(o.profession); cnt[k] = (cnt[k] || 0) + 1; } });
    const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    return best ? best[0] : normProf((p.role || '').split(',')[0]);
  }
  const VKEY = 'atlas-view-';
  const vget = (k, d) => { try { return localStorage.getItem(VKEY + k) || d; } catch (e) { return d; } };
  const vset = (k, v) => { try { localStorage.setItem(VKEY + k, v); } catch (e) {} };
  const heCmp = (a, b) => String(a || '').localeCompare(String(b || ''), 'he');
  const firstLetter = (s) => { const c = String(s || '').trim().charAt(0); return /[א-ת]/.test(c) ? c : /[a-z]/i.test(c) ? 'A‑Z' : '#'; };
  function groupBy(list, keyFn, order) {
    const m = new Map(); list.forEach((x) => { const k = keyFn(x) || 'ללא'; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    const keys = [...m.keys()].sort(order || ((a, b) => (a === 'ללא') - (b === 'ללא') || heCmp(a, b)));
    return keys.map((k) => [k, m.get(k)]);
  }
  function viewBar(page, views, sorts, cur, extra = '') {
    return `<div class="toolbar vbar">
      <div class="seg">${views.map(([k, l, ic]) => `<button class="${cur.view === k ? 'on' : ''}" data-act="vset" data-page="${page}" data-k="view" data-v="${k}" title="${l}">${ic} <span>${l}</span></button>`).join('')}</div>
      <label class="vlbl">סידור:</label><select data-vsel="${page}-sort">${sorts.map(([k, l]) => `<option value="${k}" ${cur.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${extra}</div>`;
  }
  const letterBar = (groups) => groups.length > 6 ? `<div class="letters">${groups.map(([k], i) => `<a href="#" data-act="jump" data-to="g-${i}">${esc(k)}</a>`).join('')}</div>` : '';
  const groupHead = (k, n, i, color) => `<div class="g-head" id="g-${i}"><span class="g-dot" style="background:${color}"></span>${esc(k)}<span class="pill gray">${n}</span></div>`;

  /* --- פרויקטים --- */
  function projStats(p) {
    const r = related('project', p.id);
    const os = S.orders.filter((o) => o.projectId === p.id);
    const act = os.filter(isActiveOrder);
    const budget = act.reduce((s, o) => s + (o.budgetExVat || 0), 0), used = act.reduce((s, o) => s + (o.utilized || 0), 0);
    const nextEnd = act.map((o) => o.endDate).filter(Boolean).sort()[0] || '';
    const profs = [...new Set(os.map((o) => normProf(o.profession)).filter(Boolean))];
    const open = r.tasks.filter((t) => t.status !== 'done');
    return { r, os, act, budget, used, nextEnd, profs, open, late: open.filter((t) => t.dueDate && daysLeft(t.dueDate) < 0) };
  }
  function viewProjects() {
    const cur = { view: vget('proj-view', 'cards'), sort: vget('proj-sort', 'abc'), status: vget('proj-status', 'active'), prof: vget('proj-prof', '') };
    const all = S.projects.map((p) => ({ p, st: projStats(p) }));
    const profsAll = [...new Set(all.flatMap((x) => x.st.profs))].sort(heCmp);
    let list = all.filter((x) => match(x.p, S.q))
      .filter((x) => cur.status === 'all' || (cur.status === 'active' ? (x.p.status || 'active') !== 'done' : x.p.status === 'done'))
      .filter((x) => !cur.prof || x.st.profs.includes(cur.prof));
    const sorters = {
      abc: (a, b) => heCmp(a.p.name, b.p.name),
      owner: (a, b) => heCmp(a.p.manager || 'תתתת', b.p.manager || 'תתתת') || heCmp(a.p.name, b.p.name),
      budget: (a, b) => b.st.budget - a.st.budget,
      ending: (a, b) => (a.st.nextEnd || '9999').localeCompare(b.st.nextEnd || '9999'),
      orders: (a, b) => b.st.os.length - a.st.os.length,
    };
    list.sort(sorters[cur.sort] || sorters.abc);
    const groups = cur.sort === 'abc' ? groupBy(list, (x) => firstLetter(x.p.name)) : cur.sort === 'owner' ? groupBy(list, (x) => (x.p.manager || '').split(',')[0].trim() || 'ללא אחראי') : [['', list]];
    const counts = { active: S.projects.filter((p) => (p.status || 'active') !== 'done').length, done: S.projects.filter((p) => p.status === 'done').length, all: S.projects.length };
    const extra = `<div class="chips">${[['active', 'פעילים'], ['done', 'הסתיימו'], ['all', 'הכל']].map(([k, l]) => `<span class="chip ${cur.status === k ? 'on' : ''}" data-act="vset" data-page="proj" data-k="status" data-v="${k}">${l} <small>${counts[k]}</small></span>`).join('')}</div>
      <select data-vsel="proj-prof"><option value="">כל המקצועות</option>${profsAll.map((x) => `<option ${cur.prof === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <span class="spacer"></span><span class="vcount">${list.length} פרויקטים</span>`;
    const card = ({ p, st }) => { const ps = PROJECT_STATUS[p.status || 'active']; const pc = pct(st.used, st.budget);
      return `<div class="ent-card" data-act="open" data-kind="ent-project" data-id="${p.id}" style="--ec:var(--c-report)">
        <div class="row"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${esc([p.code, p.manager].filter(Boolean).join(' · ')) || '&nbsp;'}</div></div><span class="pill ${ps.c}">${ps.l}</span></div>
        ${st.budget ? `<div class="ec-bar">${bar(pc)}<span>${pc}% · ${money(st.budget)}</span></div>` : ''}
        <div class="ent-stats"><span><b>${st.act.length}</b>/${st.os.length} הזמנות פעילות</span><span><b>${st.open.length}</b> משימות${st.late.length ? ` · <em>${st.late.length} באיחור</em>` : ''}</span>
          ${st.nextEnd ? `<span class="${daysLeft(st.nextEnd) <= settings().alertDays ? 'warn-t' : ''}">⏳ ${dfmt(st.nextEnd)}</span>` : ''}</div>
        ${st.profs.length ? `<div class="mini-tags">${st.profs.slice(0, 4).map((x) => `<span>${esc(x)}</span>`).join('')}${st.profs.length > 4 ? `<span>+${st.profs.length - 4}</span>` : ''}</div>` : ''}</div>`; };
    const row = ({ p, st }) => { const ps = PROJECT_STATUS[p.status || 'active']; const pc = pct(st.used, st.budget);
      return `<tr data-act="open" data-kind="ent-project" data-id="${p.id}"><td class="strong">${esc(p.name)}<div class="sub">${esc(p.code || '')}</div></td><td>${esc(p.manager || '—')}</td>
        <td><span class="pill ${ps.c}">${ps.l}</span></td><td class="num">${st.act.length} / ${st.os.length}</td><td class="num">${st.budget ? money(st.budget) : '—'}</td>
        <td>${st.budget ? `${bar(pc)}<div class="sub">${pc}%</div>` : '—'}</td><td class="num">${st.nextEnd ? dfmt(st.nextEnd) : '—'}</td><td class="num">${st.open.length}${st.late.length ? ` <em class="bad-t">(${st.late.length})</em>` : ''}</td>
        <td class="sub">${esc(st.profs.join(', '))}</td></tr>`; };
    const thead = `<thead><tr><th>פרויקט</th><th>אחראי/ת</th><th>סטטוס</th><th>הזמנות פעילות</th><th>תקציב פעיל</th><th>ניצול</th><th>סיום קרוב</th><th>משימות</th><th>מקצועות</th></tr></thead>`;
    let body;
    if (!list.length) body = '<div class="empty">לא נמצאו פרויקטים. אפשר לשנות סינון או ללחוץ "+ פרויקט חדש".</div>';
    else if (cur.view === 'table') body = `<div class="card table-wrap"><table class="tbl">${thead}<tbody>${groups.map(([k, l], i) => `${k ? `<tr class="g-row" id="g-${i}"><td colspan="9">${esc(k)} <span class="pill gray">${l.length}</span></td></tr>` : ''}${l.map(row).join('')}`).join('')}</tbody></table></div>`;
    else if (cur.view === 'compact') body = groups.map(([k, l], i) => `${k ? groupHead(k, l.length, i, 'var(--c-report)') : ''}<div class="compact-grid">${l.map(({ p, st }) => `<div class="cpt" data-act="open" data-kind="ent-project" data-id="${p.id}" style="--ec:var(--c-report)"><b>${esc(p.name)}</b><span>${st.act.length}/${st.os.length} 📄 · ${st.open.length} ✅</span></div>`).join('')}</div>`).join('');
    else body = groups.map(([k, l], i) => `${k ? groupHead(k, l.length, i, 'var(--c-report)') : ''}<div class="ent-grid">${l.map(card).join('')}</div>`).join('');
    const content = viewBar('proj', [['cards', 'כרטיסים', '▦'], ['compact', 'מקוצר', '▤'], ['table', 'טבלה', '☰']],
      [['abc', 'א‑ב'], ['owner', 'לפי אחראי/ת'], ['ending', 'סיום הזמנה קרוב'], ['budget', 'תקציב פעיל (גבוה→נמוך)'], ['orders', 'מספר הזמנות']], cur, extra)
      + (cur.view !== 'table' && groups.length > 1 ? letterBar(groups) : '') + body;
    return shell(content, 'פרויקטים', 'כל פרויקט מרכז משימות, הזמנות, הסכמים ואנשים', `<button class="btn violet" data-act="new-project">+ פרויקט חדש</button>`);
  }

  /* --- אנשי קשר --- */
  function viewPeople() {
    const cur = { view: vget('ppl-view', 'cards'), sort: vget('ppl-sort', 'prof'), type: vget('ppl-type', ''), act: vget('ppl-act', '') };
    const all = S.people.map((p) => { const r = related('person', p.id); return { p, r, prof: personProf(p), actO: r.orders.filter(isActiveOrder).length, open: r.tasks.filter((t) => t.status !== 'done').length }; });
    let list = all.filter((x) => match(x.p, S.q)).filter((x) => !cur.type || (x.p.type || 'אחר') === cur.type).filter((x) => !cur.act || x.actO > 0);
    const sorters = { prof: (a, b) => heCmp(a.prof || 'תתת', b.prof || 'תתת') || heCmp(a.p.name, b.p.name), abc: (a, b) => heCmp(a.p.name, b.p.name),
      type: (a, b) => PERSON_TYPES.indexOf(a.p.type || 'אחר') - PERSON_TYPES.indexOf(b.p.type || 'אחר') || heCmp(a.p.name, b.p.name),
      orders: (a, b) => b.actO - a.actO || b.r.orders.length - a.r.orders.length, company: (a, b) => heCmp(a.p.company || 'תתת', b.p.company || 'תתת') || heCmp(a.p.name, b.p.name) };
    list.sort(sorters[cur.sort] || sorters.prof);
    const unit = cur.sort === 'prof' ? list.filter((x) => x.p.type === 'גורם ביחידה') : [];
    if (unit.length) list = list.filter((x) => x.p.type !== 'גורם ביחידה');
    const groups = [
      ...(unit.length ? [['אנשי היחידה', unit]] : []),
      ...(cur.sort === 'prof' ? groupBy(list, (x) => x.prof || 'ללא מקצוע', (a, b) => (a === 'ללא מקצוע') - (b === 'ללא מקצוע') || heCmp(a, b))
        : cur.sort === 'abc' ? groupBy(list, (x) => firstLetter(x.p.name))
          : cur.sort === 'type' ? groupBy(list, (x) => x.p.type || 'אחר', (a, b) => PERSON_TYPES.indexOf(a) - PERSON_TYPES.indexOf(b))
            : cur.sort === 'company' ? groupBy(list, (x) => x.p.company || 'ללא חברה') : [['', list]]),
    ];
    const unmatched = [...new Set(S.orders.flatMap((o) => (o.consultants || []).map((c) => c.name)).filter(Boolean))].filter((n) => !S.people.some((p) => norm(p.name) === norm(n)));
    const types = [...new Set(S.people.map((p) => p.type || 'אחר'))];
    const extra = `<select data-vsel="ppl-type"><option value="">כל הסוגים</option>${PERSON_TYPES.filter((t) => types.includes(t)).map((t) => `<option ${cur.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <span class="chip ${cur.act ? 'on' : ''}" data-act="vset" data-page="ppl" data-k="act" data-v="${cur.act ? '' : '1'}">רק עם הזמנה פעילה</span>
      <span class="spacer"></span><span class="vcount">${list.length + unit.length} אנשי קשר</span>`;
    const card = ({ p, r, prof, actO, open }) => `<div class="ent-card" data-act="open" data-kind="ent-person" data-id="${p.id}" style="--ec:${p.type === 'גורם ביחידה' ? 'var(--c-report)' : 'var(--c-agree)'}">
      <div class="row">${avatar(p.name)}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${esc([prof || p.role, p.company].filter(Boolean).join(' · ')) || '&nbsp;'}</div></div>${actO ? `<span class="pill ok">${actO} פעילות</span>` : ''}</div>
      <div class="ent-stats"><span><b>${r.orders.length}</b> הזמנות</span><span><b>${r.projects.length}</b> פרויקטים</span><span><b>${open}</b> משימות</span></div>
      ${p.phone ? `<div class="sub" style="margin-top:6px">📞 ${esc(p.phone)}</div>` : ''}</div>`;
    const row = ({ p, r, prof, actO, open }) => `<tr data-act="open" data-kind="ent-person" data-id="${p.id}"><td class="strong"><div class="j-ass">${avatar(p.name)}${esc(p.name)}</div></td><td>${esc(prof || '—')}</td><td>${esc(p.company || '—')}</td><td>${esc(p.type || '—')}</td>
      <td class="num">${actO} / ${r.orders.length}</td><td class="num">${r.projects.length}</td><td class="num">${open}</td><td class="num">${esc(p.phone || '')}</td></tr>`;
    let body;
    if (!list.length && !unit.length) body = '<div class="empty">לא נמצאו אנשי קשר.</div>';
    else if (cur.view === 'table') body = `<div class="card table-wrap"><table class="tbl"><thead><tr><th>שם</th><th>מקצוע</th><th>חברה</th><th>סוג</th><th>הזמנות (פעילות/סה"כ)</th><th>פרויקטים</th><th>משימות</th><th>טלפון</th></tr></thead><tbody>
      ${groups.map(([k, l], i) => `${k ? `<tr class="g-row" id="g-${i}"><td colspan="8">${esc(k)} <span class="pill gray">${l.length}</span></td></tr>` : ''}${l.map(row).join('')}`).join('')}</tbody></table></div>`;
    else if (cur.view === 'compact') body = groups.map(([k, l], i) => `${k ? groupHead(k, l.length, i, 'var(--c-agree)') : ''}<div class="compact-grid">${l.map(({ p, prof, actO }) => `<div class="cpt" data-act="open" data-kind="ent-person" data-id="${p.id}" style="--ec:var(--c-agree)">${avatar(p.name)}<b>${esc(p.name)}</b><span>${actO ? actO + ' פעילות' : ''}</span></div>`).join('')}</div>`).join('');
    else body = groups.map(([k, l], i) => `${k ? groupHead(k, l.length, i, 'var(--c-agree)') : ''}<div class="ent-grid">${l.map(card).join('')}</div>`).join('');
    const content = `${unmatched.length ? `<div class="banner" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">💡 נמצאו ${unmatched.length} יועצים בהזמנות שעוד לא רשומים כאנשי קשר: <b>${unmatched.slice(0, 4).map(esc).join(', ')}${unmatched.length > 4 ? '…' : ''}</b><span style="flex:1"></span><button class="btn sm teal" data-act="import-consultants">הוסף אותם</button></div>` : ''}
      ${viewBar('ppl', [['cards', 'כרטיסים', '▦'], ['compact', 'מקוצר', '▤'], ['table', 'טבלה', '☰']], [['prof', 'לפי מקצוע'], ['abc', 'א‑ב'], ['company', 'לפי חברה/משרד'], ['type', 'לפי סוג'], ['orders', 'הכי הרבה הזמנות פעילות']], cur, extra)}
      ${cur.view !== 'table' && groups.length > 1 ? letterBar(groups) : ''}${body}`;
    return shell(content, 'אנשי קשר', 'עובדים, יועצים, קבלנים וגורמים — וכל מה שקשור לכל אחד', `<button class="btn" data-act="merge-tool">🧹 איחוד כפילויות</button><button class="btn teal" data-act="new-person">+ איש קשר</button>`);
  }

  function openProjectEditor(p = {}) {
    modal(p.id ? 'עריכת פרויקט' : 'פרויקט חדש', `<form id="projForm"><div class="form-grid">
      <div class="field full"><label>שם הפרויקט</label><input name="name" value="${esc(p.name || '')}" autofocus></div>
      <div class="field"><label>קוד / מספר</label><input name="code" value="${esc(p.code || '')}"></div>
      <div class="field"><label>סטטוס</label><select name="status">${Object.entries(PROJECT_STATUS).map(([k, v]) => `<option value="${k}" ${(p.status || 'active') === k ? 'selected' : ''}>${v.l}</option>`).join('')}</select></div>
      <div class="field"><label>מנהל פרויקט</label><input name="manager" list="peopleNames" value="${esc(p.manager || '')}"></div>
      <div class="field"><label>מזמין / לקוח</label><input name="client" value="${esc(p.client || '')}"></div>
      <div class="field full"><label>תיאור</label><textarea name="description">${esc(p.description || '')}</textarea></div></div>
      <datalist id="peopleNames">${S.people.map((x) => `<option value="${esc(x.name)}">`).join('')}</datalist></form>`,
      `<button class="btn violet" data-act="save-project" data-id="${p.id || ''}">שמירה</button><button class="btn" data-act="close">ביטול</button>`);
  }

  /* --- עמוד אנשי קשר --- */
  function openPersonEditor(p = {}) {
    modal(p.id ? 'עריכת איש קשר' : 'איש קשר חדש', `<form id="personForm"><div class="form-grid">
      <div class="field"><label>שם מלא</label><input name="name" value="${esc(p.name || '')}" autofocus></div>
      <div class="field"><label>סוג</label><select name="type">${PERSON_TYPES.map((x) => `<option ${(p.type || 'אחר') === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>תפקיד</label><input name="role" value="${esc(p.role || '')}"></div>
      <div class="field"><label>חברה / יחידה</label><input name="company" value="${esc(p.company || '')}"></div>
      <div class="field"><label>טלפון</label><input name="phone" type="tel" value="${esc(p.phone || '')}"></div>
      <div class="field"><label>אימייל</label><input name="email" type="email" value="${esc(p.email || '')}"></div>
      <div class="field full"><label>פרויקט עיקרי (אופציונלי)</label><select name="projectId"><option value="">—</option>${S.projects.map((x) => `<option value="${x.id}" ${p.projectId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field full"><label>הערות</label><textarea name="notes">${esc(p.notes || '')}</textarea></div></div></form>`,
      `<button class="btn teal" data-act="save-person" data-id="${p.id || ''}">שמירה</button><button class="btn" data-act="close">ביטול</button>`);
  }

  /* --- תיק 360° --- */
  function openEntity(type, id) {
    let rec = type === 'tag' ? { name: '#' + id } : entRec(type, id);
    if (!rec) return toast('הרשומה לא נמצאה', 'error');
    const r = related(type, id);
    const T = LINK_T[type] || { i: '#', l: 'תגית' };
    const open = r.tasks.filter((t) => t.status !== 'done'); const done = r.tasks.filter((t) => t.status === 'done');
    const late = open.filter((t) => t.dueDate && daysLeft(t.dueDate) < 0);
    const subOpen = open.reduce((s, t) => s + (t.subtasks || []).filter((x) => subStatus(x) !== 'done').length, 0);
    const ordersAll = type === 'order' ? [rec, ...r.orders] : r.orders;
    const budget = ordersAll.reduce((s, o) => s + (o.budgetExVat || 0), 0);
    const used = ordersAll.reduce((s, o) => s + (o.utilized || 0), 0);
    let sub = '';
    if (type === 'person') sub = [rec.type, rec.role, rec.company].filter(Boolean).map(esc).join(' · ') + (rec.phone || rec.email ? `<div class="ent-contact">${rec.phone ? `📞 <a href="tel:${esc(rec.phone)}">${esc(rec.phone)}</a>` : ''} ${rec.email ? `✉️ <a href="mailto:${esc(rec.email)}">${esc(rec.email)}</a>` : ''}</div>` : '');
    if (type === 'project') sub = [rec.code, rec.client, rec.manager && 'מנהל: ' + rec.manager].filter(Boolean).map(esc).join(' · ') + ` <span class="pill ${PROJECT_STATUS[rec.status || 'active'].c}">${PROJECT_STATUS[rec.status || 'active'].l}</span>`;
    if (type === 'order') sub = `${esc(rec.supplier || '')} · ${esc(rec.description || '')} · <span class="pill ${orderStatus(rec).c}">${orderStatus(rec).l}</span>`;
    if (type === 'agreement') sub = `${esc(rec.agreementNumber || '')} · ${esc(rec.contractor || '')} · <span class="pill ${agreeStatus(rec).c}">${agreeStatus(rec).l}</span>`;
    if (type === 'tag') sub = 'כל המשימות שמסומנות בתגית הזו';
    // יומן משולב
    const feed = [];
    r.tasks.forEach((t) => (t.comments || []).filter((c) => c.type !== 'system').forEach((c) => feed.push({ at: c.at, by: c.by, text: c.text, type: c.type, src: `${keyOf(t)} ${t.title}` + (c.subId ? (() => { const si = (t.subtasks || []).findIndex((y) => y.id === c.subId); return si >= 0 ? ` ↳ ${t.subtasks[si].title}` : ''; })() : ''), kind: 'task', id: t.id })));
    ordersAll.forEach((o) => (o.history || []).forEach((h) => feed.push({ at: h.date, by: h.by || '', text: ({ create: 'נוצרה', increase: 'הגדלה ' + money(h.amount), decrease: 'הפחתה ' + money(h.amount), extend: 'הארכה עד ' + dfmt(h.newEnd), version: 'גרסה ' + (h.version || ''), link: 'קישור להמשך', note: '', invoice: 'חשבון', close: 'נסגרה', reopen: 'נפתחה מחדש' })[h.type] + (h.note ? ' — ' + h.note : ''), type: 'order', src: 'הזמנה ' + o.orderNumber, kind: 'order', id: o.id })));
    feed.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
    const sec = (title, n, html, act = '') => `<div class="ent-sec"><div class="ent-sec-h"><h4>${title}</h4><span class="pill gray">${n}</span><span style="flex:1"></span>${act}</div>${html}</div>`;
    const presetLinks = type === 'tag' ? [] : [{ type, id }];
    const body = `
      <div class="ent-head"><span class="ent-ic big">${type === 'person' ? avatar(rec.name) : T.i}</span><div style="flex:1;min-width:0"><h2>${esc(type === 'tag' ? '#' + id : entName(type, id))}</h2><div class="sub">${sub}</div></div></div>
      <div class="ent-kpis">
        <div><b>${open.length}</b><span>משימות פתוחות</span></div>
        <div class="${late.length ? 'bad' : ''}"><b>${late.length}</b><span>באיחור</span></div>
        <div><b>${subOpen}</b><span>תתי‑משימות פתוחות</span></div>
        <div><b>${ordersAll.length}</b><span>הזמנות</span></div>
        ${budget ? `<div><b>${pct(used, budget)}%</b><span>ניצול ${money(budget)}</span></div>` : `<div><b>${r.agreements.length}</b><span>הסכמים</span></div>`}
      </div>
      ${type !== 'project' && r.projects.length ? `<div class="chips" style="margin-bottom:12px">${r.projects.map((p) => linkChip({ type: 'project', id: p.id })).join('')}</div>` : ''}
      <div class="ent-cols"><div style="min-width:0">
        ${sec('✅ משימות', open.length, open.map(taskCard).join('') || '<div class="empty" style="padding:12px">אין משימות פתוחות</div>', `<button class="btn sm orange" data-act="task-links" data-links='${esc(JSON.stringify(presetLinks))}' data-tag="${type === 'tag' ? esc(id) : ''}">+ משימה</button>`)}
        ${done.length ? `<details class="ent-done"><summary>הושלמו (${done.length})</summary>${done.map(taskCard).join('')}</details>` : ''}
        ${sec('🗂 יומן משולב', feed.length, `<div class="log">${feed.slice(0, 30).map((f) => `<div class="log-item" data-act="open" data-kind="${f.kind}" data-id="${f.id}" style="cursor:pointer">
          <div class="log-ic">${f.kind === 'order' ? '📄' : (LOG_TYPES[f.type] || LOG_TYPES.note).i}</div><div style="flex:1;min-width:0"><div class="log-h"><b>${esc(f.src)}</b>${f.by ? ' · ' + esc(f.by) : ''}<span>${String(f.at || '').length > 10 ? fmtDT(f.at) : dfmt(f.at)}</span></div><div>${esc(f.text)}</div></div></div>`).join('') || '<div class="empty" style="padding:12px">אין רישומים</div>'}</div>`)}
      </div><div style="min-width:0">
        ${type !== 'order' ? sec('📄 הזמנות', r.orders.length, r.orders.map((o) => { const p = pct(o.utilized || 0, o.budgetExVat); const s = orderStatus(o);
          return `<div class="ent-row" data-act="open" data-kind="order" data-id="${o.id}"><div style="flex:1;min-width:0"><b>${esc(o.orderNumber)}</b> <span class="sub">${esc(o.supplier || '')}</span>${bar(p)}</div><span class="pill ${s.c}">${s.l}</span></div>`; }).join('') || '<div class="empty" style="padding:10px">—</div>') : ''}
        ${type !== 'agreement' && (r.agreements.length || type === 'project') ? sec('📑 הסכמים', r.agreements.length, r.agreements.map((a) => `<div class="ent-row" data-act="open" data-kind="agreement" data-id="${a.id}"><div style="flex:1;min-width:0"><b>${esc(a.name || a.agreementNumber)}</b>${bar(pct(a.utilized || 0, a.targetValue))}</div><span class="pill ${agreeStatus(a).c}">${agreeStatus(a).l}</span></div>`).join('') || '<div class="empty" style="padding:10px">—</div>') : ''}
        ${type !== 'person' ? sec('👤 אנשים', r.people.length, `<div class="chips">${r.people.map((p) => linkChip({ type: 'person', id: p.id })).join('') || '<span class="sub">—</span>'}</div>`) : ''}
        ${type === 'project' ? '' : ''}
        ${rec.notes || rec.description ? sec('📝 הערות', '', `<div style="white-space:pre-wrap">${esc(rec.notes || rec.description)}</div>`) : ''}
      </div></div>`;
    const editBtn = type === 'project' ? `<button class="btn violet" data-act="edit-project" data-id="${id}">✏️ עריכה</button>`
      : type === 'person' ? `<button class="btn teal" data-act="edit-person" data-id="${id}">✏️ עריכה</button>`
        : type === 'order' || type === 'agreement' ? `<button class="btn" data-act="open" data-kind="${type}" data-id="${id}">פרטי ה${T.l}</button>` : '';
    modal(`🗂 תיק ${T.l}`, body, `${editBtn}<button class="btn" data-act="ent-report" data-type="${type}" data-id="${esc(id)}">⬇ דוח לתיק</button>
      <div class="spacer"></div>${type === 'project' || type === 'person' ? `<button class="btn danger" data-act="del" data-col="${LINK_T[type].col}" data-id="${id}">מחיקה</button>` : ''}`, 'wide ent-modal');
    S._openDetail = ['ent-' + type, id];
  }

  /* ==========================================================
     חשבונות · דרישות · לטיפול · אחראים · איחוד אנשי קשר · סנכרון אקסל
     ========================================================== */
  const INV_ST = {
    received: { l: 'התקבל', c: 'blue', i: '📥' }, checked: { l: 'נבדק', c: 'violet', i: '🔍' }, signing: { l: 'בחתימה', c: 'warn', i: '✍️' },
    submitted: { l: 'הוגש לתשלום', c: 'warn', i: '📤' }, paid: { l: 'שולם', c: 'ok', i: '✅' }, rejected: { l: 'הוחזר לתיקון', c: 'bad', i: '↩️' }, archived: { l: 'היסטורי', c: 'gray', i: '🗄️' },
  };
  const INV_FLOW = ['received', 'checked', 'signing', 'submitted', 'paid'];
  const INV_OPEN = ['received', 'checked', 'signing', 'submitted', 'rejected'];
  const isClosedOrder = (o) => !!(o.closed || o.cancelled || o.linkedTo);
  const orderBalance = (o) => (o.budgetExVat || 0) - (o.utilized || 0);
  const invDays = (i) => (i.statusAt ? -daysLeft(String(i.statusAt).slice(0, 10)) : null);
  const invStuck = (i) => INV_OPEN.includes(i.status) && invDays(i) != null && invDays(i) > (settings().invoiceStuckDays || 14);
  const invOrder = (i) => byId('orders', i.orderId) || S.orders.find((o) => o.orderNumber === i.orderNumber) || {};
  const ordersInvoices = (oid) => S.invoices.filter((i) => i.orderId === oid).sort((a, b) => String(a.label || '').localeCompare(String(b.label || ''), 'he', { numeric: true }));
  const personNames = (p) => [p.name, ...(p.aliases || [])].map(norm);
  const unitPeople = () => S.people.filter((p) => p.type === 'גורם ביחידה').sort((a, b) => heCmp(a.name, b.name));
  const ownerMatch = (o, owner) => !owner || (o.owner && norm(o.owner) === norm(owner)) || (() => { const p = S.people.find((x) => personNames(x).includes(norm(owner))); return p && o.owner && personNames(p).includes(norm(o.owner)); })();

  function lev(a, b) { const m = a.length, n2 = b.length; if (Math.abs(m - n2) > 3) return 9; const dp = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n2; j++) dp[0][j] = j;

  function reportData(R) {
    const inRange = (d) => (!R.from || (d && d >= R.from)) && (!R.to || (d && d <= R.to));

    const inRel = (col, x) => !rel || rel[col].includes(x);
    if (R.sections.includes('orders')) out.orders = S.orders.filter((o) => inRel('orders', o) && match(o, R.text) && inRange(o.endDate)).filter((o) => { const k = orderStatus(o).k;

      .sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''))

    if (R.sections.includes('agreements')) out.agreements = S.agreements.filter((a) => inRel('agreements', a) && match(a, R.text) && inRange(a.endDate)).filter((a) => { const k = agreeStatus(a).k;

      .sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''))
      .map((a) => ({ ...a, utilPct: pct(a.utilized || 0, a.targetValue), daysLeft: daysLeft(a.endDate), status: agreeStatus(a).l }));
    if (R.sections.includes('tasks')) out.tasks = S.tasks.filter((t) => inRel('tasks', t) && match(t, R.text) && inRange(t.dueDate))
      .filter((t) => R.taskStatus === 'all' || (R.taskStatus === 'open' ? t.status !== 'done' : t.status === R.taskStatus))
      .filter((t) => R.priority === 'all' || t.priority === R.priority)
      .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'))
      .map((t) => ({ ...t, _subtasks: t.subtasks || [], subs: subStats(t).total ? `${subStats(t).done}/${subStats(t).total}` : '',
        lastLog: (() => { const c = (t.comments || []).filter((x) => x.type !== 'system').sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0]; return c ? `${fmtDT(c.at)} — ${c.text}` : ''; })(), priority: (PRIORITY[t.priority] || PRIORITY.normal).l, status: (TSTATUS[t.status] || TSTATUS.new).l,
        link: linksOf(t).map((x) => entName(x.type, x.id)).join(', '), tagsTxt: (t.tags || []).map((g) => '#' + g).join(' ') }));
    if (R.sections.includes('invoices')) out.invoices = S.invoices.filter((i) => { const o = invOrder(i); return (!rel || rel.orders.includes(o)) && (match(i, R.text) || match(o, R.text)) && inRange(i.date); })
      .filter((i) => R.status === 'all' || (R.status === 'closed' ? ['paid', 'archived'].includes(i.status) : INV_OPEN.includes(i.status)))
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
      .map((i) => { const o = invOrder(i); return { ...i, orderNumber: o.orderNumber || i.orderNumber, supplier: o.supplier || '', owner: o.owner || '', projectName: (byId('projects', o.projectId) || {}).name || '',
        statusL: (INV_ST[i.status] || {}).l || '', daysIn: INV_OPEN.includes(i.status) ? invDays(i) : '' }; });
    if (R.sections.includes('demands')) out.demands = S.demands.filter((d) => (!rel || demandOrders(d).some((o) => rel.orders.includes(o)) || (R.link === 'project:' + d.projectId)) && match(d, R.text))

    return out;

  function exportXlsx(R) {
    const data = reportData(R); const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
    Object.entries(data).forEach(([sec, rows]) => {
      const cols = REPORT_COLS[sec].filter(([k]) => (R.cols[sec] || DEFAULT_COLS[sec]).includes(k));
      const aoa = [cols.map(([, l]) => l), ...rows.map((r) => cols.map(([k]) => { const v = r[k]; if (v == null) return ''; if (DATE_KEYS.includes(k)) return dfmt(v); return v; }))];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = cols.map(([k]) => ({ wch: ['description', 'name', 'title', 'supplier'].includes(k) ? 34 : 15 }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: cols.length - 1 } }) };
      cols.forEach(([k], c) => { if (MONEY_KEYS.includes(k)) for (let r = 1; r < aoa.length; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && typeof cell.v === 'number') cell.z = '#,##0 ₪'; } });
      XLSX.utils.book_append_sheet(wb, ws, SEC_NAME[sec]);
    });
    if (data.tasks && data.tasks.length) {
      const sub = [['משימה ראשית', 'תת‑משימה', 'תאריך יעד', 'בוצע', 'תאריך ביצוע']];
      data.tasks.forEach((t) => t._subtasks.forEach((x) => sub.push([t.title, x.title, dfmt(x.dueDate), x.done ? 'כן' : 'לא', x.doneAt ? fmtDT(x.doneAt) : ''])));
      const log = [['משימה', 'תת‑משימה', 'סוג', 'תאריך ושעה', 'נרשם ע"י', 'תוכן']];
      data.tasks.forEach((t) => (t.comments || []).filter((c) => c.type !== 'system').forEach((c) => log.push([t.title, c.subId ? ((t._subtasks.find((y) => y.id === c.subId) || {}).title || '') : '', (LOG_TYPES[c.type] || LOG_TYPES.note).l, fmtDT(c.at), c.by, c.text])));
      if (sub.length > 1) { const ws = XLSX.utils.aoa_to_sheet(sub); ws['!cols'] = [{ wch: 34 }, { wch: 40 }, { wch: 12 }, { wch: 8 }, { wch: 16 }]; XLSX.utils.book_append_sheet(wb, ws, 'תתי משימות'); }
      if (log.length > 1) { const ws = XLSX.utils.aoa_to_sheet(log); ws['!cols'] = [{ wch: 34 }, { wch: 28 }, { wch: 12 }, { wch: 16 }, { wch: 12 }, { wch: 60 }]; XLSX.utils.book_append_sheet(wb, ws, 'יומן'); }
    }
    XLSX.writeFile(wb, `${R.title || 'דוח'} ${today()}.xlsx`);
    DB.log('הפיק/ה דוח Excel', 'report', R.title);
  }

  /* ---------------- חלון ---------------- */
  function modal(title, body, foot = '', cls = '') {
    const old = $('#modal'); if (old) old.remove();
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
    bg.innerHTML = `<div class="modal ${cls}"><div class="modal-h"><h3>${title}</h3><button class="btn ghost" data-act="close">✕</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
    bg.addEventListener('mousedown', (e) => { if (e.target === bg) closeModal(); });
    document.body.appendChild(bg);
  }
  /* חלון אישור פנימי (במקום confirm/prompt של הדפדפן) */
  function ask(msg, withInput = false, def = '') {
    return new Promise((resolve) => {
      const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.style.zIndex = 80;
      bg.innerHTML = `<div class="modal" style="width:min(420px,100%)"><div class="modal-b"><p style="margin-top:0;font-weight:600">${esc(msg)}</p>
        ${withInput ? `<input id="askIn" value="${esc(def)}" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px">` : ''}</div>
        <div class="modal-f"><button class="btn primary" id="askOk">אישור</button><button class="btn" id="askNo">ביטול</button></div></div>`;
      document.body.appendChild(bg);
      const done = (v) => { bg.remove(); resolve(v); };
      bg.querySelector('#askOk').onclick = () => done(withInput ? bg.querySelector('#askIn').value.trim() || null : true);
      bg.querySelector('#askNo').onclick = () => done(withInput ? null : false);
      const i = bg.querySelector('#askIn'); if (i) { i.focus(); i.onkeydown = (e) => { if (e.key === 'Enter') bg.querySelector('#askOk').click(); }; }
    });
  }
  function closeModal() { const m = $('#modal'); if (m) m.remove(); S._openDetail = null; }
  function openDetail(kind, id) {
    S._openDetail = [kind, id];

    else if (kind === 'picker') openLinkPicker(id); else if (kind === 'invoice') openInvoice(id); else if (kind === 'demand') openDemand(id); else if (kind === 'merge') openMergeTool(); else if (kind.startsWith('ent-')) openEntity(kind.slice(4), id);
  }

  /* ---------------- קליטת PDF ---------------- */
  async function handlePdf(file) {
    if (!file || !/pdf$/i.test(file.type || file.name)) return toast('יש לגרור קובץ PDF', 'error');
    toast('קורא את ההזמנה…');
    try {
      const d = await OrderParser.parseOrderPdf(file);
      const found = d._found || [];
      if (!found.includes('orderNumber')) { openOrderEditor({ _fromPdf: true }, [], '<div class="banner warn">לא זוהה מבנה של הזמנת משהב"ט בקובץ. מלא את הפרטים ידנית.</div>'); return; }
      const prev = S.orders.filter((o) => o.orderNumber === d.orderNumber);
      if (prev.length) {
        const p = prev[0];
        const diff = [];
        if (d.budgetExVat && d.budgetExVat !== p.budgetExVat) diff.push(`תקציב: ${money(p.budgetExVat)} ← ${money(d.budgetExVat)}`);
        if (d.endDate && d.endDate !== p.endDate) diff.push(`סיום: ${dfmt(p.endDate)} ← ${dfmt(d.endDate)}`);
        if (d.version && d.version !== String(p.version)) diff.push(`גרסה: ${p.version} ← ${d.version}`);
        modal('ההזמנה כבר קיימת במערכת', `<p>הזמנה <b>${esc(d.orderNumber)}</b> כבר קיימת. ${diff.length ? 'בקובץ החדש זוהו שינויים:' : 'לא זוהו שינויים בתקציב, תוקף או גרסה.'}</p>
          ${diff.map((x) => `<div class="banner">${esc(x)}</div>`).join('')}`,
          `${diff.length ? `<button class="btn primary" data-act="apply-pdf" data-id="${p.id}">עדכן את ההזמנה הקיימת</button>` : ''}<button class="btn" data-act="open" data-kind="order" data-id="${p.id}">פתח הזמנה</button><button class="btn" data-act="close">סגור</button>`);
        S._pdf = d; return;
      }
      openOrderEditor({ ...d, demandBudget: d.budgetExVat, utilized: 0, _fromPdf: true }, found,
        `<div class="banner">✓ זוהו ${found.length} שדות מהקובץ <b>${esc(file.name)}</b> (מסומנים בירוק). בדוק, השלם "תקציב בדרישה" אם שונה, ושמור.</div>`);
      S._editing.prev = { _fromPdf: true };
    } catch (e) { console.error(e); toast('שגיאה בקריאת הקובץ: ' + e.message, 'error'); }
  }
  async function applyPdf(id) {
    const p = byId('orders', id); const d = S._pdf; const patch = { history: [...(p.history || [])] };
    if (d.budgetExVat && d.budgetExVat !== p.budgetExVat) { const delta = d.budgetExVat - (p.budgetExVat || 0);
      patch.history.push({ type: delta > 0 ? 'increase' : 'decrease', date: today(), amount: Math.abs(delta), note: `לפי גרסה ${d.version || ''} מקובץ PDF`, by: DB.user.name });
      patch.budgetExVat = d.budgetExVat; patch.vat = d.vat; patch.budgetTotal = d.budgetTotal; }
    if (d.endDate && d.endDate !== p.endDate) { patch.endDate = d.endDate; patch.history.push({ type: 'extend', date: today(), newEnd: d.endDate, note: 'לפי קובץ PDF', by: DB.user.name }); }
    if (d.version) patch.version = d.version;
    if (d.consultants) patch.consultants = d.consultants;
    await DB.update('orders', id, patch); DB.log('עדכן/ה הזמנה מ‑PDF', 'order', p.orderNumber);
    toast('ההזמנה עודכנה', 'ok'); openOrder(id);
  }

  /* ---------------- רינדור וניווט ---------------- */
  function render() {

    S.route = NAV.find((x) => x.id === r) ? r : 'dashboard';
    const V = { dashboard: viewDashboard, orders: viewOrders, agreements: viewAgreements, tasks: viewTasks, queue: viewQueue, invoices: viewInvoices, demands: viewDemands, owners: viewOwners, projects: viewProjects, people: viewPeople, notes: viewNotes, reports: viewReports, config: viewSettings };
    const active = document.activeElement && document.activeElement.id;

    $('#root').innerHTML = V[S.route]();
    if (active === 'gsearch') { const g = $('#gsearch'); g.focus(); g.setSelectionRange(pos, pos); }
    bindView();
    // רענון חלון פתוח אם הנתונים השתנו

      const [k, id] = S._openDetail; const m = $('#modal'); const sc = m && $('.modal', m).scrollTop;

      openDetail(k, id);
      Object.entries(keep).forEach(([i, v]) => { const n = document.getElementById(i); if (n && v) n.value = v; });
      if (typ && typ.v) $$('#logType .chip').forEach((c) => c.classList.toggle('on', c.dataset.v === typ.v));

  }
  let renderTimer;
  const scheduleRender = () => { clearTimeout(renderTimer); renderTimer = setTimeout(render, 30); };

  function bindView() {
    const dz = $('#dz');

      dz.onclick = () => $('#dzfile').click();
      $('#dzfile').onchange = (e) => handlePdf(e.target.files[0]);
      ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
      ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, () => dz.classList.remove('over')));
    }
    const qn = $('#qn');
    if (qn) qn.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addNote(qn.value); qn.value = ''; } };
    $$('[data-note]').forEach((el) => { el.onblur = () => { const x = byId('notes', el.dataset.note); if (x && el.innerText.trim() !== x.text) DB.update('notes', x.id, { text: el.innerText.trim() }); }; });
    // גרירת משימות בין עמודות
    $$('[data-task]').forEach((el) => { el.ondragstart = (e) => { e.dataTransfer.setData('text/task', el.dataset.task); }; });

      col.ondrop = (e) => { e.preventDefault(); col.classList.remove('drag-over'); const id = e.dataTransfer.getData('text/task'); if (id) setTaskStatus(id, col.dataset.drop); };
    });
    const restore = $('#restore');
    if (restore) restore.onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { await runImport(JSON.parse(await f.text())); } catch (err) { toast('קובץ לא תקין', 'error'); } };
  }
  const COL_HE = { orders: 'הזמנות', agreements: 'הסכמים', tasks: 'משימות', notes: 'פיתקיות', projects: 'פרויקטים', people: 'אנשי קשר', settings: 'הגדרות' };
  async function runImport(data) {
    const plan = DB.planImport(data, S);
    const line = (o) => Object.entries(o).map(([c, n]) => `${n} ${COL_HE[c] || c}`).join(', ');
    if (!plan.items.length) return toast('אין בקובץ שום דבר חדש — הכל כבר קיים באתר');
    const msg = `${Object.keys(plan.add).length ? 'יתווספו: ' + line(plan.add) + '. ' : ''}${Object.keys(plan.update).length ? 'יעודכנו: ' + line(plan.update) + '. ' : ''}${Object.keys(plan.skip).length ? 'כבר קיימים באתר ולא ישתנו: ' + line(plan.skip) + '.' : ''}`;
    if (!(await ask(msg + ' להמשיך?'))) return;
    toast('מייבא…');
    const n = await DB.importPlan(plan, (d, t) => toast(`נשמרו ${d} מתוך ${t}`));
    DB.log('ייבא/ה נתונים מקובץ', 'backup', `${n} רשומות`);
    toast(`הייבוא הסתיים — ${n} רשומות`, 'ok');
  }
  async function setTaskStatus(id, status) {

    const patch = { status, comments: [...(t.comments || []), logEntry(`סטטוס שונה ל"${TSTATUS[status].l}"`)] }; if (status === 'done') patch.doneAt = new Date().toISOString();
    await DB.update('tasks', id, patch); DB.log(`העביר/ה ל"${TSTATUS[status].l}"`, 'task', t.title);

  /* חיפוש כללי */

  /* ---------------- אירועים ---------------- */

      const L = { priority: 'עדיפות', assignee: 'אחראי/ת', dueDate: 'יעד', status: 'סטטוס' };

      await updateSubs(tg.tid, (l) => { const y = l.find((z) => z.id === tg.sid); y[f] = v; if (f === 'status') { y.done = v === 'done'; y.doneAt = v === 'done' ? new Date().toISOString() : ''; } },

    if (e.target.id === 'syncFile' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; handleXlsx(f); return; }
    if (e.target.dataset.vsel) { vset(e.target.dataset.vsel, e.target.value); render(); }
    if (e.target.dataset.r && e.target.tagName === 'SELECT') { S.report[e.target.dataset.r] = e.target.value; render(); }
  });
  document.addEventListener('click', async (e) => {

    ['orders', 'agreements', 'tasks', 'notes', 'activity', 'projects', 'people', 'invoices', 'demands'].forEach((c) => DB.subscribe(c, (arr) => { S[c] = arr; scheduleRender(); }));
    DB.subscribe('settings', (arr) => { S.settingsDocs = arr; scheduleRender(); });
    window.addEventListener('hashchange', () => { S.q = ''; const sr = $('#search-results'); sr && (sr.innerHTML = ''); render(); window.scrollTo(0, 0); });
    let lastW = window.innerWidth; window.addEventListener('resize', () => { if ((lastW > 760) !== (window.innerWidth > 760)) render(); lastW = window.innerWidth; });
    render();
    setTimeout(() => notifyDue(false), 2000);
  });
})();

</script>
