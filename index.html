<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מרכז שליטה">
  <title>מרכז שליטה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================
   מרכז שליטה — עיצוב צבעוני, מותאם מחשב / אייפד / נייד
   כל הצבעים מוגדרים כאן במשתנים — קל להחליף לפלטה של אתר הגבול
   ========================================================== */
:root {
  --bg: #f3f5fb;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --text: #1b1f3b;
  --muted: #6b7194;
  --border: #e4e7f2;
  --side-1: #1e1b4b;
  --side-2: #3b2f8f;

  --c-orders: #2563eb;  --c-orders-soft: #e0eaff;
  --c-agree: #0d9488;   --c-agree-soft: #d7f5f1;
  --c-tasks: #ea7a0c;   --c-tasks-soft: #ffedd9;
  --c-notes: #db2777;   --c-notes-soft: #fde4ef;
  --c-report: #7c3aed;  --c-report-soft: #ede4ff;
  --c-alert: #dc2626;   --c-alert-soft: #fde2e2;
  --c-warn: #d97706;    --c-warn-soft: #fef1d6;
  --c-ok: #16a34a;      --c-ok-soft: #dcf5e4;

  --radius: 16px;
  --shadow: 0 2px 4px rgba(30, 27, 75, .04), 0 8px 24px rgba(30, 27, 75, .06);
  --side-w: 250px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Heebo', system-ui, sans-serif; background: var(--bg); color: var(--text);
  direction: rtl; font-size: 15px; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--c-orders); }
.hidden { display: none !important; }

/* ---------- מבנה ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--side-w); flex-shrink: 0; position: fixed; inset: 0 0 0 auto; z-index: 30;
  background: linear-gradient(180deg, var(--side-1), var(--side-2)); color: #fff;
  display: flex; flex-direction: column; padding: 20px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-logo {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px;
  background: conic-gradient(from 200deg, #60a5fa, #34d399, #fbbf24, #f472b6, #a78bfa, #60a5fa);
}
.brand b { display: block; font-size: 17px; }
.brand small { opacity: .7; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: rgba(255,255,255,.82);
  text-decoration: none; font-weight: 500; transition: background .15s;
}
.nav a:hover { background: rgba(255,255,255,.08); }
.nav a.active { background: rgba(255,255,255,.16); color: #fff; }
.nav .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.nav .count { margin-inline-start: auto; background: var(--c-alert); color: #fff; font-size: 12px; border-radius: 99px; padding: 1px 8px; }
.side-foot { margin-top: auto; font-size: 13px; opacity: .85; padding: 8px; }
.side-foot .mode { display: inline-block; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.15); margin-bottom: 6px; }

.main { flex: 1; margin-inline-start: var(--side-w); min-width: 0; padding: 0 28px 40px; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 16px 0;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.topbar h1 { font-size: 24px; margin: 0; font-weight: 800; }
.topbar .sub { color: var(--muted); font-size: 13px; }
.topbar .spacer { flex: 1; }
.search { position: relative; }
.search input { width: 240px; padding: 10px 38px 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn .badge { position: absolute; top: -5px; left: -5px; background: var(--c-alert); color: #fff; font-size: 11px; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 5px; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--c-report), var(--c-notes)); }

/* ---------- כרטיסים ---------- */
.grid { display: grid; gap: 18px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kpi {
  border-radius: var(--radius); padding: 18px; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow); cursor: pointer;
}
.kpi::after { content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.12); left: -40px; bottom: -60px; }
.kpi .lbl { font-size: 13px; opacity: .9; }
.kpi .val { font-size: 30px; font-weight: 800; margin-top: 4px; line-height: 1.1; }
.kpi .meta { font-size: 12.5px; opacity: .85; margin-top: 6px; }
.kpi.orders { background: linear-gradient(135deg, #2563eb, #4f46e5); }
.kpi.agree  { background: linear-gradient(135deg, #0d9488, #059669); }
.kpi.tasks  { background: linear-gradient(135deg, #f59e0b, #ea580c); }
.kpi.alerts { background: linear-gradient(135deg, #ef4444, #db2777); }
.kpi.money  { background: linear-gradient(135deg, #7c3aed, #c026d3); }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.card-h .spacer { flex: 1; }
.card-h .tag { width: 8px; height: 22px; border-radius: 4px; }
.dash-2 { grid-template-columns: 1.3fr 1fr; margin-top: 18px; }
.dash-3 { grid-template-columns: repeat(3, 1fr); margin-top: 18px; }

/* ---------- כפתורים וטפסים ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 11px; padding: 10px 16px;
  font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap;
}
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--c-orders); color: #fff; border-color: transparent; }
.btn.teal { background: var(--c-agree); color: #fff; border-color: transparent; }
.btn.orange { background: var(--c-tasks); color: #fff; border-color: transparent; }
.btn.pink { background: var(--c-notes); color: #fff; border-color: transparent; }
.btn.violet { background: var(--c-report); color: #fff; border-color: transparent; }
.btn.danger { background: var(--c-alert-soft); color: var(--c-alert); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .toolbar select, .toolbar input {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); outline: none; width: 100%;
}
.toolbar select, .toolbar input { width: auto; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--c-orders); box-shadow: 0 0 0 3px var(--c-orders-soft); }
.field textarea { min-height: 80px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field.found input { background: #f0fbf4; border-color: #9fdcb5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13.5px; }
.chip.on { background: var(--text); color: #fff; border-color: var(--text); }

/* ---------- תגיות סטטוס ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.pill.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.pill.bad { background: var(--c-alert-soft); color: var(--c-alert); }
.pill.gray { background: #eceef5; color: var(--muted); }
.pill.blue { background: var(--c-orders-soft); color: var(--c-orders); }
.pill.violet { background: var(--c-report-soft); color: var(--c-report); }

/* ---------- טבלאות ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; transition: background .12s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .strong { font-weight: 700; }
.tbl .sub { color: var(--muted); font-size: 12.5px; }
.bar { height: 7px; background: #eceef5; border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--c-ok); }
.bar.warn > span { background: var(--c-warn); }
.bar.bad > span { background: var(--c-alert); }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }

/* כרטיסיות במקום טבלה בנייד */
.mcards { display: none; flex-direction: column; gap: 10px; }
.mcard { background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); border-inline-start: 5px solid var(--c-orders); }
.mcard .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mcard .t { font-weight: 700; }
.mcard .m { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* ---------- התראות ---------- */
.alerts { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.alert { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 12px; background: var(--surface-2); border-inline-start: 4px solid var(--c-warn); cursor: pointer; }
.alert.bad { border-color: var(--c-alert); background: #fff6f6; }
.alert.info { border-color: var(--c-orders); }
.alert .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; }
.alert .tx { flex: 1; min-width: 0; }
.alert .tx b { display: block; font-size: 14px; }
.alert .tx span { color: var(--muted); font-size: 12.5px; }
.alert .days { font-weight: 800; font-size: 18px; text-align: center; line-height: 1; }
.alert .days small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------- ציר זמן ---------- */
.timeline { position: relative; padding-right: 18px; }
.timeline::before { content: ''; position: absolute; right: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item::before { content: ''; position: absolute; right: -18px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-orders); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--c-orders-soft); }
.tl-item.increase::before { background: var(--c-ok); }
.tl-item.decrease::before { background: var(--c-alert); }
.tl-item.extend::before { background: var(--c-report); }
.tl-item.link::before { background: var(--c-tasks); }
.tl-item .d { font-size: 12px; color: var(--muted); }

/* ---------- קנבן משימות ---------- */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; min-height: 300px; border: 1px solid var(--border); }
.col.drag-over { outline: 2px dashed var(--c-tasks); }
.col-h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; }
.col-h .n { background: var(--surface); border-radius: 99px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
.task { background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 9px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: grab; border-inline-start: 4px solid var(--c-tasks); }
.task.p-urgent { border-color: var(--c-alert); }
.task.p-high { border-color: var(--c-tasks); }
.task.p-normal { border-color: var(--c-orders); }
.task.p-low { border-color: #a3a9c7; }
.task .t { font-weight: 600; margin-bottom: 6px; }
.task .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.task.overdue .due { color: var(--c-alert); font-weight: 700; }

/* ---------- פיתקיות ---------- */
.quick-note { display: flex; gap: 10px; margin-bottom: 18px; }
.quick-note textarea { flex: 1; min-height: 52px; padding: 14px; border-radius: 14px; border: 2px dashed #f4a7c8; background: #fff8fb; resize: vertical; font-size: 16px; }
.notes-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.sticky {
  min-height: 170px; padding: 16px; border-radius: 4px 4px 18px 4px; box-shadow: 0 6px 16px rgba(0,0,0,.08); display: flex; flex-direction: column;
  transform: rotate(var(--rot, 0deg)); transition: transform .15s;
}
.sticky:hover { transform: rotate(0) scale(1.02); }
.sticky .txt { flex: 1; white-space: pre-wrap; font-size: 15.5px; line-height: 1.5; outline: none; }
.sticky .foot { display: flex; gap: 4px; align-items: center; margin-top: 10px; font-size: 12px; opacity: .8; }
.sticky .foot .spacer { flex: 1; }
/* */
.sticky button { white-space: nowrap; background: rgba(255,255,255,.6); border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 12.5px; }
.s-yellow { background: #fff3a8; } .s-pink { background: #ffd1e3; } .s-blue { background: #cfe6ff; }
.s-green { background: #d2f5d6; } .s-orange { background: #ffdcb8; } .s-violet { background: #e4d9ff; }
.color-dots { display: flex; gap: 4px; }
.color-dots i { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,.1); }

/* ---------- אזור גרירת PDF ---------- */
.dropzone {
  border: 2px dashed #9db8f5; border-radius: var(--radius); padding: 22px; text-align: center; background: linear-gradient(135deg, #f1f6ff, #f6f1ff);
  cursor: pointer; transition: all .15s; margin-bottom: 16px;
}
.dropzone.over { border-color: var(--c-orders); background: var(--c-orders-soft); transform: scale(1.01); }
.dropzone b { color: var(--c-orders); }
.dropzone .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.page-drop { position: fixed; inset: 0; background: rgba(37,99,235,.18); backdrop-filter: blur(2px); z-index: 90; display: grid; place-items: center; pointer-events: none; }
.page-drop div { background: #fff; padding: 30px 40px; border-radius: 20px; font-size: 20px; font-weight: 700; color: var(--c-orders); box-shadow: var(--shadow); }

/* ---------- חלונות ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 18, 50, .45); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; width: min(760px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(980px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-h h3 { margin: 0; font-size: 18px; flex: 1; }
.modal-b { padding: 20px; }
.modal-f { display: flex; gap: 10px; justify-content: flex-start; padding: 14px 20px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); flex-wrap: wrap; }
.modal-f .spacer { flex: 1; }
.section-t { font-weight: 700; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.info { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.info small { display: block; color: var(--muted); font-size: 12px; }
.info b { font-size: 15px; }
.banner { padding: 12px 14px; border-radius: 12px; background: var(--c-ok-soft); color: #14532d; margin-bottom: 14px; font-size: 14px; }
.banner.warn { background: var(--c-warn-soft); color: #78350f; }

.toast-wrap { position: fixed; bottom: 24px; left: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow); animation: up .2s ease-out; }
.toast.error { background: var(--c-alert); }
.toast.ok { background: var(--c-ok); }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }

/* ---------- מסך כניסה ---------- */
.login { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #1e1b4b, #3b2f8f 45%, #0d9488); padding: 16px; }
.login .box { background: #fff; border-radius: 24px; padding: 32px; width: min(400px, 100%); box-shadow: 0 30px 60px rgba(0,0,0,.3); }
.login h1 { margin: 12px 0 4px; }
.login p { color: var(--muted); margin: 0 0 20px; }
.login .field { margin-bottom: 14px; }

/* ---------- ניווט תחתון ו-FAB לנייד ---------- */
.bottom-nav { display: none; }
.fab { display: none; }
.fab-menu { display: none; }

/* ---------- דוח מודפס ---------- */
.report-doc { direction: rtl; font-family: 'Heebo', sans-serif; color: #1b1f3b; padding: 10px; background: #fff; }
.report-doc h1 { font-size: 22px; margin: 0 0 4px; }
.report-doc h2 { font-size: 16px; margin: 20px 0 8px; padding: 6px 10px; border-radius: 8px; color: #fff; }
.report-doc table { width: 100%; border-collapse: collapse; font-size: 11px; }
.report-doc th { background: #eef1fb; text-align: right; padding: 6px; border: 1px solid #dfe3f0; }
.report-doc td { padding: 5px 6px; border: 1px solid #e7eaf3; }
.report-doc tr { page-break-inside: avoid; }
.report-doc.pdf-mode, .report-doc.pdf-mode * { letter-spacing: .01px; }
.report-doc .meta { color: #6b7194; font-size: 12px; }
.report-doc .sum { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.report-doc .sum div { background: #f3f5fb; border-radius: 8px; padding: 6px 10px; font-size: 12px; }


/* ---------- תתי-משימות ויומן ---------- */
.subs { display: flex; flex-direction: column; gap: 6px; }
.subs .sub { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.subs .sub input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--c-ok); flex-shrink: 0; cursor: pointer; }
.subs .sub .sub-t { flex: 1; min-width: 0; }
.subs .sub .sub-t small { display: block; color: var(--muted); font-size: 11.5px; }
.subs .sub.done .sub-t { text-decoration: line-through; color: var(--muted); }
.subs .sub input[type=date] { border: 1px solid var(--border); border-radius: 8px; padding: 5px 6px; background: var(--surface); font-size: 13px; }
.subs .sub input[type=date].late { border-color: var(--c-alert); color: var(--c-alert); background: var(--c-alert-soft); }
.sub-add { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sub-add input { padding: 9px 11px; border: 1px dashed #f2b27a; border-radius: 10px; background: #fffaf5; }
.sub-add input#subTitle { flex: 1; min-width: 160px; }
.log-add { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--c-tasks-soft); margin-bottom: 12px; }
.log-add textarea { min-height: 60px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; resize: vertical; background: var(--surface); }
.log-add input[type=datetime-local] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.log { display: flex; flex-direction: column; gap: 8px; }
.log-item { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }

/* ==========================================================

(function (global) {
  'use strict';
  const COLLECTIONS = ['orders', 'agreements', 'tasks', 'notes', 'activity', 'settings', 'users', 'projects', 'people', 'invoices', 'demands'];
  const LS_KEY = 'atlas-command-demo-v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const nowISO = () => new Date().toISOString();

  const cfg = global.FIREBASE_CONFIG || {};
  const useFirebase = !!(cfg.apiKey && cfg.projectId && global.firebase);

  const DB = {
    mode: useFirebase ? 'firebase' : 'demo',
    user: null,
    _listeners: {},
    _userCbs: [],
  };

  /* ---------------- מצב הדגמה ---------------- */
  let demo = null;
  function loadDemo() {
    try { demo = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { demo = null; }
    if (!demo) { demo = global.DEMO_SEED ? global.DEMO_SEED() : {}; }
    COLLECTIONS.forEach((c) => { demo[c] = demo[c] || {}; });
    saveDemo();
  }
  function saveDemo() { try { localStorage.setItem(LS_KEY, JSON.stringify(demo)); } catch (e) { /* אחסון חסום */ } }
  function emit(col) {
    const arr = Object.entries(demo[col] || {}).map(([id, d]) => ({ id, ...d }));
    (DB._listeners[col] || []).forEach((cb) => cb(arr));
  }

  /* ---------------- Firebase ---------------- */
  let rt = null, auth = null;
  if (useFirebase) {
    firebase.initializeApp(cfg);
    rt = firebase.database();
    auth = firebase.auth();
  }
  // Realtime Database לא מקבל undefined / NaN
  const clean = (o) => JSON.parse(JSON.stringify(o));

  DB.init = function () {
    return new Promise((resolve) => {
      if (!useFirebase) {
        loadDemo();
        let role = 'commander'; try { role = localStorage.getItem(LS_KEY + '-role') || 'commander'; } catch (e) {}
        DB.user = { uid: 'demo-' + role, name: role === 'commander' ? 'המפקד' : 'הרל"שית', role, email: '' };
        resolve(DB.user);
        return;
      }
      // כניסה אוטומטית ללא סיסמה (Anonymous). הזהות נבחרת פעם אחת בכל מכשיר.
      auth.onAuthStateChanged((u) => {
        if (!u) {
          auth.signInAnonymously().catch((err) => {
            console.error(err);
            document.body.innerHTML = '<div style="font-family:Heebo,sans-serif;direction:rtl;padding:40px;text-align:center">'
              + '<h2>לא ניתן להתחבר ל‑Firebase</h2><p>יש להפעיל Anonymous ב‑Authentication → Sign-in method.</p><p style="color:#888">' + err.code + '</p></div>';
          });
          return;
        }
        let profile = null;
        try { profile = JSON.parse(localStorage.getItem(LS_KEY + '-profile')); } catch (e) {}
        DB.user = { uid: u.uid, email: '', name: (profile && profile.name) || '', role: (profile && profile.role) || '', needsProfile: !profile };
        resolve(DB.user);
      });
    });
  };

  DB.onUser = (cb) => DB._userCbs.push(cb);
  DB.signIn = (email, pw) => auth.signInWithEmailAndPassword(email, pw);
  DB.signOut = () => (useFirebase ? auth.signOut() : Promise.resolve());
  DB.resetPassword = (email) => auth.sendPasswordResetEmail(email);
  DB.setProfile = (name, role) => { try { localStorage.setItem(LS_KEY + '-profile', JSON.stringify({ name, role })); } catch (e) {} location.reload(); };
  DB.clearProfile = () => { try { localStorage.removeItem(LS_KEY + '-profile'); } catch (e) {} location.reload(); };
  DB.setDemoRole = (role) => { try { localStorage.setItem(LS_KEY + '-role', role); } catch (e) {} location.reload(); };
  DB.resetDemo = () => { try { localStorage.removeItem(LS_KEY); } catch (e) {} location.reload(); };

  DB.subscribe = function (col, cb) {
    (DB._listeners[col] = DB._listeners[col] || []).push(cb);
    if (!useFirebase) { emit(col); return; }
    rt.ref(col).on('value', (snap) => {
      const v = snap.val() || {};
      cb(Object.entries(v).map(([id, d]) => ({ id, ...d })));
    }, (err) => { console.error(col, err); global.toast && global.toast('שגיאת הרשאה בקריאת ' + col, 'error'); });
  };

  function stamp(data, isNew) {
    const s = { ...data, updatedAt: nowISO(), updatedBy: DB.user ? DB.user.name : '' };
    if (isNew) { s.createdAt = nowISO(); s.createdBy = DB.user ? DB.user.name : ''; }
    delete s.id;
    return s;
  }

  DB.add = async function (col, data) {
    const d = stamp(data, true);
    if (!useFirebase) { const id = uid(); demo[col][id] = d; saveDemo(); emit(col); return id; }
    const ref = rt.ref(col).push();
    await ref.set(clean(d));
    return ref.key;
  };
  DB.set = async function (col, id, data) {
    const d = stamp(data, false);
    if (!useFirebase) { demo[col][id] = { ...(demo[col][id] || {}), ...d }; saveDemo(); emit(col); return id; }
    await rt.ref(col + '/' + id).update(clean(d));
    return id;
  };
  DB.update = async function (col, id, patch) {
    const d = stamp(patch, false);
    if (!useFirebase) { demo[col][id] = { ...(demo[col][id] || {}), ...d }; saveDemo(); emit(col); return; }
    await rt.ref(col + '/' + id).update(clean(d));
  };
  DB.remove = async function (col, id) {
    if (!useFirebase) { delete demo[col][id]; saveDemo(); emit(col); return; }
    await rt.ref(col + '/' + id).remove();
  };

  /* גיבוי ושחזור */
  const BACKUP_COLS = ['orders', 'agreements', 'tasks', 'notes', 'projects', 'people', 'invoices', 'demands'];
  DB.exportAll = function (state) {
    const out = { exportedAt: nowISO() };
    BACKUP_COLS.forEach((c) => { out[c] = state[c] || []; });
    const st = (state.settingsDocs || []).find((d) => d.id === 'main');
    if (st) out.settings = [st];
    return out;
  };
  /** מה ישתנה בשחזור: רשומה חדשה נוספת; קיימת מתעדכנת רק אם בגיבוי היא חדשה יותר */
  DB.planImport = function (data, state) {
    const plan = { add: {}, update: {}, skip: {}, items: [] };
    [...BACKUP_COLS, 'settings'].forEach((col) => {
      const cur = col === 'settings' ? (state.settingsDocs || []) : (state[col] || []);
      const byId = {}; cur.forEach((x) => { byId[x.id] = x; });
      (data[col] || []).forEach((item) => {
        if (!item || typeof item !== 'object') return;
        const id = item.id || uid(); const ex = byId[id];
        const kind = !ex ? 'add' : ((item.updatedAt || '') > (ex.updatedAt || '') ? 'update' : 'skip');
        plan[kind][col] = (plan[kind][col] || 0) + 1;
        if (kind !== 'skip') plan.items.push([col, id, item]);
      });
    });
    return plan;
  };
  DB.importPlan = async function (plan, onProgress) {
    const items = plan.items.map(([col, id, item]) => { const { id: _x, ...rest } = item; return [col, id, clean(rest)]; });
    if (!useFirebase) {
      items.forEach(([col, id, rest]) => { demo[col] = demo[col] || {}; demo[col][id] = rest; });
      saveDemo(); [...new Set(items.map((x) => x[0]))].forEach(emit); return items.length;
    }
    for (let i = 0; i < items.length; i += 100) {
      const upd = {};
      items.slice(i, i + 100).forEach(([col, id, rest]) => { upd[col + '/' + id] = rest; });
      await rt.ref().update(upd);
      onProgress && onProgress(Math.min(i + 100, items.length), items.length);
    }
    return items.length;
  };
  /** כתיבה מרוכזת של רשומות שלמות [col, id, obj] */
  DB.bulkWrite = async function (items, onProgress) {
    const rows = items.map(([col, id, obj]) => { const { id: _x, ...rest } = obj; return [col, id, clean(rest)]; });
    if (!useFirebase) { rows.forEach(([col, id, rest]) => { demo[col] = demo[col] || {}; demo[col][id] = rest; }); saveDemo(); [...new Set(rows.map((x) => x[0]))].forEach(emit); return rows.length; }
    for (let i = 0; i < rows.length; i += 150) {
      const upd = {}; rows.slice(i, i + 150).forEach(([col, id, rest]) => { upd[col + '/' + id] = rest; });
      await rt.ref().update(upd); onProgress && rows.length > 150 && onProgress(Math.min(i + 150, rows.length), rows.length);
    }
    return rows.length;
  };
  DB.importAll = async function (data, state) { return DB.importPlan(DB.planImport(data, state || {})); };

  DB.log = function (action, entity, label) {
    return DB.add('activity', { action, entity, label, user: DB.user ? DB.user.name : '' }).catch(() => {});
  };

  global.DB = DB;
})(window);

        <div class="kpi agree" data-go="agreements"><div class="lbl">הסכמים בתוקף</div><div class="val">${activeA.length}</div><div class="meta">ערך יעד ${money(target)}</div></div>

        ${(() => { const q = queueData(); const n2 = q.expired.length + q.stuck.length; return n2 ? `<div class="kpi queue" data-go="queue"><div class="lbl">לטיפול</div><div class="val">${n2}</div><div class="meta">${q.expired.length} פג תוקף עם יתרה · ${q.stuck.length} חשבונות תקועים</div></div>` : ''; })()}
        <div class="kpi alerts" data-act="alerts"><div class="lbl">התראות</div><div class="val">${alerts.length}</div><div class="meta">${alerts.filter((a) => a.level === 'bad').length} דחופות · ${st.alertDays} ימים מראש</div></div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-alert)"></span><h2>לוח התראות</h2><div class="spacer"></div><span class="sub" style="color:var(--muted);font-size:12.5px">אדום ≤ ${st.alertDays} ימים · כתום ≤ ${st.warnDays}</span></div>
          <div class="alerts">${alerts.length ? alerts.map(alertHTML).join('') : '<div class="empty">🎉 אין התראות פתוחות</div>'}</div></div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-tasks)"></span><h2>משימות קרובות</h2><div class="spacer"></div><button class="btn sm orange" data-act="quick-task">+ משימה</button></div>
          ${myTasks.length ? myTasks.map(taskCard).join('') : '<div class="empty">אין משימות פתוחות</div>'}</div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-report)"></span><h2>תחזית סיומים — 12 חודשים</h2></div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px">
            ${months.map((m) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end" title="${m.o} הזמנות, ${m.a} הסכמים">
              <small style="font-weight:700">${m.o + m.a || ''}</small>
              <div style="width:100%;max-width:34px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;height:${((m.o + m.a) / maxM) * 120}px">
                <div style="flex:${m.a};background:var(--c-agree)"></div><div style="flex:${m.o};background:var(--c-orders)"></div></div>
              <small style="color:var(--muted);font-size:11px">${m.label}</small></div>`).join('')}
          </div>
          <div style="display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px"><span>■ <b style="color:var(--c-orders)">הזמנות</b></span><span>■ <b style="color:var(--c-agree)">הסכמים</b></span></div>
        </div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-agree)"></span><h2>ניצול הסכמים</h2></div>
          ${activeA.length ? activeA.map((a) => { const p = pct(a.utilized || 0, a.targetValue); return `<div style="margin-bottom:12px;cursor:pointer" data-act="open" data-kind="agreement" data-id="${a.id}">
            <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px"><b>${esc(a.name || a.agreementNumber)}</b><span>${p}%</span></div>${bar(p)}
            <div style="font-size:12px;color:var(--muted);margin-top:3px">${money(a.utilized)} מתוך ${money(a.targetValue)} · עד ${dfmt(a.endDate)}</div></div>`; }).join('') : '<div class="empty">אין הסכמים פעילים</div>'}
        </div>
      </div>
      <div class="grid dash-2">
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-orders)"></span><h2>הזמנות פעילות — ניצול</h2><div class="spacer"></div><a href="#orders" style="font-size:13px">לכל ההזמנות ←</a></div>
          ${activeO.length ? activeO.sort((a, b) => (a.endDate || '').localeCompare(b.endDate || '')).slice(0, 6).map((o) => { const p = pct(o.utilized || 0, o.budgetExVat); const s = orderStatus(o);
            return `<div style="margin-bottom:12px;cursor:pointer" data-act="open" data-kind="order" data-id="${o.id}">
            <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px"><span><b>${esc(o.orderNumber)}</b> · ${esc(o.supplier || '')}</span><span class="pill ${s.c}">${s.l}</span></div>${bar(p)}
            <div style="font-size:12px;color:var(--muted);margin-top:3px">${p}% · ${money(o.utilized)} מתוך ${money(o.budgetExVat)}</div></div>`; }).join('') : '<div class="empty">אין הזמנות פעילות</div>'}
        </div>
        <div class="card"><div class="card-h"><span class="tag" style="background:var(--c-notes)"></span><h2>פיתקיות מוצמדות ופעילות אחרונה</h2></div>
          ${pinned.length ? `<div class="notes-board" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:14px">${pinned.map((x) => `<div class="sticky s-${x.color || 'yellow'}" style="min-height:90px;--rot:0deg"><div class="txt" style="font-size:14px">${esc(x.text)}</div></div>`).join('')}</div>` : ''}
          ${S.activity.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 7).map((x) => `<div style="display:flex;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border)">
            <b>${esc(x.user)}</b><span style="flex:1">${esc(x.action)} ${esc(x.label || '')}</span><span style="color:var(--muted);font-size:12px">${dfmt((x.createdAt || '').slice(0, 10))}</span></div>`).join('') || '<div class="empty" style="padding:16px">עדיין אין פעילות</div>'}
        </div>
      </div>`;
    const h = new Date().getHours();
    return shell(content, `${h < 12 ? 'בוקר טוב' : h < 18 ? 'צהריים טובים' : 'ערב טוב'}, ${esc(DB.user.name)}`, new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      `<button class="btn violet" data-act="report-quick">⬇ דוח מהיר</button>`);
  }

  /* ---------------- טבלה כללית עם מיון ---------------- */
  function sortRows(rows, key, cols) {
    const s = S.f.sort[key]; if (!s) return rows;
    const col = cols.find((c) => c.k === s.k); if (!col) return rows;
    const get = col.sv || ((r) => r[col.k]);
    return rows.slice().sort((a, b) => { const x = get(a), y = get(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'he'); return s.dir * r; });
  }
  function table(key, cols, rows, kind) {
    const s = S.f.sort[key] || {};
    return `<div class="card table-wrap responsive"><table class="tbl"><thead><tr>${cols.map((c) => `<th data-act="sort" data-key="${key}" data-k="${c.k}">${c.l}${s.k === c.k ? (s.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.length ? rows.map((r) => `<tr data-act="open" data-kind="${kind}" data-id="${r.id}">${cols.map((c) => `<td class="${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">לא נמצאו רשומות</td></tr>`}</tbody></table></div>`;
  }
  const match = (obj, q) => !q || JSON.stringify(obj).toLowerCase().includes(q.toLowerCase());

  /* ---------------- הזמנות ---------------- */
  const ORDER_COLS = [
    { k: 'orderNumber', l: 'מס׳ הזמנה', cls: 'strong', v: (o) => `${esc(o.orderNumber)}${o.version ? `<div class="sub">גרסה ${esc(o.version)}</div>` : ''}` },
    { k: 'demandNumber', l: 'מס׳ דרישה', v: (o) => esc(o.demandNumber || '—') },
    { k: 'supplier', l: 'ספק', v: (o) => `${esc(o.supplier || '—')}<div class="sub">${esc(o.description || '')}</div>` },
    { k: 'owner', l: 'אחראי/ת', v: (o) => esc(o.owner || '—') },
    { k: 'demandBudget', l: 'תקציב בדרישה', cls: 'num', v: (o) => money(o.demandBudget) },
    { k: 'budgetExVat', l: 'תקציב בהזמנה', cls: 'num', v: (o) => `${money(o.budgetExVat)}<div class="sub">כולל מע"מ ${money(o.budgetTotal)}</div>` },
    { k: 'utilized', l: 'ניצול', sv: (o) => pct(o.utilized || 0, o.budgetExVat), v: (o) => { const p = pct(o.utilized || 0, o.budgetExVat); return `${bar(p)}<div class="sub">${p}%</div>`; } },
    { k: 'startDate', l: 'תחילה', cls: 'num', v: (o) => dfmt(o.startDate) },
    { k: 'endDate', l: 'סיום', cls: 'num', v: (o) => dfmt(o.endDate) },
    { k: 'status', l: 'סטטוס', sv: (o) => orderStatus(o).l, v: (o) => { const s = orderStatus(o); return `<span class="pill ${s.c}">${s.l}</span>${o.linkedTo ? '<div class="sub">🔗 הזמנת המשך</div>' : o.parentId ? '<div class="sub">↩ המשך להזמנה קודמת</div>' : ''}`; } },
  ];
  function viewOrders() {
    const fs = S.f.orderStatus;
    let rows = S.orders.filter((o) => match(o, S.q))
      .filter((o) => S.f.orderOwner === 'all' || (o.owner || '') === S.f.orderOwner)
      .filter((o) => S.f.orderProject === 'all' || (o.projectId || '') === S.f.orderProject)
      .filter((o) => { const k = orderStatus(o).k;
      return fs === 'all' || (fs === 'active' && ['active', 'soon', 'ending'].includes(k)) || (fs === 'ending' && ['soon', 'ending'].includes(k)) || (fs === 'closed' && ['ended', 'linked', 'cancelled', 'closed'].includes(k)); });
    rows = sortRows(rows.sort((a, b) => (a.endDate || '').localeCompare(b.endDate || '')), 'orders', ORDER_COLS);
    const chips = [['all', 'הכל'], ['active', 'פעילות'], ['ending', 'מסתיימות בקרוב'], ['closed', 'סגורות / הועברו']];
    const totB = rows.reduce((s, o) => s + (o.budgetExVat || 0), 0);
    const content = `
      <div class="dropzone" id="dz"><div style="font-size:28px">📥</div><b>גרור לכאן קובץ PDF של הזמנת עבודה</b> או לחץ לבחירת קובץ
        <div class="hint">הנתונים יחולצו אוטומטית (מס׳ הזמנה, דרישה, ספק, תקציב, תאריכים, יועצים) ותוכל לבדוק לפני שמירה</div>
        <input type="file" id="dzfile" accept="application/pdf" hidden></div>
      <div class="toolbar"><div class="chips">${chips.map(([k, l]) => `<span class="chip ${fs === k ? 'on' : ''}" data-act="f" data-f="orderStatus" data-v="${k}">${l}</span>`).join('')}</div>
        ${(() => { const owners = [...new Set(S.orders.map((o) => o.owner).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'he'));
          return owners.length ? `<select data-fsel="orderOwner"><option value="all">כל האחראים</option>${owners.map((x) => `<option ${S.f.orderOwner === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : ''; })()}
        ${(() => { const ps = S.projects.filter((p) => S.orders.some((o) => o.projectId === p.id)).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'he'));
          return ps.length ? `<select data-fsel="orderProject" style="max-width:220px"><option value="all">כל הפרויקטים</option>${ps.map((x) => `<option value="${x.id}" ${S.f.orderProject === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : ''; })()}
        <div class="spacer"></div><span style="color:var(--muted);font-size:13.5px">${rows.length} הזמנות · ${money(totB)}</span></div>
      ${table('orders', ORDER_COLS, rows, 'order')}
      <div class="mcards">${rows.map((o) => { const s = orderStatus(o); const p = pct(o.utilized || 0, o.budgetExVat); return `<div class="mcard" data-act="open" data-kind="order" data-id="${o.id}">
        <div class="row"><span class="t">${esc(o.orderNumber)}</span><span class="pill ${s.c}">${s.l}</span></div>
        <div class="m">${esc(o.supplier || '')} · דרישה ${esc(o.demandNumber || '—')}</div>
        <div class="m">${money(o.budgetExVat)} · ${dfmt(o.startDate)} – ${dfmt(o.endDate)}</div><div style="margin-top:8px">${bar(p)}</div></div>`; }).join('') || '<div class="empty">לא נמצאו הזמנות</div>'}</div>`;
    return shell(content, 'הזמנות עבודה', 'מעקב תקציב, תוקף, הגדלות, הארכות והזמנות המשך', `<button class="btn" data-act="sync-pick">🔄 סנכרון מאקסל</button><button class="btn primary" data-act="new-order">+ הזמנה חדשה</button>`);
  }

  function orderForm(o = {}, found = []) {
    const f = (k, l, type = 'text', extra = '') => `<div class="field ${found.includes(k) ? 'found' : ''} ${extra}"><label>${l}${found.includes(k) ? ' ✓' : ''}</label>
      <input name="${k}" type="${type}" ${type === 'number' ? 'step="0.01"' : ''} value="${esc(o[k] ?? '')}"></div>`;
    const cons = o.consultants && o.consultants.length ? o.consultants : [];
    const parentSel = `<div class="field full"><label>המשך להזמנה קודמת (אופציונלי)</label><select name="parentId"><option value="">— ללא —</option>
      ${S.orders.filter((x) => x.id !== o.id).map((x) => `<option value="${x.id}" ${o.parentId === x.id ? 'selected' : ''}>${esc(x.orderNumber)} · ${esc(x.supplier || '')}</option>`).join('')}</select></div>`;
    return `<form id="orderForm"><div class="form-grid">
      ${f('orderNumber', 'מספר הזמנה')}${f('version', 'גרסה')}
      ${f('demandNumber', 'מספר דרישה')}${f('supplier', 'שם הספק')}
      ${f('description', 'תיאור ההזמנה', 'text', 'full')}
      ${f('unit', 'יחידה / איש קשר')}${f('buyer', 'קבוצת רכש')}
      ${f('profession', 'מקצוע')}${f('owner', 'אחראי/ת')}${f('planWork', 'מספר עבודת תכנון')}
      ${f('demandBudget', 'סה"כ תקציב בדרישה (₪)', 'number')}${f('budgetExVat', 'תקציב בהזמנה ללא מע"מ (₪)', 'number')}
      ${f('vat', 'מע"מ (₪)', 'number')}${f('budgetTotal', 'סה"כ כולל מע"מ (₪)', 'number')}
      ${f('utilized', 'נוצל עד כה (₪, ללא מע"מ)', 'number')}${f('method', 'שיטת התקשרות')}
      ${f('startDate', 'תחילת תוקף', 'date')}${f('endDate', 'סוף תוקף', 'date')}
      <div class="field full"><label>פרויקט</label><select name="projectId"><option value="">—</option>${S.projects.map((x) => `<option value="${x.id}" ${o.projectId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      ${parentSel}
      <div class="field full"><label>יועצים / נותני שירות</label>
        <div id="consRows">${cons.map(consRow).join('')}</div>
        <button type="button" class="btn sm" data-act="add-cons" style="margin-top:6px;align-self:flex-start">+ יועץ</button></div>
      <div class="field full"><label>הערות</label><textarea name="notes">${esc(o.notes || '')}</textarea></div>
    </div></form>`;
  }
  function consRow(c = {}) {
    return `<div class="cons-row" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:6px">
      <input placeholder="שם" data-c="name" value="${esc(c.name || '')}" class="ci"><input placeholder="שעות" type="number" data-c="hours" value="${esc(c.hours ?? '')}" class="ci">
      <input placeholder="תעריף לשעה" type="number" data-c="rate" value="${esc(c.rate ?? '')}" class="ci"><button type="button" class="btn sm danger" data-act="rm-cons">✕</button></div>`;
  }
  function readForm(form) {
    const d = {};
    $$('input[name],select[name],textarea[name]', form).forEach((el) => { d[el.name] = el.type === 'number' ? n(el.value) : el.value.trim(); });
    return d;
  }
  function openOrderEditor(o = {}, found = [], banner = '') {
    const isNew = !o.id;
    modal(`${isNew ? 'הזמנה חדשה' : 'עריכת הזמנה ' + esc(o.orderNumber)}`, `${banner}${orderForm(o, found)}`,
      `<button class="btn primary" data-act="save-order">שמירה</button><button class="btn" data-act="close">ביטול</button>`, 'wide');
    const form = $('#orderForm');
    form.addEventListener('input', (e) => {
      if (e.target.name === 'budgetExVat') {
        const v = n(e.target.value) || 0; form.vat.value = (v * VAT).toFixed(2); form.budgetTotal.value = (v * (1 + VAT)).toFixed(2);
      }
    });
    S._editing = { col: 'orders', id: o.id || null, prev: o };
  }
  async function saveOrder() {
    const form = $('#orderForm'); const d = readForm(form);
    d.consultants = $$('.cons-row', form).map((r) => { const c = {}; $$('.ci', r).forEach((i) => { c[i.dataset.c] = i.type === 'number' ? n(i.value) : i.value.trim(); }); c.total = c.hours && c.rate ? c.hours * c.rate : null; return c; }).filter((c) => c.name);
    if (!d.orderNumber) return toast('חובה למלא מספר הזמנה', 'error');
    const dup = S.orders.find((x) => x.orderNumber === d.orderNumber && x.id !== S._editing.id && String(x.version) === String(d.version));
    if (dup && !(await ask(`הזמנה ${d.orderNumber} בגרסה זו כבר קיימת. לשמור בכל זאת?`))) return;
    const ed = S._editing;
    if (ed.id) {
      await DB.update('orders', ed.id, d); DB.log('עדכן/ה הזמנה', 'order', d.orderNumber);
    } else {
      d.history = [{ type: 'create', date: today(), note: ed.prev._fromPdf ? 'נקלט מקובץ PDF' : 'נוצרה ידנית' }];
      const id = await DB.add('orders', d); DB.log('הוסיף/ה הזמנה', 'order', d.orderNumber);
      if (S._demOrder) { const dm = byId('demands', S._demOrder.id); if (dm) { const l = (dm.pendingItems || []).slice(); const it = l.splice(S._demOrder.k, 1)[0];
        await DB.update('demands', dm.id, { pendingItems: l, removedItems: [...(dm.removedItems || []), it ? it.title : ''] }); } S._demOrder = null; }
      if (d.parentId) {
        const p = byId('orders', d.parentId);
        if (p) await DB.update('orders', p.id, { linkedTo: id, history: [...(p.history || []), { type: 'link', date: today(), note: `הועברה להזמנת המשך ${d.orderNumber}` }] });
      }
    }
    closeModal(); toast('ההזמנה נשמרה', 'ok');
  }

  function historyHTML(h = []) {
    const L = { create: 'נוצרה', increase: 'הגדלה', decrease: 'הפחתה', extend: 'הארכת תוקף', version: 'גרסה חדשה', link: 'קישור להמשך', note: 'הערה', invoice: 'חשבון', close: 'נסגרה', reopen: 'נפתחה מחדש' };
    return h.length ? `<div class="timeline">${h.slice().reverse().map((x) => `<div class="tl-item ${x.type}"><div><b>${L[x.type] || x.type}</b>
      ${x.amount ? ` · ${x.type === 'decrease' ? '−' : '+'}${money(x.amount)}` : ''}${x.newEnd ? ` · עד ${dfmt(x.newEnd)}` : ''}${x.version != null ? ` · גרסה ${esc(x.version)}` : ''}</div>
      ${x.note ? `<div>${esc(x.note)}</div>` : ''}<div class="d">${dfmt(x.date)}${x.by ? ' · ' + esc(x.by) : ''}</div></div>`).join('')}</div>` : '<div class="empty" style="padding:12px">אין שינויים</div>';
  }
  function chain(o) {
    const list = []; let cur = o; const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.parentId)) { seen.add(cur.parentId); cur = byId('orders', cur.parentId); if (cur) list.unshift(cur); }
    list.push(o); cur = o;
    while (cur && cur.linkedTo && !seen.has(cur.linkedTo)) { seen.add(cur.linkedTo); cur = byId('orders', cur.linkedTo); if (cur) list.push(cur); }
    return list;
  }
  function openOrder(id) {
    const o = byId('orders', id); if (!o) return;

  /* שינוי: הגדלה / הפחתה / הארכה / ניצול / גרסה — להזמנות ולהסכמים */
  function openChange(col, id, type) {
    const r = byId(col, id); const isO = col === 'orders';

      `<button class="btn primary" data-act="save-change" data-col="${col}" data-id="${id}" data-type="${type}">שמירה</button><button class="btn" data-act="close">ביטול</button>`);
  }
  async function saveChange(col, id, type) {
    const r = byId(col, id); const d = readForm($('#chgForm'));
    const patch = {}; const h = { type, date: d.date || today(), note: d.note, by: DB.user.name };
    const budgetKey = col === 'orders' ? 'budgetExVat' : 'targetValue';
    if (type === 'increase' || type === 'decrease') {
      if (!d.amount) return toast('יש להזין סכום', 'error');
      const nv = (r[budgetKey] || 0) + (type === 'increase' ? d.amount : -d.amount);
      patch[budgetKey] = nv; h.amount = d.amount;
      if (col === 'orders') { patch.vat = +(nv * VAT).toFixed(2); patch.budgetTotal = +(nv * (1 + VAT)).toFixed(2); }
    }
    if (type === 'extend') { if (!d.newEnd) return toast('יש לבחור תאריך', 'error'); patch.endDate = d.newEnd; h.newEnd = d.newEnd; }
    if (type === 'utilize') { patch.utilized = d.utilized || 0; h.type = 'note'; h.note = `ניצול עודכן ל‑${money(d.utilized)}${d.note ? ' · ' + d.note : ''}`; }
    if (type === 'version') { patch.version = d.version; h.version = d.version; }
    patch.history = [...(r.history || []), h];
    await DB.update(col, id, patch);
    DB.log(({ increase: 'הגדיל/ה', decrease: 'הפחית/ה', extend: 'האריך/ה', utilize: 'עדכן/ה ניצול', version: 'עדכן/ה גרסה' })[type], col, r.orderNumber || r.agreementNumber);
    toast('עודכן', 'ok');

  }

  }

  /* ---------------- משימות ---------------- */
  function taskCard(t) {
    const dl = t.dueDate ? daysLeft(t.dueDate) : null; const overdue = t.status !== 'done' && dl != null && dl < 0;
    const P = PRIORITY[t.priority] || PRIORITY.normal;
    const due = t.dueDate ? (dl === 0 ? 'היום' : dl === 1 ? 'מחר' : dfmt(t.dueDate)) : '';
    const lk = linksOf(t); const link = lk.slice(0, 3).map((x) => `${LINK_T[x.type].i} ${esc(entName(x.type, x.id))}`).join(' · ') + (lk.length > 3 ? ` +${lk.length - 3}` : '') + (t.tags || []).slice(0, 2).map((g) => ` #${esc(g)}`).join('');
    return `<div class="task p-${t.priority || 'normal'} ${overdue ? 'overdue' : ''}" draggable="true" data-task="${t.id}" data-act="open" data-kind="task" data-id="${t.id}"
      style="${t.status === 'done' ? 'opacity:.6' : ''}"><div class="t"><span class="j-key">${keyOf(t)}</span> ${t.status === 'done' ? '✔ ' : ''}${esc(t.title)}</div>
      <div class="m"><span class="pill ${P.c}">${P.l}</span>${due ? `<span class="due">📅 ${due}</span>` : ''}${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
      ${link ? `<span>${link}</span>` : ''}${(() => { const c = (t.comments || []).filter((x) => x.type !== 'system').length; return c ? `<span>🗂 ${c}</span>` : ''; })()}</div>
      ${(() => { const st = subStats(t); if (!st.total) return ''; const late = (t.subtasks || []).some((x) => !x.done && x.dueDate && daysLeft(x.dueDate) < 0);
        return `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:${late ? 'var(--c-alert)' : 'var(--muted)'}"><span>☑ ${st.done}/${st.total}</span><div class="bar" style="flex:1;min-width:40px"><span style="width:${pct(st.done, st.total)}%"></span></div></div>`; })()}</div>`;
  }
  function viewTasks() {
    const F = S.f;
    const assignees = [...new Set(S.tasks.map((t) => t.assignee).filter(Boolean))];
    const rows = S.tasks.filter((t) => match(t, S.q))
      .filter((t) => F.taskAssignee === 'all' || t.assignee === F.taskAssignee)
      .filter((t) => F.taskPriority === 'all' || t.priority === F.taskPriority)
      .filter((t) => { if (F.taskLink === 'all') return true; const [ty, ...rest] = F.taskLink.split(':'); const lid = rest.join(':'); return ty === 'tag' ? (t.tags || []).includes(lid) : hasLink(t, ty, lid) || related(ty, lid).tasks.includes(t); })
      .sort((a, b) => ({ urgent: 0, high: 1, normal: 2, low: 3 }[a.priority] ?? 2) - ({ urgent: 0, high: 1, normal: 2, low: 3 }[b.priority] ?? 2) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
    const toolbar = `<div class="toolbar">
      <div class="chips"><span class="chip ${F.taskView === 'kanban' ? 'on' : ''}" data-act="f" data-f="taskView" data-v="kanban">▦ לוח</span><span class="chip ${F.taskView === 'list' ? 'on' : ''}" data-act="f" data-f="taskView" data-v="list">☰ רשימה</span></div>
