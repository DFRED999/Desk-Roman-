  /* ---------------- קליטת PDF ---------------- */
  async function handlePdf(file) {
    if (!file || !/pdf$/i.test(file.type || file.name)) return toast('יש לגרור קובץ PDF', 'error');
    toast('קורא את ההזמנה…');
    try {
      const d = await OrderParser.parseOrderPdf(file);
      const found = d._found || [];
      if (!found.includes('orderNumber')) { openOrderEditor({ _fromPdf: true }, [], '<div class="banner warn">לא זוהה מבנה של הזמנת משהב"ט בקובץ. מלא את הפרטים ידנית.</div>'); return; }
      const prev = S.orders.filter((o) => o.orderNumber === d.orderNumber);
      if (prev.length) {
        const p = prev[0];
        const diff = [];
        if (d.budgetExVat && d.budgetExVat !== p.budgetExVat) diff.push(`תקציב: ${money(p.budgetExVat)} ← ${money(d.budgetExVat)}`);
        if (d.endDate && d.endDate !== p.endDate) diff.push(`סיום: ${dfmt(p.endDate)} ← ${dfmt(d.endDate)}`);
        if (d.version && d.version !== String(p.version)) diff.push(`גרסה: ${p.version} ← ${d.version}`);
        modal('ההזמנה כבר קיימת במערכת', `<p>הזמנה <b>${esc(d.orderNumber)}</b> כבר קיימת. ${diff.length ? 'בקובץ החדש זוהו שינויים:' : 'לא זוהו שינויים בתקציב, תוקף או גרסה.'}</p>
          ${diff.map((x) => `<div class="banner">${esc(x)}</div>`).join('')}`,
          `${diff.length ? `<button class="btn primary" data-act="apply-pdf" data-id="${p.id}">עדכן את ההזמנה הקיימת</button>` : ''}<button class="btn" data-act="open" data-kind="order" data-id="${p.id}">פתח הזמנה</button><button class="btn" data-act="close">סגור</button>`);
        S._pdf = d; return;
      }
      openOrderEditor({ ...d, demandBudget: d.budgetExVat, utilized: 0, _fromPdf: true }, found,
        `<div class="banner">✓ זוהו ${found.length} שדות מהקובץ <b>${esc(file.name)}</b> (מסומנים בירוק). בדוק, השלם "תקציב בדרישה" אם שונה, ושמור.</div>`);
      S._editing.prev = { _fromPdf: true };
    } catch (e) { console.error(e); toast('שגיאה בקריאת הקובץ: ' + e.message, 'error'); }
  }
  async function applyPdf(id) {
    const p = byId('orders', id); const d = S._pdf; const patch = { history: [...(p.history || [])] };
    if (d.budgetExVat && d.budgetExVat !== p.budgetExVat) { const delta = d.budgetExVat - (p.budgetExVat || 0);
      patch.history.push({ type: delta > 0 ? 'increase' : 'decrease', date: today(), amount: Math.abs(delta), note: `לפי גרסה ${d.version || ''} מקובץ PDF`, by: DB.user.name });
      patch.budgetExVat = d.budgetExVat; patch.vat = d.vat; patch.budgetTotal = d.budgetTotal; }
    if (d.endDate && d.endDate !== p.endDate) { patch.endDate = d.endDate; patch.history.push({ type: 'extend', date: today(), newEnd: d.endDate, note: 'לפי קובץ PDF', by: DB.user.name }); }
    if (d.version) patch.version = d.version;
    if (d.consultants) patch.consultants = d.consultants;
    await DB.update('orders', id, patch); DB.log('עדכן/ה הזמנה מ‑PDF', 'order', p.orderNumber);
    toast('ההזמנה עודכנה', 'ok'); openOrder(id);

      const L = { priority: 'עדיפות', assignee: 'אחראי/ת', dueDate: 'יעד', status: 'סטטוס' };
      const show = (k, val) => k === 'priority' ? (PRIORITY[val] || {}).l : k === 'status' ? SSTATUS[val].l : k === 'dueDate' ? dfmt(val) : val;
      await updateSubs(tg.tid, (l) => { const y = l.find((z) => z.id === tg.sid); y[f] = v; if (f === 'status') { y.done = v === 'done'; y.doneAt = v === 'done' ? new Date().toISOString() : ''; } },
        `תת‑משימה "${x ? x.title : ''}" — ${L[f]}: ${show(f, v) || '—'}`); return; }
    if (tg.subToggle) { const t = byId('tasks', tg.tid); const x = (t.subtasks || []).find((y) => y.id === tg.subToggle); const on = e.target.checked;
      await updateSubs(tg.tid, (l) => { const y = l.find((z) => z.id === tg.subToggle); y.done = on; y.doneAt = on ? new Date().toISOString() : ''; }, `${on ? 'בוצעה' : 'סומנה כלא בוצעה'} תת‑משימה: ${x ? x.title : ''}`); return; }
    if (tg.subDue) { const t = byId('tasks', tg.tid); const x = (t.subtasks || []).find((y) => y.id === tg.subDue); const v = e.target.value;
      await updateSubs(tg.tid, (l) => { l.find((z) => z.id === tg.subDue).dueDate = v; }, `יעד לתת‑משימה "${x ? x.title : ''}" ${v ? 'נקבע ל‑' + dfmt(v) : 'הוסר'}`); return; }
    if (e.target.dataset.fsel) { S.f[e.target.dataset.fsel] = e.target.value; render(); }
    if (e.target.dataset.r && e.target.tagName === 'SELECT') { S.report[e.target.dataset.r] = e.target.value; render(); }
  });
  document.addEventListener('click', async (e) => {
    const go = e.target.closest('[data-go]'); if (go) { location.hash = '#' + go.dataset.go; return; }
    const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('.fab-menu')) { const fm = $('#fabmenu'); fm && fm.classList.remove('open'); } return; }
    const a = el.dataset.act; const id = el.dataset.id;
    if (el.tagName === 'A') e.preventDefault();
    if (a !== 'fab') { const fm = $('#fabmenu'); fm && fm.classList.remove('open'); }
    switch (a) {
      case 'close': closeModal(); break;
      case 'open': e.stopPropagation(); openDetail(el.dataset.kind, id); break;
      case 'fab': $('#fabmenu').classList.toggle('open'); break;
      case 'sort': { const k = el.dataset.k, key = el.dataset.key; const s = S.f.sort[key]; S.f.sort[key] = { k, dir: s && s.k === k ? -s.dir : 1 }; render(); break; }
      case 'f': S.f[el.dataset.f] = el.dataset.v; render(); break;
      case 'alerts': { const al = computeAlerts(); modal(`התראות (${al.length})`, `<div class="alerts" style="max-height:none">${al.map(alertHTML).join('') || '<div class="empty">🎉 אין התראות</div>'}</div>`); break; }
      case 'snooze': { e.stopPropagation(); const st = settings(); await DB.set('settings', 'main', { snoozed: { ...(st.snoozed || {}), [el.dataset.key]: addDays(today(), 7) } }); toast('ההתראה הושתקה לשבוע'); const m = $('#modal'); if (m) { closeModal(); setTimeout(() => $('[data-act=alerts]').click(), 60); } break; }
      case 'unsnooze': await DB.set('settings', 'main', { snoozed: {} }); toast('כל ההתראות הוחזרו', 'ok'); break;
      case 'user': location.hash = '#settings'; break;
      // הזמנות
      case 'new-order': openOrderEditor(); break;
      case 'edit-order': openOrderEditor(byId('orders', id)); break;
      case 'save-order': saveOrder(); break;
      case 'add-cons': $('#consRows').insertAdjacentHTML('beforeend', consRow()); break;
      case 'rm-cons': el.closest('.cons-row').remove(); break;
      case 'link-order': openLinkOrder(id); break;
      case 'do-link': { const to = $('#linkSel').value; if (!to) return toast('בחר הזמנה', 'error'); const o = byId('orders', id); const t = byId('orders', to);
        await DB.update('orders', id, { linkedTo: to, history: [...(o.history || []), { type: 'link', date: today(), note: `הועברה להזמנת המשך ${t.orderNumber}`, by: DB.user.name }] });
        await DB.update('orders', to, { parentId: id }); DB.log('קישר/ה הזמנת המשך', 'order', o.orderNumber); openOrder(id); break; }
      case 'link-new': { const o = byId('orders', id); openOrderEditor({ parentId: id, demandNumber: o.demandNumber, supplier: o.supplier, supplierNumber: o.supplierNumber, description: o.description, unit: o.unit, buyer: o.buyer, method: o.method, startDate: addDays(o.endDate, 1), consultants: o.consultants }); break; }
      case 'apply-pdf': applyPdf(id); break;
      case 'change': openChange(el.dataset.col, id, el.dataset.type); break;
      case 'save-change': saveChange(el.dataset.col, id, el.dataset.type); break;
      case 'del': { const col = el.dataset.col; const r = byId(col, id); if (!(await ask('למחוק לצמיתות?'))) return; await DB.remove(col, id); DB.log('מחק/ה', col, r.orderNumber || r.agreementNumber || r.title); closeModal(); toast('נמחק'); break; }
      // הסכמים
      case 'new-agreement': openAgreementEditor(); break;
      case 'edit-agreement': openAgreementEditor(byId('agreements', id)); break;
      case 'save-agreement': saveAgreement(); break;
      // משימות
      case 'new-task': openTaskEditor(); break;
      case 'quick-task': openTaskEditor({ priority: 'normal', dueDate: addDays(today(), 1) }, true); break;
      case 'edit-task': openTaskEditor(byId('tasks', id)); break;
      case 'save-task': saveTask(); break;
      case 'task-for': openTaskEditor({ links: [{ type: el.dataset.kind, id }], category: el.dataset.kind === 'order' ? 'הזמנות' : 'הסכמים' }); break;
      case 'task-links': openTaskEditor({ links: JSON.parse(el.dataset.links || '[]'), tags: el.dataset.tag ? [el.dataset.tag] : [] }); break;
      case 'link-picker': openLinkPicker(id); break;
      case 'pick-tab': openLinkPicker(id, el.dataset.v); break;
      case 'pick-link': await addLink(id, el.dataset.type, el.dataset.lid); break;
      case 'unlink': e.stopPropagation(); await removeLink(id, el.dataset.type, el.dataset.lid); break;
      case 'untag': { e.stopPropagation(); const t = byId('tasks', id); const tags = (t.tags || []).filter((x) => x !== el.dataset.tag); await DB.update('tasks', id, { tags, comments: [...(t.comments || []), logEntry('הוסרה תגית #' + el.dataset.tag)] }); break; }
      case 'pick-new': { const v = $('#pickNew').value.trim(); if (!v) return $('#pickNew').focus(); const ty = el.dataset.type;
        const nid = await DB.add(ty === 'project' ? 'projects' : 'people', ty === 'project' ? { name: v, status: 'active' } : { name: v, type: 'אחר' });
        DB.log(ty === 'project' ? 'הוסיף/ה פרויקט' : 'הוסיף/ה איש קשר', ty, v); await addLink(id, ty, nid); break; }
      case 'more-nav': modal('תפריט', `<div class="more-nav">${NAV.map((x) => `<a href="#${x.id}" data-act="close-go">${ICONS[x.id === 'config' ? 'settings' : x.id]}<span>${x.label}</span></a>`).join('')}</div>`); break;
      case 'close-go': closeModal(); location.hash = el.getAttribute('href'); break;
      case 'new-project': openProjectEditor(); break;
      case 'edit-project': openProjectEditor(byId('projects', id)); break;
      case 'save-project': { const d = readForm($('#projForm')); if (!d.name) return toast('חובה לכתוב שם', 'error');
        if (id) await DB.update('projects', id, d); else await DB.add('projects', d); DB.log(id ? 'עדכן/ה פרויקט' : 'הוסיף/ה פרויקט', 'project', d.name); closeModal(); toast('הפרויקט נשמר', 'ok'); break; }
      case 'new-person': openPersonEditor(); break;
      case 'edit-person': openPersonEditor(byId('people', id)); break;
      case 'save-person': { const d = readForm($('#personForm')); if (!d.name) return toast('חובה לכתוב שם', 'error');
        if (id) await DB.update('people', id, d); else await DB.add('people', d); DB.log(id ? 'עדכן/ה איש קשר' : 'הוסיף/ה איש קשר', 'person', d.name); closeModal(); toast('איש הקשר נשמר', 'ok'); break; }
      case 'import-consultants': { const names = [...new Set(S.orders.flatMap((o) => (o.consultants || []).map((c) => c.name)).filter(Boolean))].filter((nm) => !S.people.some((p) => norm(p.name) === norm(nm)));
        for (const nm of names) { const o = S.orders.find((x) => (x.consultants || []).some((c) => c.name === nm)); await DB.add('people', { name: nm, type: 'יועץ / נותן שירות', company: o ? o.supplier || '' : '', projectId: o ? o.projectId || '' : '' }); }
        toast(`נוספו ${names.length} אנשי קשר`, 'ok'); break; }
      case 'ent-report': { const ty = el.dataset.type; S.report = { ...defaultReport(), title: 'תיק ' + entName(ty, id), link: `${ty}:${id}`, status: 'all', taskStatus: 'all' }; closeModal(); location.hash = '#reports'; break; }
      case 'prio': $$('#prioChips .chip').forEach((c) => c.classList.toggle('on', c === el)); $('#taskForm [name=priority]').value = el.dataset.v; break;
      case 'due': $('#taskForm [name=dueDate]').value = addDays(today(), +el.dataset.d); break;
      case 'tstatus': await setTaskStatus(id, el.dataset.v); break;
      case 'comment': { const v = $('#cmt').value.trim(); if (!v) return toast('כתוב מה לרשום ביומן', 'error'); const t = byId('tasks', id);
        const type = ($('#logType .chip.on') || {}).dataset?.v || 'note'; const atEl = $('#cmtAt'); const atv = atEl.value; const at = atv && atv !== atEl.dataset.default ? new Date(atv).toISOString() : undefined;
        $('#cmt').value = '';
        await DB.update('tasks', id, { comments: [...(t.comments || []), logEntry(v, type, at)] }); toast('נרשם ביומן', 'ok'); break; }
      case 'acttab': S.actTab = el.dataset.v; openTask(S._openDetail[1]); break;
      case 'logtype': $$('#logType .chip').forEach((c) => c.classList.toggle('on', c === el)); break;
      case 'sub-add': { const ti = $('#subTitle'); const v = ti.value.trim(); if (!v) return ti.focus(); const due = $('#subDue').value;
        ti.value = ''; $('#subDue').value = '';
        await updateSubs(id, (l) => l.push({ id: sid(), title: v, dueDate: due, done: false, status: 'new', priority: 'normal', createdAt: new Date().toISOString(), by: DB.user.name }), `נוספה תת‑משימה: ${v}${due ? ' (יעד ' + dfmt(due) + ')' : ''}`);
        setTimeout(() => { const n = $('#subTitle'); n && n.focus(); }, 80); break; }
      case 'sub-del': { if (!(await ask('למחוק את תת‑המשימה?'))) return; const t = byId('tasks', id); const x = (t.subtasks || []).find((y) => y.id === el.dataset.sid);
        await updateSubs(id, (l) => { const i = l.findIndex((y) => y.id === el.dataset.sid); if (i >= 0) l.splice(i, 1); }, x ? `נמחקה תת‑משימה: ${x.title}` : ''); break; }
      case 'note-sub': openNoteToSub(id); break;
      case 'do-note-sub': { const tid = $('#nsTask').value; if (!tid) return toast('בחר משימה ראשית', 'error'); const x = byId('notes', id); const due = $('#nsDue').value;
        await updateSubs(tid, (l) => l.push({ id: sid(), title: x.text, dueDate: due, done: false, createdAt: new Date().toISOString(), by: DB.user.name }), `נוספה תת‑משימה מפיתקית: ${x.text.split('\n')[0].slice(0, 80)}`);
        await DB.remove('notes', id); closeModal(); toast('הפיתקית נוספה כתת‑משימה', 'ok'); break; }
      // פיתקיות
      case 'quick-note': if (S.route !== 'notes') { location.hash = '#notes'; setTimeout(() => $('#qn') && $('#qn').focus(), 120); } else $('#qn').focus(); break;
      case 'add-note': addNote($('#qn').value); $('#qn').value = ''; break;
      case 'note-color': DB.update('notes', id, { color: el.dataset.c }); break;
      case 'note-pin': DB.update('notes', id, { pinned: !byId('notes', id).pinned }); break;
      case 'note-del': if (await ask('למחוק את הפיתקית?')) DB.remove('notes', id); break;
      case 'note-task': { const x = byId('notes', id); openTaskEditor({ title: x.text.split('\n')[0].slice(0, 120), description: x.text, _fromNote: id }); break; }
      // דוחות
      case 'report-quick': S.report = defaultReport(); location.hash = '#reports'; break;
      case 'rq': { const presets = [{ sections: ['orders', 'agreements', 'tasks'], status: 'active', taskStatus: 'open' }, { sections: ['orders', 'agreements'], status: 'ending' }, { sections: ['orders'], status: 'all' }, { sections: ['agreements'], status: 'all' }, { sections: ['tasks'], taskStatus: 'open' }];
        S.report = { ...defaultReport(), ...presets[+el.dataset.i], title: el.textContent.replace(/^\S+\s/, '').trim() }; render(); break; }
      case 'rp': if (e.target.dataset.act === 'rp-del') break; S.report = JSON.parse(JSON.stringify(settings().reportPresets[+el.dataset.i])); render(); break;
      case 'rp-del': { e.stopPropagation(); const p = (settings().reportPresets || []).slice(); p.splice(+el.dataset.i, 1); await DB.set('settings', 'main', { reportPresets: p }); break; }
      case 'rsec': { const s = S.report.sections; const v = el.dataset.v; S.report.sections = s.includes(v) ? s.filter((x) => x !== v) : [...s, v].sort((a, b) => ['orders', 'agreements', 'tasks'].indexOf(a) - ['orders', 'agreements', 'tasks'].indexOf(b)); render(); break; }
      case 'rcol': { const c = S.report.cols[el.dataset.sec]; const v = el.dataset.v; S.report.cols[el.dataset.sec] = c.includes(v) ? c.filter((x) => x !== v) : REPORT_COLS[el.dataset.sec].map(([k]) => k).filter((k) => c.includes(k) || k === v); render(); break; }
      case 'export-xlsx': exportXlsx(S.report); break;
      case 'export-pdf': exportPdf(S.report); break;
      case 'export-print': exportPrint(S.report); break;
      case 'save-preset': { const name = await ask('שם התבנית:', true, S.report.title); if (!name) return; await DB.set('settings', 'main', { reportPresets: [...(settings().reportPresets || []), { ...JSON.parse(JSON.stringify(S.report)), title: name }] }); toast('התבנית נשמרה', 'ok'); break; }
      // הגדרות
      case 'save-settings': { const d = readForm($('#setForm')); await DB.set('settings', 'main', d); toast('ההגדרות נשמרו', 'ok'); break; }
      case 'role': DB.setDemoRole(el.dataset.v); break;
      case 'reset-demo': if (await ask('לאפס את נתוני ההדגמה?')) DB.resetDemo(); break;
      case 'switch-user': DB.clearProfile(); break;
      case 'logout': DB.signOut().then(() => location.reload()); break;
      case 'backup': { const blob = new Blob([JSON.stringify(DB.exportAll(S), null, 2)], { type: 'application/json' }); const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = `גיבוי-מרכז-שליטה-${today()}.json`; l.click(); break; }
      case 'notif': if ('Notification' in window) Notification.requestPermission().then((p) => { toast(p === 'granted' ? 'התראות דפדפן הופעלו' : 'ההרשאה לא ניתנה'); if (p === 'granted') notifyDue(true); }); break;
    }
  });
  document.addEventListener('focusout', async (e) => {
    const tg = e.target.dataset || {};
    if (tg.tedit) { const v = e.target.innerText.trim(); if (tg.tedit === 'title' && !v) { e.target.innerText = byId('tasks', tg.tid).title; return; } await setTaskField(tg.tid, tg.tedit, v); }
    if (tg.sedit) { const v = e.target.innerText.trim(); const t = byId('tasks', tg.tid); const x = (t.subtasks || []).find((y) => y.id === tg.sedit);
      if (!v || !x || x.title === v) { if (x) e.target.innerText = x.title; return; }
      await updateSubs(tg.tid, (l) => { l.find((z) => z.id === tg.sedit).title = v; }, `תת‑משימה שונתה: "${x.title}" ← "${v}"`); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.target.dataset?.sedit || e.target.dataset?.tedit === 'title')) { e.preventDefault(); e.target.blur(); return; }
    if (e.key === 'Enter' && e.target.dataset?.tagAdd) { e.preventDefault(); const tid = e.target.dataset.tagAdd; const v = e.target.value.trim().replace(/^#/, ''); if (!v) return; const t = byId('tasks', tid);
      if (!(t.tags || []).includes(v)) DB.update('tasks', tid, { tags: [...(t.tags || []), v], comments: [...(t.comments || []), logEntry('נוספה תגית #' + v)] }); e.target.value = ''; return; } if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && e.target.id === 'subTitle') { e.preventDefault(); $('[data-act=sub-add]').click(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'cmt') { e.preventDefault(); $('[data-act=comment]').click(); } });

  /* גרירת PDF לכל מקום בעמוד */
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (!e.dataTransfer.types.includes('Files')) return; dragDepth++; if (!$('.page-drop')) document.body.insertAdjacentHTML('beforeend', '<div class="page-drop"><div>📥 שחרר כאן את קובץ ההזמנה</div></div>'); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { const p = $('.page-drop'); p && p.remove(); } });
  window.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); dragDepth = 0; const p = $('.page-drop'); p && p.remove(); handlePdf(e.dataTransfer.files[0]); });

  /* התראות דפדפן — פעם ביום */
  function notifyDue(force) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const key = 'atlas-notified-' + today();
    try { if (!force && localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
    const bad = computeAlerts().filter((a) => a.level === 'bad');
    if (bad.length) new Notification('מרכז שליטה', { body: `${bad.length} התראות דחופות: ${bad.slice(0, 3).map((a) => a.title).join(' · ')}` });
  }

  /* ---------------- מסך כניסה ---------------- */
  function loginView() {
    $('#root').innerHTML = `<div class="login"><form class="box" id="loginForm"><div class="brand-logo" style="width:56px;height:56px;font-size:26px;color:#fff">✦</div>
      <h1>מרכז שליטה</h1><p>הזמנות · הסכמים · משימות</p>
      <div class="field"><label>אימייל</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>סיסמה</label><input name="pw" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" style="width:100%;padding:13px">כניסה</button>
      <button type="button" class="btn ghost" id="forgot" style="width:100%;margin-top:6px">שכחתי סיסמה</button></form></div>`;
    $('#loginForm').onsubmit = async (e) => { e.preventDefault(); try { await DB.signIn(e.target.email.value, e.target.pw.value); location.reload(); } catch (err) { toast('פרטי כניסה שגויים', 'error'); } };
    $('#forgot').onclick = async () => { const em = $('#loginForm').email.value; if (!em) return toast('הזן אימייל', 'error'); try { await DB.resetPassword(em); toast('נשלח מייל לאיפוס', 'ok'); } catch (e) { toast('שגיאה', 'error'); } };
  }

  /* ---------------- הפעלה ---------------- */
  function profileView() {
    $('#root').innerHTML = `<div class="login"><form class="box" id="profForm"><div class="brand-logo" style="width:56px;height:56px;font-size:26px;color:#fff">✦</div>
      <h1>מי נכנס?</h1><p>בוחרים פעם אחת במכשיר הזה. אפשר לשנות בהגדרות.</p>
      <div class="chips" style="margin-bottom:14px" id="roleChips">
        <span class="chip on" data-role="commander">מפקד</span><span class="chip" data-role="assistant">רל"שית</span><span class="chip" data-role="admin">מנהל</span></div>
      <div class="field"><label>השם שיוצג</label><input name="name" required placeholder="למשל: דניס"></div>
      <button class="btn primary" style="width:100%;padding:13px">כניסה</button></form></div>`;
    let role = 'commander';
    $$('#roleChips .chip').forEach((c) => { c.onclick = () => { role = c.dataset.role; $$('#roleChips .chip').forEach((x) => x.classList.toggle('on', x === c)); }; });
    $('#profForm').onsubmit = (e) => { e.preventDefault(); DB.setProfile(e.target.name.value.trim(), role); };
  }

  DB.init().then((user) => {
    if (!user) return loginView();
    if (user.needsProfile) return profileView();
    ['orders', 'agreements', 'tasks', 'notes', 'activity', 'projects', 'people'].forEach((c) => DB.subscribe(c, (arr) => { S[c] = arr; scheduleRender(); }));
    DB.subscribe('settings', (arr) => { S.settingsDocs = arr; scheduleRender(); });
    window.addEventListener('hashchange', () => { S.q = ''; const sr = $('#search-results'); sr && (sr.innerHTML = ''); render(); window.scrollTo(0, 0); });
    let lastW = window.innerWidth; window.addEventListener('resize', () => { if ((lastW > 760) !== (window.innerWidth > 760)) render(); lastW = window.innerWidth; });
    render();
    setTimeout(() => notifyDue(false), 2000);
  });
})();

</script>
